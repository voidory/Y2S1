            return { normalizedGrade: 0, passed: false, feedback: 'Target isomer canonical key unavailable.' };
          }
          if (userCanon === targetCanon) {
            return { normalizedGrade: 1, passed: true, feedback: 'Exact 3D isomer construction verified by rotational point-group canonicalization!' };
          }
          if (evaluator.allowMirror) {
            const mirrorCfg = IsomerEngine.applyCfg(G.sigma.perm, cfg);
            if (IsomerEngine.canon(mirrorCfg, G.rots) === targetCanon) {
              return { normalizedGrade: 1, passed: true, feedback: 'Exact enantiomeric construction verified.' };
            }
          }
          // Check if user built a different valid isomer of the same formula
          const inEdge = new Set(cfg.edges.flat());
          const mono = cfg.labels.filter((_, i) => !inEdge.has(i)).join('');
          const targetCase = IsomerEngine.ANALYSIS[evaluator.targetCaseId]?.c;
          const targetIso = IsomerEngine.isoById[evaluator.targetIsoId];
          if (targetCase && mono.split('').sort().join('') === (targetCase.mono || '').split('').sort().join('')) {
            return {
              normalizedGrade: 0.25,
              passed: false,
              feedback: `Valid ${geom} coordination geometry, but spatial arrangement does not match target isomer (${targetIso?.label?.replace(/<[^>]+>/g, '') || 'target'}).`,
            };
          }
          return {
            normalizedGrade: 0,
            passed: false,
            feedback: `Constructed ligand composition/geometry does not match target isomer (${targetIso?.label?.replace(/<[^>]+>/g, '') || 'target'}).`,
          };
        }

        return { normalizedGrade: 0, passed: false, feedback: 'Unsupported widget evaluator.' };
      }

      function gradeAtomicRubric(evaluator, rubricChecks = {}) {
        const items = evaluator.rubric || [];
        if (!items.length) return { normalizedGrade: 0, passed: false, vetoApplied: false, missedSkillTags: [], totalMarks: 0, earnedMarks: 0 };

        let totalMarks = 0;
        let earnedMarks = 0;
        let criticalMissed = false;
        const missedSkillTags = new Set();

        for (const item of items) {
          const marks = Number(item.marks ?? 1);
          totalMarks += marks;
          const checked = Boolean(rubricChecks[item.id]);
          if (checked) {
            earnedMarks += marks;
          } else {
            if (item.isCritical) criticalMissed = true;
            if (item.linkedSkillTag) missedSkillTags.add(item.linkedSkillTag);
          }
        }

        const rawGrade = totalMarks > 0 ? earnedMarks / totalMarks : 0;
        const vetoApplied = criticalMissed;
        const effectiveGrade = vetoApplied ? Math.min(rawGrade, 0.45) : rawGrade;

        return {
          normalizedGrade: Number(effectiveGrade.toFixed(4)),
          rawGrade: Number(rawGrade.toFixed(4)),
          passed: effectiveGrade >= 0.70,
          vetoApplied,
          earnedMarks: Number(earnedMarks.toFixed(2)),
          totalMarks: Number(totalMarks.toFixed(2)),
          missedSkillTags: [...missedSkillTags],
          feedback: vetoApplied
            ? `A critical step was missed, so the score is capped at 45% (${Math.round(effectiveGrade * 100)}%).`
            : `Self-assessed ${earnedMarks}/${totalMarks} marks (${Math.round(effectiveGrade * 100)}%).`,
        };
      }

      function gradeOrderMatch(evaluator, userInput) {
        const targetOrder = (evaluator.targetOrder || evaluator.expectedOrder || []).map((x) => String(x));
        const userOrder = Array.isArray(userInput) ? userInput.map((x) => String(x)) : [];
        const n = targetOrder.length;
        if (n < 2) {
          const ok = n === 1 && userOrder[0] === targetOrder[0];
          return {
            normalizedGrade: ok ? 1 : 0,
            passed: ok,
            discordantPairs: ok ? 0 : 1,
            totalPairs: 1,
            correctOrder: targetOrder.slice(),
            feedback: ok ? 'Exact ordering matched.' : `Correct order: ${targetOrder.join(' → ')}`,
          };
        }

        const isExact = userOrder.length === n && targetOrder.every((val, idx) => userOrder[idx] === val);
        const totalPairs = (n * (n - 1)) / 2;
        let discordantPairs = 0;
        for (let i = 0; i < n; i++) {
          for (let j = i + 1; j < n; j++) {
            const posA = userOrder.indexOf(targetOrder[i]);
            const posB = userOrder.indexOf(targetOrder[j]);
            if (posA === -1 || posB === -1 || posA > posB) {
              discordantPairs += 1;
            }
          }
        }

        const grade = isExact ? 1 : Math.max(0, 1 - (2 * discordantPairs) / totalPairs);
        return {
          normalizedGrade: Number(grade.toFixed(4)),
          passed: grade >= 0.70,
          discordantPairs,
          totalPairs,
          correctOrder: targetOrder.slice(),
          feedback: isExact
            ? 'Exact ordering verified.'
            : `Order mismatch: ${discordantPairs} of ${totalPairs} pair(s) discordant. Correct order: ${targetOrder.join(' → ')}`,
        };
      }

      function gradeIsomerSetMatch(evaluator, userInput) {
        const caseId = evaluator.formulaCaseId || evaluator.targetCaseId;
        const countEnantiomers = Boolean(evaluator.countEnantiomersSeparately);
        const A = caseId ? IsomerEngine.ANALYSIS[caseId] : null;
        const expected = Math.max(1, Number(evaluator.expectedCount) || (A ? (countEnantiomers ? A.stereo : A.geometric) : 1));
        const foundList = Array.isArray(userInput?.found)
          ? userInput.found
          : (typeof userInput?.found === 'number' ? new Array(userInput.found) : []);
        const found = Math.min(expected, foundList.length);
        const duplicates = Math.max(0, Number(userInput?.duplicates ?? userInput?.duplicatesSubmitted ?? 0));
        const rawGrade = (found / expected) - 0.25 * duplicates;
        const grade = Math.max(0, Math.min(1, rawGrade));

        return {
          normalizedGrade: Number(grade.toFixed(4)),
          passed: grade >= 0.70,
          found,
          expected,
          duplicates,
          feedback: `Found ${found} / ${expected} isomer(s)${duplicates > 0 ? ` with ${duplicates} duplicate submission(s) (−${(duplicates * 0.25).toFixed(2)} penalty)` : ''}.`,
        };
      }

      function normalizeNomenclatureName(raw) {
        return String(raw ?? '')
          .toLowerCase()
          .replace(/[\u2010-\u2015\u2212]/g, '-')
          .replace(/-/g, '')
          .replace(/\s*\(\s*/g, '(')
          .replace(/\s*\)\s*/g, ')')
          .replace(/\s+/g, ' ')
          .trim();
      }

      function normalizeNomenclatureCompact(raw) {
        return normalizeNomenclatureName(raw).replace(/\s+/g, '');
      }

      function gradeNameMatch(evaluator, userInput) {
        const raw = String(userInput ?? '').trim();
        const accepted = Array.isArray(evaluator.acceptedNames)
          ? evaluator.acceptedNames
          : (evaluator.acceptedName ? [evaluator.acceptedName] : []);

        if (!raw) {
          return {
            normalizedGrade: 0,
            passed: false,
            matchedErrors: [],
            feedback: 'No IUPAC name entered.',
          };
        }

        const normUser = normalizeNomenclatureName(raw);
        const compactUser = normalizeNomenclatureCompact(raw);

        for (const acc of accepted) {
          if (normUser === normalizeNomenclatureName(acc) || compactUser === normalizeNomenclatureCompact(acc)) {
            return {
              normalizedGrade: 1,
              passed: true,
              matchedErrors: [],
              expectedDisplay: acc,
              feedback: `Correct IUPAC nomenclature (${acc}).`,
            };
          }
        }

        const primaryAccepted = String(accepted[0] || '');
        const lowerRaw = raw.toLowerCase();
        const matchedMessages = [];
        let bestPartial = 0;

        const commonErrors = Array.isArray(evaluator.commonErrors) ? evaluator.commonErrors : [];
        for (const err of commonErrors) {
          if (!err) continue;
          const msg = err.feedback || err.message || err.hint || 'Check IUPAC nomenclature rules.';
          const errScore = Number(err.score ?? err.partialCredit ?? 0);
          let hit = false;

          if (err.pattern) {
            try {
              const rx = err.pattern instanceof RegExp ? err.pattern : new RegExp(err.pattern, 'i');
              if (rx.test(raw) || rx.test(normUser)) hit = true;
            } catch (_) {}
          }
          if (!hit && (err.match || err.wrongName)) {
            const targetWrong = String(err.match || err.wrongName);
            if (normUser.includes(normalizeNomenclatureName(targetWrong)) || compactUser.includes(normalizeNomenclatureCompact(targetWrong))) {
              hit = true;
            }
          }
          const code = String(err.type || err.code || err.id || err.error || '').toLowerCase();
          if (!hit && code) {
            if (code.includes('ammine') || code.includes('amine')) {
              if (/ammine/i.test(primaryAccepted) && /(?:^|[^m])amine/i.test(lowerRaw) && !/ammine/i.test(lowerRaw)) hit = true;
            }
            if (code.includes('ate') || code.includes('anionic')) {
              if (/ate\s*\(/i.test(primaryAccepted) && !/ate\s*\(/i.test(lowerRaw)) hit = true;
            }
            if (code.includes('alpha') || code.includes('order')) {
              if (Array.isArray(err.ligands) && err.ligands.length >= 2) {
                const sorted = err.ligands.slice().map((l) => l.toLowerCase()).sort();
                const positions = sorted.map((l) => lowerRaw.indexOf(l));
                if (positions.every((p) => p >= 0)) {
                  for (let i = 0; i < positions.length - 1; i++) {
                    if (positions[i] > positions[i + 1]) { hit = true; break; }
                  }
                }
              } else {
                hit = true;
              }
            }
            if (code.includes('oxidation') || code.includes('roman')) {
              if (/\([ivx0]+\)/i.test(primaryAccepted) && !/\([ivx0]+\)/i.test(lowerRaw)) hit = true;
            }
          }

          if (hit) {
            matchedMessages.push(msg);
            if (errScore > bestPartial) bestPartial = errScore;
          }
        }

        // Built-in fallback diagnostics when primaryAccepted is available and no custom pattern matched yet
        if (matchedMessages.length === 0 && primaryAccepted) {
          if (/ammine/i.test(primaryAccepted) && /(?:^|[^m])amine/i.test(lowerRaw) && !/ammine/i.test(lowerRaw)) {
            matchedMessages.push('Spelling error: NH₃ as a ligand is spelled "ammine" (double m), whereas "amine" (single m) denotes an organic RNH₂ ligand.');
          }
          if (/(ferrate|cobaltate|platinate|chromate|nickelate|cuprate|zincate|manganate|palladate|aurate|argentate)/i.test(primaryAccepted)
            && !/ate(\s*\(|$)/i.test(lowerRaw)) {
            matchedMessages.push('Anionic complex metal suffix missing: use the "-ate" suffix on the metal in an anionic coordination sphere (e.g. ferrate, cobaltate, platinate).');
          }
          if (/\([ivx0]+\)/i.test(primaryAccepted) && !/\([ivx0]+\)/i.test(lowerRaw)) {
            matchedMessages.push('Missing oxidation state: specify the metal oxidation state in Roman numerals in parentheses without spaces, e.g. (II) or (III).');
          }
        }

        const feedbackText = matchedMessages.length
          ? matchedMessages.join(' ')
          : `Incorrect IUPAC name. Expected: ${primaryAccepted || 'valid IUPAC name'}.`;

        return {
          normalizedGrade: Number(bestPartial.toFixed(4)),
          passed: bestPartial >= 0.70,
          matchedErrors: matchedMessages,
          expectedDisplay: primaryAccepted,
          feedback: feedbackText,
        };
      }

      const SUPERSCRIPT_MAP = {
        '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4',
        '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9',
        '⁺': '+', '⁻': '-',
      };
      const SUBSCRIPT_MAP = {
        '₀': '0', '₁': '1', '₂': '2', '₃': '3', '₄': '4',
        '₅': '5', '₆': '6', '₇': '7', '₈': '8', '₉': '9',
      };

      function normalizeChemText(str) {
        let s = String(str ?? '')
          .replace(/[−–—]/g, '-')
          .replace(/[₀₁₂₃₄₅₆₇₈₉]/g, (ch) => SUBSCRIPT_MAP[ch] || ch);
        // Convert contiguous unicode superscripts into ^...
        s = s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻]+/g, (seq) => {
          const mapped = seq.split('').map((c) => SUPERSCRIPT_MAP[c] || c).join('');
          if (mapped.includes('+') || mapped.includes('-')) return `^${mapped}`;
          return mapped;
        });
        // Strip state symbols (s), (l), (g), (aq) case-insensitively
        s = s.replace(/\s*\((?:s|l|g|aq)\)/gi, '');
        return s.trim();
      }

      function parseSingleFormulaUnit(unitStr) {
        const s = String(unitStr || '').trim();
        const stack = [{}];
        let i = 0;
        while (i < s.length) {
          const ch = s[i];
          if (ch === '(' || ch === '[') {
            stack.push({});
            i += 1;
          } else if (ch === ')' || ch === ']') {
            i += 1;
            let numStr = '';
            while (i < s.length && /\d/.test(s[i])) {
              numStr += s[i];
              i += 1;
            }
            const mult = numStr ? Number(numStr) : 1;
            const popped = stack.pop() || {};
            const top = stack[stack.length - 1];
            for (const [el, cnt] of Object.entries(popped)) {
              top[el] = (top[el] || 0) + cnt * mult;
            }
          } else if (/[A-Z]/.test(ch)) {
            let el = ch;
            i += 1;
            while (i < s.length && /[a-z]/.test(s[i])) {
              el += s[i];
              i += 1;
            }
            let numStr = '';
            while (i < s.length && /\d/.test(s[i])) {
              numStr += s[i];
              i += 1;
            }
            const cnt = numStr ? Number(numStr) : 1;
            const top = stack[stack.length - 1];
            top[el] = (top[el] || 0) + cnt;
          } else {
            i += 1;
          }
        }
        while (stack.length > 1) {
          const popped = stack.pop();
          const top = stack[stack.length - 1];
          for (const [el, cnt] of Object.entries(popped)) {
            top[el] = (top[el] || 0) + cnt;
          }
        }
        return stack[0];
      }

      function parseChemicalFormulaCounts(formulaStr) {
        const total = {};
        // Split by hydrate dot characters: ·, •, ., *
        const parts = String(formulaStr || '').split(/[·•.*]/).map((p) => p.trim()).filter(Boolean);
        for (const part of parts) {
          const m = part.match(/^(\d+)\s*(.+)$/);
          const mult = m ? Number(m[1]) : 1;
          const body = m ? m[2].trim() : part;
          const counts = parseSingleFormulaUnit(body);
          for (const [el, cnt] of Object.entries(counts)) {
            total[el] = (total[el] || 0) + cnt * mult;
          }
        }
        return total;
      }

      function buildSpeciesReading(coeff, elements, charge, displayFormula) {
        const elemPart = Object.keys(elements)
          .filter((el) => elements[el] > 0)
          .sort()
          .map((el) => `${el}:${elements[el]}`)
          .join(',');
        const key = `${elemPart}|${charge}`;
        return {
          coeff,
          elements,
          charge,
          key,
          display: displayFormula,
        };
      }

      function parseChemicalSpeciesVariants(rawTerm) {
        let s = normalizeChemText(rawTerm);
        if (!s) return [];

        // Check for leading stoichiometric integer coefficient
        let coeff = 1;
        const coeffMatch = s.match(/^(\d+)\s*(.+)$/);
        if (coeffMatch) {
          coeff = Number(coeffMatch[1]);
          s = coeffMatch[2].trim();
        }

        // Check if electron ("e-", "e^-", "e^1-")
        if (/^e(?:\s*\^?\s*1?\s*-|\s*-)?$/i.test(s)) {
          return [{
            coeff,
            elements: {},
            charge: -1,
            key: 'e|-1',
            display: 'e-',
          }];
        }

        const displayFormula = s.replace(/\s+/g, '');

        // 1. Explicit caret charge: unambiguous (e.g. NH4^+, O2^2-, ^2-, ^-2, ^2+, ^+2, ^-, ^+)
        const caretMatch = s.match(/^(.*?)\s*\^(?:(\d+)([+-])|([+-])(\d+)|([+-]))$/);
        if (caretMatch) {
          const formulaBody = caretMatch[1].trim();
          const mag = Number(caretMatch[2] || caretMatch[5] || 1);
          const sgn = (caretMatch[3] || caretMatch[4] || caretMatch[6]) === '+' ? 1 : -1;
          const elements = parseChemicalFormulaCounts(formulaBody);
          return [buildSpeciesReading(coeff, elements, sgn * mag, displayFormula)];
        }

        // 2. Space-separated trailing charge: unambiguous (e.g. "SO4 2-", "Fe 3+")
        const spaceCharge = s.match(/^(.*?)\s+(\d*)([+-])$/);
        if (spaceCharge) {
          const formulaBody = spaceCharge[1].trim();
          const mag = spaceCharge[2] ? Number(spaceCharge[2]) : 1;
          const sgn = spaceCharge[3] === '+' ? 1 : -1;
          const elements = parseChemicalFormulaCounts(formulaBody);
          return [buildSpeciesReading(coeff, elements, sgn * mag, displayFormula)];
        }

        // 3. Charge after closing bracket ], unambiguous (e.g. "[Fe(CN)6]4-" or "[Co(NH3)6]3+")
        const bracketCharge = s.match(/^(\[.+\])(\d*)([+-])$/);
        if (bracketCharge) {
          const formulaBody = bracketCharge[1].trim();
          const sgn = bracketCharge[3] === '+' ? 1 : -1;
          const mag = Number(bracketCharge[2] || 1);
          const elements = parseChemicalFormulaCounts(formulaBody);
          return [buildSpeciesReading(coeff, elements, sgn * mag, displayFormula)];
        }

        // 4. Token ending in [+-] without "^":
        // If trailing digits precede the sign, generate EVERY reading obtained by splitting
        // the trailing digits into (last subscript, charge magnitude <= 4), including charge +-1.
        const signMatch = s.match(/^(.*?)(\d*)([+-])$/);
        if (signMatch) {
          const prefix = signMatch[1].trim();
          const digits = signMatch[2];
          const sgn = signMatch[3] === '+' ? 1 : -1;

          if (!digits) {
            const elements = parseChemicalFormulaCounts(prefix);
            return [buildSpeciesReading(coeff, elements, sgn, displayFormula)];
          }

          const variants = [];
          const seenKeys = new Set();
          for (let k = digits.length; k >= 0; k--) {
            const subStr = digits.slice(0, k);
            const chgStr = digits.slice(k);
            if (k > 0 && subStr[0] === '0') continue;
            let mag = 1;
            if (chgStr.length > 0) {
              if (chgStr[0] === '0') continue;
              mag = Number(chgStr);
              if (!Number.isInteger(mag) || mag < 1 || mag > 4) continue;
            }
            const body = prefix + subStr;
            const elements = parseChemicalFormulaCounts(body);
            if (!Object.values(elements).some((cnt) => cnt > 0)) continue;
            const reading = buildSpeciesReading(coeff, elements, sgn * mag, displayFormula);
            if (!seenKeys.has(reading.key)) {
              seenKeys.add(reading.key);
              variants.push(reading);
            }
          }
          if (variants.length) return variants;
        }

        // 5. Neutral molecule
        const elements = parseChemicalFormulaCounts(s);
        return [buildSpeciesReading(coeff, elements, 0, displayFormula)];
      }

      function parseChemicalSpecies(rawTerm) {
        const variants = parseChemicalSpeciesVariants(rawTerm);
        return variants[0] || null;
      }

      function splitEquationSideTerms(sideRaw) {
        let s = normalizeChemText(sideRaw);
        if (!s) return [];
        // Protect explicit caret plus charges before splitting by '+'
        s = s.replace(/\^\s*(\d*)\+/g, '^$1__PLUS__').replace(/\^\s*\+(\d*)/g, '^__PLUS__$1');
        // Protect non-caret charge '+' before separator '+' (without inserting '^')
        s = s.replace(/([A-Za-z0-9)\]])\+\s*\+/g, '$1__PLUS__ +');
        // Protect trailing charge '+' at the end of a side (without inserting '^')
        s = s.replace(/([A-Za-z0-9)\]])\+\s*$/g, '$1__PLUS__');

        const rawTerms = s.split('+').map((t) => t.replace(/__PLUS__/g, '+').trim()).filter(Boolean);
        const termCandidates = [];
        for (const term of rawTerms) {
          const variants = parseChemicalSpeciesVariants(term).filter((v) => v && v.key && v.key !== '|0');
          if (variants.length) termCandidates.push(variants);
        }
        return termCandidates;
      }

      function splitEquationSide(sideRaw) {
        const termCandidates = splitEquationSideTerms(sideRaw);
        const merged = new Map();
        for (const cands of termCandidates) {
          const parsed = cands[0];
          if (!parsed) continue;
          if (merged.has(parsed.key)) {
            merged.get(parsed.key).coeff += parsed.coeff;
          } else {
            merged.set(parsed.key, { ...parsed });
          }
        }
        return [...merged.values()];
      }

      function gcd2(a, b) {
        let x = Math.abs(Math.round(a));
        let y = Math.abs(Math.round(b));
        while (y !== 0) {
          const t = y;
          y = x % y;
          x = t;
        }
        return x || 1;
      }

      function gcdArray(nums) {
        if (!nums.length) return 1;
        return nums.reduce((acc, n) => gcd2(acc, n), nums[0]);
      }

      function finalizeParsedEquationLine(rawClean, lhsPicked, rhsPicked, lhsTermCandidates = null, rhsTermCandidates = null) {
        const mergeSide = (list) => {
          const merged = new Map();
          for (const sp of list) {
            if (merged.has(sp.key)) merged.get(sp.key).coeff += sp.coeff;
            else merged.set(sp.key, { ...sp });
          }
          return [...merged.values()];
        };
        const lhs = mergeSide(lhsPicked);
        const rhs = mergeSide(rhsPicked);

        const lhsAtoms = {};
        const rhsAtoms = {};
        let lhsCharge = 0;
        let rhsCharge = 0;

        for (const sp of lhs) {
          lhsCharge += sp.coeff * sp.charge;
          for (const [el, cnt] of Object.entries(sp.elements)) {
            lhsAtoms[el] = (lhsAtoms[el] || 0) + sp.coeff * cnt;
          }
        }
        for (const sp of rhs) {
          rhsCharge += sp.coeff * sp.charge;
          for (const [el, cnt] of Object.entries(sp.elements)) {
            rhsAtoms[el] = (rhsAtoms[el] || 0) + sp.coeff * cnt;
          }
        }

        const allElements = [...new Set([...Object.keys(lhsAtoms), ...Object.keys(rhsAtoms)])].sort();
        const unbalancedElements = [];
        for (const el of allElements) {
          if ((lhsAtoms[el] || 0) !== (rhsAtoms[el] || 0)) {
            unbalancedElements.push(el);
          }
        }
        const chargeBalanced = lhsCharge === rhsCharge;
        const isBalanced = unbalancedElements.length === 0 && chargeBalanced;

        const lhsKeySet = new Set(lhs.map((s) => s.key));
        const rhsKeySet = new Set(rhs.map((s) => s.key));
        const signature = `${[...lhsKeySet].sort().join('&')}=>${[...rhsKeySet].sort().join('&')}`;

        return {
          valid: true,
          raw: rawClean,
          lhs,
          rhs,
          lhsAtoms,
          rhsAtoms,
          lhsCharge,
          rhsCharge,
          unbalancedElements,
          chargeBalanced,
          isBalanced,
          lhsKeySet,
          rhsKeySet,
          signature,
          lhsTermCandidates,
          rhsTermCandidates,
        };
      }

      function resolveParsedEquationLine(parsedLine, routeContext = null) {
        if (!parsedLine || !parsedLine.valid) return parsedLine;
        const lhsTermCands = parsedLine.lhsTermCandidates || parsedLine.lhs.map((s) => [s]);
        const rhsTermCands = parsedLine.rhsTermCandidates || parsedLine.rhs.map((s) => [s]);

        const filterForSide = (cands, sideKeys, allKeys) => {
          if (!allKeys || cands.length <= 1) return cands;
          if (sideKeys) {
            const onSide = cands.filter((c) => sideKeys.has(c.key));
            if (onSide.length) return onSide;
          }
          const inRoute = cands.filter((c) => allKeys.has(c.key));
          if (inRoute.length) return inRoute;
          return cands;
        };

        const filteredLhs = lhsTermCands.map((c) => filterForSide(c, routeContext?.lhsKeys, routeContext?.allKeys));
        const filteredRhs = rhsTermCands.map((c) => filterForSide(c, routeContext?.rhsKeys, routeContext?.allKeys));

        const allFiltered = [
          ...filteredLhs.map((c, idx) => ({ side: 'L', idx, cands: c })),
          ...filteredRhs.map((c, idx) => ({ side: 'R', idx, cands: c })),
        ];
        const ambiguousSlots = allFiltered.filter((slot) => slot.cands.length > 1);

        if (ambiguousSlots.length === 0) {
          return finalizeParsedEquationLine(
            parsedLine.raw,
            filteredLhs.map((c) => c[0]),
            filteredRhs.map((c) => c[0]),
            lhsTermCands,
            rhsTermCands
          );
        }

        const lhsChoices = filteredLhs.map((c) => c[0]);
        const rhsChoices = filteredRhs.map((c) => c[0]);
        let bestBalanced = null;
        let checks = 0;
        const MAX_COMBO_CHECKS = 4096;

        function search(pos) {
          if (bestBalanced || checks >= MAX_COMBO_CHECKS) return;
          if (pos === ambiguousSlots.length) {
            checks += 1;
            const candidate = finalizeParsedEquationLine(parsedLine.raw, lhsChoices, rhsChoices, lhsTermCands, rhsTermCands);
            if (candidate.isBalanced) bestBalanced = candidate;
            return;
          }
          const slot = ambiguousSlots[pos];
          for (const opt of slot.cands) {
            if (slot.side === 'L') lhsChoices[slot.idx] = opt;
            else rhsChoices[slot.idx] = opt;
            search(pos + 1);
            if (bestBalanced || checks >= MAX_COMBO_CHECKS) return;
          }
        }
        search(0);

        if (bestBalanced) return bestBalanced;
        return finalizeParsedEquationLine(
          parsedLine.raw,
          filteredLhs.map((c) => c[0]),
          filteredRhs.map((c) => c[0]),
          lhsTermCands,
          rhsTermCands
        );
      }

      function parseEquationLine(lineStr, routeContext = null) {
        const clean = String(lineStr ?? '').trim();
        const arrowMatch = clean.match(/<->|<=>|->|→|⇌|=/);
        if (!arrowMatch) {
          return { valid: false, raw: clean, error: 'Missing reaction arrow ("->", "→", or "=").' };
        }
        const idx = arrowMatch.index;
        const sep = arrowMatch[0];
        const lhsRaw = clean.slice(0, idx).trim();
        const rhsRaw = clean.slice(idx + sep.length).trim();
        const lhsTermCands = splitEquationSideTerms(lhsRaw);
        const rhsTermCands = splitEquationSideTerms(rhsRaw);
        if (!lhsTermCands.length || !rhsTermCands.length) {
          return { valid: false, raw: clean, error: 'Both reactant and product sides must contain at least one species.' };
        }

        const baseLine = {
          valid: true,
          raw: clean,
          lhs: lhsTermCands.map((c) => c[0]),
          rhs: rhsTermCands.map((c) => c[0]),
          lhsTermCandidates: lhsTermCands,
          rhsTermCandidates: rhsTermCands,
        };
        return resolveParsedEquationLine(baseLine, routeContext);
      }

      function parseEquationBlock(input) {
        const linesRaw = Array.isArray(input)
          ? input
          : String(input ?? '').split(/\r?\n|;/);
        return linesRaw
          .map((l) => String(l ?? '').trim())
          .filter(Boolean)
          .map((l) => parseEquationLine(l));
      }

      function isPositiveIntegerMultiple(userLine, keyLine) {
        if (!keyLine.isBalanced) return true;
        const keyCoeffs = [...keyLine.lhs.map((s) => s.coeff), ...keyLine.rhs.map((s) => s.coeff)];
        const gKey = gcdArray(keyCoeffs);
        const keyMap = new Map();
        for (const s of keyLine.lhs) keyMap.set(`L:${s.key}`, s.coeff / gKey);
        for (const s of keyLine.rhs) keyMap.set(`R:${s.key}`, s.coeff / gKey);

        let ratio = null;
        for (const s of userLine.lhs) {
          const base = keyMap.get(`L:${s.key}`);
          if (!base) return false;
          const r = s.coeff / base;
          if (ratio === null) ratio = r;
          else if (Math.abs(r - ratio) > 1e-6) return false;
        }
        for (const s of userLine.rhs) {
          const base = keyMap.get(`R:${s.key}`);
          if (!base) return false;
          const r = s.coeff / base;
          if (ratio === null) ratio = r;
          else if (Math.abs(r - ratio) > 1e-6) return false;
        }
        return ratio !== null && ratio >= 1 - 1e-6 && Math.abs(ratio - Math.round(ratio)) < 1e-6;
      }

      function buildRouteKeyContext(route) {
        const lhsKeys = new Set();
        const rhsKeys = new Set();
        const allKeys = new Set();
        for (const rLine of route) {
          for (const k of rLine.lhsKeySet) { lhsKeys.add(k); allKeys.add(k); }
          for (const k of rLine.rhsKeySet) { rhsKeys.add(k); allKeys.add(k); }
        }
        return { lhsKeys, rhsKeys, allKeys };
      }

      function gradeEquationMatch(evaluator, userInput, node = null, variant = null) {
        const userLines = parseEquationBlock(userInput);
        if (!userLines.length) {
          return {
            normalizedGrade: 0,
            passed: false,
            feedback: 'Enter at least one chemical equation.',
          };
        }
        const invalidLine = userLines.find((l) => !l.valid);
        if (invalidLine) {
          return {
            normalizedGrade: 0,
            passed: false,
            feedback: invalidLine.error || 'Invalid equation syntax.',
          };
        }

        const rawAccepted = evaluator?.accepted || evaluator?.acceptedEquations || variant?.accepted || node?.accepted || [];
        const acceptedRoutes = (Array.isArray(rawAccepted) ? rawAccepted : [rawAccepted])
          .map((route) => {
            if (typeof route === 'string' || Array.isArray(route)) return parseEquationBlock(route);
            if (route && typeof route === 'object') return parseEquationBlock(route.equations || route.lines || route.route || []);
            return [];
          })
          .filter((r) => r.length > 0 && r.every((l) => l.valid));

        if (!acceptedRoutes.length) {
          return {
            normalizedGrade: 0,
            passed: false,
            feedback: 'No accepted reference equations configured on node.',
          };
        }

        // Check if user lines match the species sets of any accepted route (supporting multi-step routes)
        for (const route of acceptedRoutes) {
          if (route.length !== userLines.length) continue;
          const routeCtx = buildRouteKeyContext(route);
          const resolvedUserLines = userLines.map((uLine) => resolveParsedEquationLine(uLine, routeCtx));
          const usedRouteIdx = new Set();
          const matchedPairs = [];

          for (const uLine of resolvedUserLines) {
            const rIdx = route.findIndex((rLine, idx) => !usedRouteIdx.has(idx) && rLine.signature === uLine.signature);
            if (rIdx >= 0) {
              usedRouteIdx.add(rIdx);
              matchedPairs.push({ uLine, rLine: route[rIdx] });
            }
          }

          if (matchedPairs.length === route.length) {
            // Exact species match across all lines in the route! Now check atom + charge balance & integer multiple
            const allUnbalancedEls = new Set();
            let anyChargeUnbalanced = false;
            let allMultiplesOk = true;

            for (const { uLine, rLine } of matchedPairs) {
              uLine.unbalancedElements.forEach((el) => allUnbalancedEls.add(el));
              if (!uLine.chargeBalanced) anyChargeUnbalanced = true;
              if (!uLine.isBalanced || !isPositiveIntegerMultiple(uLine, rLine)) {
                allMultiplesOk = false;
              }
            }

            if (allUnbalancedEls.size === 0 && !anyChargeUnbalanced && allMultiplesOk) {
              return {
                normalizedGrade: 1,
                passed: true,
                unbalancedElements: [],
                missingSpecies: [],
                extraSpecies: [],
                feedback: 'Balanced chemical equation verified (species, atom counts, and charge balanced).',
              };
            }

            const unbalList = [...allUnbalancedEls];
            if (anyChargeUnbalanced) unbalList.push('charge');
            const detail = unbalList.length ? unbalList.join(', ') : 'stoichiometric coefficients';
            return {
              normalizedGrade: 0.5,
              passed: false,
              unbalancedElements: unbalList,
              missingSpecies: [],
              extraSpecies: [],
              feedback: `Correct species, but unbalanced in: ${detail}.`,
            };
          }
        }

        // Species mismatch: find closest accepted route to report missing and extra species
        let bestDiff = Infinity;
        let bestMissing = [];
        let bestExtra = [];

        for (const route of acceptedRoutes) {
          const routeCtx = buildRouteKeyContext(route);
          const resolvedUserLines = userLines.map((uLine) => resolveParsedEquationLine(uLine, routeCtx));
          const userSpeciesMap = new Map();
          for (const uLine of resolvedUserLines) {
            for (const s of [...uLine.lhs, ...uLine.rhs]) {
              userSpeciesMap.set(s.key, s.display);
            }
          }
          const routeSpeciesMap = new Map();
          for (const rLine of route) {
            for (const s of [...rLine.lhs, ...rLine.rhs]) {
              routeSpeciesMap.set(s.key, s.display);
            }
          }
          const missing = [];
          const extra = [];
          for (const [k, disp] of routeSpeciesMap.entries()) {
            if (!userSpeciesMap.has(k)) missing.push(disp);
          }
          for (const [k, disp] of userSpeciesMap.entries()) {
            if (!routeSpeciesMap.has(k)) extra.push(disp);
          }
          const diff = missing.length + extra.length;
          if (diff < bestDiff) {
            bestDiff = diff;
            bestMissing = missing;
            bestExtra = extra;
          }
        }

        const parts = [];
        if (bestMissing.length) parts.push(`missing species: ${bestMissing.join(', ')}`);
        if (bestExtra.length) parts.push(`extra species: ${bestExtra.join(', ')}`);
        const feedback = parts.length
          ? `Species mismatch (${parts.join('; ')}).`
          : 'Reactant/product side placement does not match accepted reaction.';

        return {
          normalizedGrade: 0,
          passed: false,
          missingSpecies: bestMissing,
          extraSpecies: bestExtra,
          feedback,
        };
      }

      function evaluate(variant, userInput, scope = {}, rubricChecks = null, node = null) {
        const ev = variant?.evaluator;
        if (!ev) return { normalizedGrade: 0, passed: false, feedback: 'Missing evaluator.' };
        switch (ev.type) {
          case 'numeric_match': return gradeNumeric(ev, userInput, scope);
          case 'pattern_match': return gradePattern(ev, userInput);
          case 'set_match': return gradeSet(ev, userInput);
          case 'mapped_fields_match': return gradeMappedFields(ev, userInput, scope);
          case 'choice_match': return gradeChoice(ev, userInput);
          case 'widget_state_match': return gradeWidgetState(ev, userInput);
          case 'atomic_rubric': return gradeAtomicRubric(ev, rubricChecks || {});
          case 'order_match': return gradeOrderMatch(ev, userInput);
          case 'isomer_set_match': return gradeIsomerSetMatch(ev, userInput);
          case 'name_match': return gradeNameMatch(ev, userInput);
          case 'equation_match': return gradeEquationMatch(ev, userInput, node || rubricChecks, variant);
          default: return { normalizedGrade: 0, passed: false, feedback: `Unknown evaluator: ${ev.type}` };
        }
      }

      async function requestLLMRubricPrecheck(llmConfig, stem, userEssay, rubricItems) {
        if (!llmConfig?.enabled || !llmConfig.endpoint) return null;
        const prompt = [
          'You are grading a chemistry exam response strictly against this rubric.',
          `Question:\n${stem}`,
          `Student Response:\n${userEssay}`,
          'Rubric Items (return JSON object mapping item.id to boolean):',
          ...rubricItems.map((r) => `- ${r.id}: ${r.criterion}`),
          'Respond ONLY with valid JSON: {"checks": {"<id>": true/false}, "note": "brief 1-sentence justification"}.',
        ].join('\n\n');

        const isOllama = llmConfig.endpoint.includes('11434');
        if (isOllama) {
          const resp = await fetch(llmConfig.endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ model: llmConfig.model || 'llama3.1', prompt, stream: false, format: 'json' }),
          });
          if (!resp.ok) throw new Error(`Ollama error ${resp.status}`);
          const data = await resp.json();
          return JSON.parse(data.response);
        }
        const resp = await fetch(llmConfig.endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(llmConfig.apiKey ? { Authorization: `Bearer ${llmConfig.apiKey}` } : {}),
          },
          body: JSON.stringify({
            model: llmConfig.model || 'gpt-4o-mini',
            messages: [{ role: 'user', content: prompt }],
            response_format: { type: 'json_object' },
          }),
        });
        if (!resp.ok) throw new Error(`LLM endpoint error ${resp.status}`);
        const data = await resp.json();
        const text = data.choices?.[0]?.message?.content || '{}';
        return JSON.parse(text);
      }

      return {
        evaluate,
        gradeNumeric,
        gradePattern,
        gradeSet,
        gradeMappedFields,
        gradeChoice,
        gradeWidgetState,
        gradeAtomicRubric,
        gradeOrderMatch,
        gradeIsomerSetMatch,
        gradeNameMatch,
        gradeEquationMatch,
        parseChemicalSpecies,
        parseChemicalSpeciesVariants,
        parseEquationLine,
        parseEquationBlock,
        normalizeNomenclatureName,
        requestLLMRubricPrecheck,
      };
    })();

       NAMESPACE 6: Widgets — Interactive 3D Isomer Canvas & Orbital Diagram
       ===================================================================== */
    const Widgets = (() => {
      function classifyEnumeratedIsomer(cfg, geom, formulaCaseId, countEnantiomersSeparately, foundList = []) {
        const G = IsomerEngine.GEOMS[geom || 'Oh'];
        if (!G || !Array.isArray(cfg?.labels) || cfg.labels.length !== G.n || cfg.labels.some((x) => !x)) {
          return { status: 'incomplete', reply: 'Assign all coordination sites before adding an isomer.' };
        }
        const cleanCfg = {
          labels: cfg.labels.slice(),
          edges: (cfg.edges || []).map((e) => [Math.min(e[0], e[1]), Math.max(e[0], e[1])]).sort((a, b) => a[0] - b[0] || a[1] - b[1]),
        };
        const rotCanon = IsomerEngine.canon(cleanCfg, G.rots);
        const mirCfg = IsomerEngine.applyCfg(G.sigma.perm, cleanCfg);
        const mirCanon = IsomerEngine.canon(mirCfg, G.rots);

        // 1. Check exact rotational equivalence with already-found entries
        const sameIdx = foundList.findIndex((item) => item.rotCanon === rotCanon);
        if (sameIdx >= 0) {
          return {
            status: 'duplicate',
            matchIndex: sameIdx + 1,
            rotCanon,
            mirCanon,
            reply: `duplicate of #${sameIdx + 1} (same isomer, rotated)`,
          };
        }

        // 2. Check mirror-image equivalence with already-found entries
        const mirIdx = foundList.findIndex((item) => item.mirCanon === rotCanon || item.rotCanon === mirCanon);
        if (mirIdx >= 0) {
          const reply = `mirror image of #${mirIdx + 1}`;
          if (countEnantiomersSeparately) {
            const baseLabel = foundList[mirIdx].label || `Isomer #${mirIdx + 1}`;
            return {
              status: 'mirror_added',
              matchIndex: mirIdx + 1,
              rotCanon,
              mirCanon,
              label: `${baseLabel} (enantiomer)`,
              entry: {
                cfg: cleanCfg,
                rotCanon,
                mirCanon,
                label: `${baseLabel} (enantiomer)`,
                isMirrorOf: mirIdx + 1,
              },
              reply,
            };
          }
          return {
            status: 'mirror_ignored',
            matchIndex: mirIdx + 1,
            rotCanon,
            mirCanon,
            reply,
          };
        }

        // 3. New isomer: validate against formulaCaseId if present and resolve label
        const caseAnalysis = formulaCaseId ? IsomerEngine.ANALYSIS[formulaCaseId] : null;
        let label = `Isomer #${foundList.length + 1}`;
        if (caseAnalysis) {
          const matchedIso = caseAnalysis.isomers.find((iso) => iso.key === rotCanon || iso.mirrorKey === rotCanon);
          if (!matchedIso) {
            return {
              status: 'invalid',
              reply: `Structure does not match formula or chelate connectivity of ${IsomerEngine.formulaPlain(caseAnalysis.c)}.`,
            };
          }
          label = matchedIso.label.replace(/<[^>]+>/g, '');
        }

        return {
          status: 'new',
          rotCanon,
          mirCanon,
          label,
          entry: {
            cfg: cleanCfg,
            rotCanon,
            mirCanon,
            label,
          },
          reply: `new: ${label}`,
        };
      }

      function mountIsomerCanvas(container, config, initialState, onChange) {
        const geom = config.geom || 'Oh';
        const G = IsomerEngine.GEOMS[geom];
        const isEnumerate = config.mode === 'enumerate_all';
        const countEnantiomers = Boolean(config.countEnantiomersSeparately);
        const caseAnalysis = config.formulaCaseId ? IsomerEngine.ANALYSIS[config.formulaCaseId] : null;
        const expectedCount = Number(config.expectedCount) || (caseAnalysis ? (countEnantiomers ? caseAnalysis.stereo : caseAnalysis.geometric) : 1);
        const allowed = config.allowedLetters || (caseAnalysis
          ? [...new Set((caseAnalysis.c.mono || '') + (caseAnalysis.c.chel || []).map((x) => x.split(':')[0]).join(''))].sort()
          : ['A', 'B', 'C']);

        const state = {
          geom,
          labels: initialState?.labels ? initialState.labels.slice() : new Array(G.n).fill(null),
          edges: initialState?.edges ? initialState.edges.map((e) => e.slice()) : [],
          tool: allowed[0] || 'A',
          pendingLink: null,
          layoutIdx: 0,
          found: Array.isArray(initialState?.found) ? initialState.found.map((f) => ({ ...f })) : [],
          duplicates: Number(initialState?.duplicates ?? 0),
          lastReply: initialState?.lastReply || '',
        };

        let miniViews = [];
        function destroyMiniViews() {
          miniViews.forEach((mv) => mv.destroy());
          miniViews = [];
        }

        container.innerHTML = `
          <div class="space-y-4">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
              <div class="lg:col-span-7">
                <div class="canvas-stage h-[310px] sm:h-[340px]" data-stage></div>
                <div class="mt-2 flex flex-wrap items-center justify-between gap-2 text-xs text-slate-500">
                  <span>Click numbered coordination sites on the 3D polyhedron to assign ligands.</span>
                  <span class="font-mono" data-site-count>0 / ${G.n} assigned</span>
                </div>
              </div>
              <div class="lg:col-span-5 space-y-3 bg-slate-50 border border-slate-200 rounded-xl p-3.5">
                <div>
                  <div class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">1. Active Ligand / Action</div>
                  <div class="flex flex-wrap gap-1.5" data-tool-row></div>
                </div>
                ${G.layouts.length > 1 ? `
                <div>
                  <div class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">2. Perspective</div>
                  <div class="flex flex-wrap gap-1.5" data-layout-row></div>
                </div>` : ''}
                <div class="pt-2 border-t border-slate-200 flex items-center justify-between gap-2">
                  <div class="text-xs text-slate-600" data-status-msg>Select a ligand letter, then click sites.</div>
                  <button type="button" data-clear class="px-2.5 py-1 text-xs font-medium border border-slate-300 bg-white hover:bg-slate-100 rounded-md text-slate-700 shrink-0">Reset</button>
                </div>
                ${isEnumerate ? `
                <div class="pt-3 border-t border-slate-200 space-y-2">
                  <div class="flex items-center justify-between gap-2">
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-600">Enumerate All Mode</span>
                    <span class="text-xs font-mono text-slate-700" data-enum-counter>Found: ${state.found.length} / ${expectedCount} · Duplicates: ${state.duplicates}</span>
                  </div>
                  <button type="button" data-add-isomer class="w-full px-3.5 py-2 text-xs font-semibold bg-blue-700 text-white hover:bg-blue-800 rounded-lg transition-colors">
                    + Add isomer
                  </button>
                  <div data-enum-reply class="text-xs font-mono px-2.5 py-1.5 rounded border ${state.lastReply ? 'border-slate-300 bg-white text-slate-800' : 'border-transparent text-slate-400'}">
                    ${state.lastReply || 'Build a candidate isomer and press "Add isomer".'}
                  </div>
                </div>` : ''}
              </div>
            </div>
            ${isEnumerate ? `
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-3.5 space-y-2.5">
              <div class="flex items-center justify-between">
                <div class="text-xs font-semibold uppercase tracking-wider text-slate-600">Found Isomers Gallery (${countEnantiomers ? 'Enantiomers Counted Separately' : 'Geometric Only'})</div>
                <div class="text-xs font-mono text-slate-500" data-gallery-sub>${state.found.length} of ${expectedCount} discovered</div>
              </div>
              <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3" data-enum-gallery></div>
            </div>` : ''}
          </div>
        `;

        const stageEl = container.querySelector('[data-stage]');
        const toolRow = container.querySelector('[data-tool-row]');
        const layoutRow = container.querySelector('[data-layout-row]');
        const countEl = container.querySelector('[data-site-count]');
        const msgEl = container.querySelector('[data-status-msg]');
        const enumCounterEl = container.querySelector('[data-enum-counter]');
        const enumReplyEl = container.querySelector('[data-enum-reply]');
        const galleryEl = container.querySelector('[data-enum-gallery]');
        const gallerySubEl = container.querySelector('[data-gallery-sub]');

        const view = new IsomerEngine.View(stageEl, { builder: true });

        function renderGallery() {
          if (!isEnumerate || !galleryEl) return;
          destroyMiniViews();
          if (enumCounterEl) {
            enumCounterEl.textContent = `Found: ${state.found.length} / ${expectedCount} · Duplicates: ${state.duplicates}`;
          }
          if (gallerySubEl) {
            gallerySubEl.textContent = `${state.found.length} of ${expectedCount} discovered`;
          }
          if (enumReplyEl) {
            enumReplyEl.textContent = state.lastReply || 'Build a candidate isomer and press "Add isomer".';
          }
          if (!state.found.length) {
            galleryEl.innerHTML = `<div class="col-span-full text-xs text-slate-400 py-3 text-center">No isomers added yet. Construct an isomer above and click "Add isomer".</div>`;
            return;
          }
          galleryEl.innerHTML = state.found.map((entry, idx) => `
            <div class="bg-white border border-slate-200 rounded-lg p-2 space-y-1.5">
              <div class="flex items-center justify-between text-xs">
                <span class="font-mono font-semibold text-slate-800">#${idx + 1}</span>
                <span class="text-slate-600 truncate ml-1" title="${entry.label}">${entry.label}</span>
              </div>
              <div class="canvas-stage h-[110px]" data-mini-view="${idx}"></div>
            </div>
          `).join('');
          state.found.forEach((entry, idx) => {
            const mHost = galleryEl.querySelector(`[data-mini-view="${idx}"]`);
            if (mHost) {
              const mv = new IsomerEngine.View(mHost, {});
              mv.load({ iso: { geom }, cfg: entry.cfg, q: G.layouts[0].q.clone() });
              miniViews.push(mv);
            }
          });
        }

        function emitChange() {
          onChange({
            geom,
            labels: state.labels.slice(),
            edges: state.edges.slice(),
            found: state.found.slice(),
            duplicates: state.duplicates,
            lastReply: state.lastReply,
          });
        }

        function sync() {
          const cfg = { labels: state.labels.slice(), edges: state.edges.slice() };
          view.load({ iso: { geom }, cfg, q: G.layouts[state.layoutIdx].q.clone() });
          view.pick = state.pendingLink;
          const filled = state.labels.filter(Boolean).length;
          countEl.textContent = `${filled} / ${G.n} assigned`;
          renderTools();
          emitChange();
        }

        function renderTools() {
          const btns = allowed.map((ltr) => {
            const on = state.tool === ltr;
            const col = IsomerEngine.COLORS[ltr] || '#0f172a';
            return `<button type="button" data-tool="${ltr}" class="px-3 py-1.5 text-xs font-mono font-semibold rounded-lg border transition-colors ${on ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-slate-800 border-slate-300 hover:bg-slate-100'}" style="${on ? '' : `color:${col}`}">${ltr}</button>`;
          });
          if (config.requireChelate !== false) {
            const onLink = state.tool === 'link';
            btns.push(`<button type="button" data-tool="link" class="px-3 py-1.5 text-xs font-medium rounded-lg border transition-colors ${onLink ? 'bg-blue-700 text-white border-blue-700' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'}">⌒ Chelate Link</button>`);
          }
          const onErase = state.tool === 'erase';
          btns.push(`<button type="button" data-tool="erase" class="px-3 py-1.5 text-xs font-medium rounded-lg border transition-colors ${onErase ? 'bg-rose-700 text-white border-rose-700' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'}">Eraser</button>`);
          toolRow.innerHTML = btns.join('');

          if (layoutRow) {
            layoutRow.innerHTML = G.layouts.map((L, idx) =>
              `<button type="button" data-lay="${idx}" class="px-2.5 py-1 text-xs rounded-md border ${state.layoutIdx === idx ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-slate-700 border-slate-300'}">${L.name}</button>`
            ).join('');
          }
        }

        view.onPick = (siteIdx) => {
          if (state.tool === 'link') {
            if (state.pendingLink === null) {
              state.pendingLink = siteIdx;
              msgEl.textContent = `Site ${siteIdx + 1} selected — click an adjacent (cis) site to toggle chelate ring.`;
            } else if (state.pendingLink === siteIdx) {
              state.pendingLink = null;
              msgEl.textContent = 'Chelate link cancelled.';
            } else {
              const a = Math.min(state.pendingLink, siteIdx), b = Math.max(state.pendingLink, siteIdx);
              const exIdx = state.edges.findIndex((e) => e[0] === a && e[1] === b);
              if (exIdx >= 0) {
                state.edges.splice(exIdx, 1);
                msgEl.textContent = `Removed chelate link between sites ${a + 1} and ${b + 1}.`;
              } else if (!G.edges.some((e) => e[0] === a && e[1] === b)) {
                msgEl.textContent = `Sites ${a + 1} and ${b + 1} are trans (180°). Chelates must span adjacent (cis) sites.`;
              } else {
                state.edges.push([a, b]);
                msgEl.textContent = `Linked sites ${a + 1}–${b + 1}.`;
              }
              state.pendingLink = null;
            }
          } else if (state.tool === 'erase') {
            state.labels[siteIdx] = null;
            state.edges = state.edges.filter((e) => !e.includes(siteIdx));
            msgEl.textContent = `Cleared site ${siteIdx + 1}.`;
          } else {
            state.labels[siteIdx] = state.labels[siteIdx] === state.tool ? null : state.tool;
            msgEl.textContent = state.labels[siteIdx] ? `Assigned ${state.tool} to site ${siteIdx + 1}.` : `Cleared site ${siteIdx + 1}.`;
          }
          sync();
        };

        container.addEventListener('click', (e) => {
          const tBtn = e.target.closest('[data-tool]');
          if (tBtn) {
            state.tool = tBtn.dataset.tool;
            state.pendingLink = null;
            msgEl.textContent = state.tool === 'link' ? 'Click two adjacent (cis) sites to connect a chelate.' : `Active tool: ${state.tool}`;
            sync();
            return;
          }
          const lBtn = e.target.closest('[data-lay]');
          if (lBtn) {
            state.layoutIdx = Number(lBtn.dataset.lay);
            sync();
            return;
          }
          if (e.target.closest('[data-clear]')) {
            state.labels = new Array(G.n).fill(null);
            state.edges = [];
            state.pendingLink = null;
            msgEl.textContent = 'Canvas cleared.';
            sync();
            return;
          }
          if (e.target.closest('[data-add-isomer]')) {
            const res = classifyEnumeratedIsomer(
              { labels: state.labels, edges: state.edges },
              geom,
              config.formulaCaseId,
              countEnantiomers,
              state.found
            );
            state.lastReply = res.reply;
            if (res.status === 'duplicate') {
              state.duplicates += 1;
            } else if (res.status === 'new' || res.status === 'mirror_added') {
              state.found.push(res.entry);
            }
            renderGallery();
            emitChange();
          }
        });

        sync();
        renderGallery();
        return () => {
          destroyMiniViews();
          view.destroy();
        };
      }

      function mountOrbitalDiagram(container, config, initialState, onChange) {
        const geom = config.geometry || 'Oh';
        const levelDefs = geom === 'Td'
          ? [{ key: 't2', label: 't₂ (dxy, dxz, dyz)', count: 3, energy: 'Higher (+0.4 Δt)' }, { key: 'e', label: 'e (dz², dx²−y²)', count: 2, energy: 'Lower (−0.6 Δt)' }]
          : [{ key: 'eg', label: 'eg (dz², dx²−y²)', count: 2, energy: 'Higher (+0.6 Δo)' }, { key: 't2g', label: 't₂g (dxy, dxz, dyz)', count: 3, energy: 'Lower (−0.4 Δo)' }];
        const cfseCaption = geom === 'Td'
          ? 'CFSE (positive for stabilisation): Td = 0.6·n(e) − 0.4·n(t₂) in Δt'
          : 'CFSE (positive for stabilisation): Oh = 0.4·n(t₂g) − 0.6·n(eg) in Δo';

        const boxes = {};
        for (const lvl of levelDefs) {
          boxes[lvl.key] = Array.isArray(initialState?.boxes?.[lvl.key])
            ? initialState.boxes[lvl.key].slice()
            : new Array(lvl.count).fill(0);
        }

        function computeStats() {
          let total = 0, unpaired = 0;
          for (const arr of Object.values(boxes)) {
            for (const v of arr) { total += v; if (v === 1) unpaired++; }
          }
          const mu = Math.sqrt(unpaired * (unpaired + 2));
          return { total, unpaired, mu };
        }

        function render() {
          const { total, unpaired, mu } = computeStats();
          const targetN = config.totalElectrons ?? 6;
          container.innerHTML = `
            <div class="bg-white border border-slate-200 rounded-xl p-4 sm:p-5 space-y-4">
              <div class="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-slate-200">
                <div>
                  <div class="text-xs font-semibold uppercase tracking-wider text-slate-500">Crystal Field Orbital Filling (${geom})</div>
                  <div class="text-sm font-medium text-slate-900 mt-0.5">${config.complexLabel || ''}</div>
                </div>
                <div class="flex items-center gap-4 text-xs font-mono">
                  <span class="${total === targetN ? 'text-emerald-700 font-semibold' : 'text-slate-600'}">e⁻: ${total} / ${targetN}</span>
                  <span class="text-slate-600">Unpaired n: ${unpaired}</span>
                  <span class="text-slate-600">μ_so: ${mu.toFixed(2)} BM</span>
                </div>
              </div>
              <div class="space-y-4 py-1">
                ${levelDefs.map((lvl) => `
                  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-slate-50 border border-slate-200 rounded-lg px-4 py-3">
                    <div>
                      <div class="font-mono text-sm font-semibold text-slate-900">${lvl.label}</div>
                      <div class="text-xs text-slate-500">${lvl.energy}</div>
                    </div>
                    <div class="flex items-center gap-2.5">
                      ${boxes[lvl.key].map((val, idx) => {
                        const glyph = val === 0 ? '<span class="text-slate-300 text-xs">empty</span>' : val === 1 ? '<span class="text-blue-700 font-bold text-lg leading-none">↑</span>' : '<span class="text-slate-900 font-bold text-lg leading-none">↑↓</span>';
                        return `<button type="button" data-box="${lvl.key}:${idx}" aria-label="${lvl.key} orbital ${idx + 1}: ${val} electrons" class="w-16 h-12 rounded-lg border-2 ${val > 0 ? 'border-blue-600 bg-white' : 'border-slate-300 bg-white hover:border-slate-400'} flex items-center justify-center transition-colors">${glyph}</button>`;
                      }).join('')}
                    </div>
                  </div>
                `).join('')}
              </div>
              <div class="text-xs font-mono text-slate-600 pt-1 border-t border-slate-100">${cfseCaption}</div>
              <div class="flex items-center justify-between gap-3 text-xs text-slate-500">
                <span>Click any orbital box to cycle: empty → ↑ → ↑↓ → empty.</span>
                <button type="button" data-orb-clear class="px-2.5 py-1 border border-slate-300 rounded-md hover:bg-slate-50 text-slate-700">Clear Orbitals</button>
              </div>
            </div>
          `;
        }

        container.addEventListener('click', (e) => {
          const boxBtn = e.target.closest('[data-box]');
          if (boxBtn) {
            const [lvl, idxStr] = boxBtn.dataset.box.split(':');
            const idx = Number(idxStr);
            boxes[lvl][idx] = (boxes[lvl][idx] + 1) % 3;
            render();
            onChange({ geometry: geom, boxes: JSON.parse(JSON.stringify(boxes)) });
            return;
          }
          if (e.target.closest('[data-orb-clear]')) {
            for (const k of Object.keys(boxes)) boxes[k].fill(0);
            render();
            onChange({ geometry: geom, boxes: JSON.parse(JSON.stringify(boxes)) });
          }
        });

        render();
        onChange({ geometry: geom, boxes: JSON.parse(JSON.stringify(boxes)) });
        return () => {};
      }

      return { mountIsomerCanvas, mountOrbitalDiagram, classifyEnumeratedIsomer };
    })();

    /* =====================================================================
       NAMESPACE 6b: Content — bundled question bank + skill map (static JSON)
       The bank is synced into IndexedDB on boot (idempotent, never touches
       review states or attempt logs). The skill map is reference data: it is
       fetched on every boot and held in memory only.
       ===================================================================== */
    const Content = (() => {
      // One folder of bundled content per module. CM2021 keeps its original settings-row key so installs carry on.
      const MODULES = [
        { code: 'CM2021', dir: 'cm2021', recordKey: 'bundledBank' },
        { code: 'CM2011', dir: 'cm2011', recordKey: 'bundledBank:CM2011' },
      ];
      const bankUrl = (mod) => `content/${mod.dir}/question-bank.json`;
      const skillMapUrl = (mod) => `content/${mod.dir}/skill-map.json`;
      const BANK_URL = bankUrl(MODULES[0]);
      const SKILL_MAP_URL = skillMapUrl(MODULES[0]);
      // Own settings row: the Settings page rebuilds the 'global' row from scratch and would drop this.
      const RECORD_KEY = MODULES[0].recordKey;
      const PROFICIENT_GRADE = 0.7;

      async function fetchJson(url, fetchFn) {
        const f = fetchFn || (typeof fetch === 'function' ? fetch : null);
        if (!f) throw new Error('fetch is unavailable');
        const resp = await f(url, { cache: 'no-cache' });
        if (!resp.ok) throw new Error(`${url}: HTTP ${resp.status}`);
        try {
          return await resp.json();
        } catch (err) {
          // Dev servers answer unknown paths with index.html (HTTP 200), which is not JSON.
          throw new Error(`${url}: response is not valid JSON`);
        }
      }

      /* Try the site-root path first (Vite build, dev server), then the repo layout (public/ served as-is,
         e.g. GitHub Pages deploying the repository root). */
      async function fetchContent(url, fetchFn) {
        let lastErr;
        for (const candidate of [url, 'public/' + url]) {
          try {
            return await fetchJson(candidate, fetchFn);
          } catch (err) {
            lastErr = lastErr ? new Error(lastErr.message + ' | ' + err.message) : err;
          }
        }
        throw lastErr;
      }

      function bankKey(bundle) {
        return `${bundle?.bundleVersion ?? '?'}@${bundle?.exportedAt ?? '?'}`;
      }

      function isReservedNodeId(id) {
        return typeof id === 'string' && (id.startsWith('gb-') || id.startsWith('lf-') || id.startsWith('cm11-') || SEED_NODES.some((s) => s.id === id));
      }

      /* Pure: decide what a sync would do. presentIds = ids currently in questionNodes. */
      function planBankSync(bundle, record, presentIds) {
        const nodes = Array.isArray(bundle?.questionNodes) ? bundle.questionNodes : [];
        const valid = [];
        const rejected = [];
        const seen = new Set();
        for (const n of nodes) {
          const res = DB.validateQuestionNodeV3(n);
          if (!res.valid) { rejected.push({ id: n?.id ?? null, errors: res.errors }); continue; }
          if (isReservedNodeId(n.id)) { rejected.push({ id: n.id, errors: ['id collides with a built-in node namespace'] }); continue; }
          if (seen.has(n.id)) { rejected.push({ id: n.id, errors: ['duplicate id in bundle'] }); continue; }
          seen.add(n.id);
          valid.push(n);
        }
        const ids = valid.map((n) => n.id);
        const key = bankKey(bundle);
        const missing = ids.filter((id) => !presentIds.has(id));
        const stale = (record?.ids || []).filter((id) => !seen.has(id));
        const upToDate = record?.bankKey === key && missing.length === 0 && stale.length === 0;
        return { upToDate, key, valid, ids, rejected, missing, stale };
      }

      /* I/O: never throws. A failure leaves whatever is already in the DB untouched. */
      async function syncBank(db, fetchFn, mod = MODULES[0]) {
        const BANK_URL = bankUrl(mod);
        const RECORD_KEY = mod.recordKey;
        let bundle;
        try {
          bundle = await fetchContent(BANK_URL, fetchFn);
        } catch (err) {
          return { state: 'unavailable', error: err.message, rejected: [] };
        }
        if (!bundle || !Array.isArray(bundle.questionNodes)) {
          return { state: 'unavailable', error: `${BANK_URL}: no questionNodes array`, rejected: [] };
        }
        try {
          const record = await db.settings.get(RECORD_KEY);
          const present = new Set(await db.questionNodes.toCollection().primaryKeys());
          const plan = planBankSync(bundle, record, present);
          if (plan.upToDate) return { state: 'up-to-date', count: plan.ids.length, rejected: plan.rejected };
          await db.transaction('rw', db.questionNodes, db.settings, async () => {
            if (plan.valid.length) await db.questionNodes.bulkPut(plan.valid);
            if (plan.stale.length) await db.questionNodes.bulkDelete(plan.stale);
            await db.settings.put({ key: RECORD_KEY, bankKey: plan.key, ids: plan.ids });
          });
          return {
            state: 'synced',
            count: plan.ids.length,
            removed: plan.stale.length,
            rejected: plan.rejected,
          };
        } catch (err) {
          return { state: 'unavailable', error: 'sync failed: ' + err.message, rejected: [] };
        }
      }

      /* I/O: never throws. Syncs every module's bundle and folds the results into one status. */
      async function syncAllBanks(db, fetchFn) {
        const perModule = {};
        for (const mod of MODULES) perModule[mod.code] = await syncBank(db, fetchFn, mod);
        const all = Object.values(perModule);
        const bad = Object.entries(perModule).filter(([, r]) => r.state === 'unavailable');
        return {
          state: bad.length ? 'unavailable' : all.some((r) => r.state === 'synced') ? 'synced' : 'up-to-date',
          error: bad.map(([c, r]) => `${c}: ${r.error}`).join(' | ') || undefined,
          count: all.reduce((a, r) => a + (r.count || 0), 0),
          removed: all.reduce((a, r) => a + (r.removed || 0), 0),
          rejected: all.flatMap((r) => r.rejected || []),
          perModule,
        };
      }

      /* I/O: never throws. Deletes review states and attempt logs whose node no longer exists (for example a node
         dropped from the bundled bank). Skipped entirely when no nodes are stored, so a failed boot cannot wipe progress. */
      async function sweepOrphanedProgress(db) {
        const none = { reviewStates: 0, attemptLogs: 0 };
        try {
          const nodeIds = new Set(await db.questionNodes.toCollection().primaryKeys());
          if (nodeIds.size === 0) return none;
          const orphanReviews = (await db.reviewStates.toCollection().primaryKeys()).filter((id) => !nodeIds.has(id));
          const orphanLogNodes = (await db.attemptLogs.orderBy('nodeId').uniqueKeys()).filter((id) => !nodeIds.has(id));
          let logsDeleted = 0;
          await db.transaction('rw', db.reviewStates, db.attemptLogs, async () => {
            if (orphanReviews.length) await db.reviewStates.bulkDelete(orphanReviews);
            if (orphanLogNodes.length) logsDeleted = await db.attemptLogs.where('nodeId').anyOf(orphanLogNodes).delete();
          });
          return { reviewStates: orphanReviews.length, attemptLogs: logsDeleted };
        } catch (err) {
          console.warn('[Content] orphan sweep failed:', err.message);
          return none;
        }
      }

      function validateSkillMap(map) {
        const errors = [];
        if (!map || typeof map !== 'object') return { valid: false, errors: ['skill map must be an object'] };
        if (!map.module) errors.push('module missing');
        if (!Array.isArray(map.skills) || !map.skills.length) errors.push('skills must be a non-empty array');
        if (!map.nodeSkills || typeof map.nodeSkills !== 'object' || Array.isArray(map.nodeSkills)) errors.push('nodeSkills must be an object');
        if (Array.isArray(map.skills)) {
          const seen = new Set();
          map.skills.forEach((s, i) => {
            if (!s?.id) { errors.push(`skills[${i}].id missing`); return; }
            if (seen.has(s.id)) errors.push(`duplicate skill id ${s.id}`);
            seen.add(s.id);
            if (!Number.isFinite(s.marks)) errors.push(`${s.id}: marks must be numeric`);
            if (!Number.isFinite(s.weight)) errors.push(`${s.id}: weight must be numeric`);
            if (!Array.isArray(s.nodes)) errors.push(`${s.id}: nodes must be an array`);
          });
        }
        // chunks are optional (older maps have none); when present every skill must sit in exactly one
        if (map.chunks !== undefined) {
          if (!Array.isArray(map.chunks)) errors.push('chunks must be an array');
          else {
            const cids = new Set();
            map.chunks.forEach((c, i) => {
              if (!c?.id || !c.name) { errors.push(`chunks[${i}] needs id and name`); return; }
              if (cids.has(c.id)) errors.push(`duplicate chunk id ${c.id}`);
              cids.add(c.id);
            });
            for (const s of map.skills || []) if (s?.id && !cids.has(s.chunk)) errors.push(`${s.id}: unknown chunk ${s.chunk}`);
          }
        }
        return { valid: errors.length === 0, errors };
      }

      /* I/O: never throws; the app works without a skill map. */
      async function loadSkillMap(fetchFn, mod = MODULES[0]) {
        const SKILL_MAP_URL = skillMapUrl(mod);
        try {
          const map = await fetchContent(SKILL_MAP_URL, fetchFn);
          const res = validateSkillMap(map);
          if (!res.valid) return { map: null, error: `${SKILL_MAP_URL}: ${res.errors.slice(0, 3).join('; ')}` };
          return { map, error: null };
        } catch (err) {
          return { map: null, error: err.message };
        }
      }

      /* I/O: never throws. One map per module, keyed by module code. */
      async function loadAllSkillMaps(fetchFn) {
        const maps = {};
        const errors = [];
        for (const mod of MODULES) {
          const r = await loadSkillMap(fetchFn, mod);
          if (r.map) maps[mod.code] = r.map; else errors.push(`${mod.code}: ${r.error}`);
        }
        return { maps, error: errors.length ? errors.join(' | ') : null };
      }

      /* Pure: how well the skill map and the nodes actually present agree. */
      function analyzeSkillMap(map, nodeIds) {
        const skills = map.skills || [];
        const nodeSkills = map.nodeSkills || {};
        const skillIds = new Set(skills.map((s) => s.id));
        const cited = new Set();
        for (const s of skills) for (const id of [...(s.nodes || []), ...(s.ids || [])]) cited.add(id);
        for (const id of Object.keys(nodeSkills)) cited.add(id);

        const inverse = {};
        for (const s of skills) for (const id of (s.nodes || [])) (inverse[id] ||= new Set()).add(s.id);
        const inconsistent = [];
        for (const id of new Set([...Object.keys(inverse), ...Object.keys(nodeSkills)])) {
          const a = [...(inverse[id] || [])].sort().join('|');
          const b = [...(nodeSkills[id] || [])].sort().join('|');
          if (a !== b) inconsistent.push(id);
        }
        const unknownSkillRefs = [...new Set(Object.values(nodeSkills).flat().filter((id) => !skillIds.has(id)))].sort();
        const orphanSkills = [];
        const emptySkills = [];
        const partialSkills = [];
        for (const s of skills) {
          const total = (s.nodes || []).length;
          const have = (s.nodes || []).filter((id) => nodeIds.has(id)).length;
          if (!total) emptySkills.push(s.id);
          else if (!have) orphanSkills.push(s.id);
          else if (have < total) partialSkills.push({ id: s.id, missing: total - have, total });
        }
        return {
          missingIds: [...cited].filter((id) => !nodeIds.has(id)).sort(),
          nodesWithoutSkills: [...nodeIds].filter((id) => id.startsWith('bk-') && !nodeSkills[id]).sort(),
          inconsistent: inconsistent.sort(),
          unknownSkillRefs,
          orphanSkills,
          emptySkills,
          partialSkills,
          weightSum: skills.reduce((a, s) => a + (s.weight || 0), 0),
        };
      }

      /* Mirrors the attempted/proficient rules of Scheduler.computeModuleReadiness, per node. */
      function nodeProgress(nodes, reviewMap, attemptLogs) {
        const latest = {};
        for (const log of (attemptLogs || [])) {
          if (!log?.nodeId) continue;
          const prev = latest[log.nodeId];
          if (!prev || (log.timestamp || 0) >= (prev.timestamp || 0)) latest[log.nodeId] = log;
        }
        const out = {};
        for (const n of nodes) {
          const rs = reviewMap[n.id];
          const log = latest[n.id];
          const attempted = Boolean(log || (rs && (rs.reps || 0) > 0));
          let score = null;
          if (log && typeof log.normalizedGrade === 'number') score = log.normalizedGrade;
          else if (rs?.variantStats && Object.keys(rs.variantStats).length) {
            const entries = Object.values(rs.variantStats).sort((a, b) => (b.lastSeenMs || 0) - (a.lastSeenMs || 0));
            score = entries[0]?.meanGrade ?? null;
          }
          out[n.id] = { attempted, proficient: attempted && score !== null && score >= PROFICIENT_GRADE };
        }
        return out;
      }

      /* Per-skill rows plus map-weighted summaries. Missing nodes count against readiness (conservative) and
         are reported separately as content coverage, so a gap in the bank is visible instead of silently excused. */
      function skillRows(map, nodeIds, progress) {
        let wSum = 0, wReady = 0, wCover = 0;
        const rows = (map.skills || []).map((s) => {
          const total = (s.nodes || []).length;
          const avail = (s.nodes || []).filter((id) => nodeIds.has(id));
          const attempted = avail.filter((id) => progress[id]?.attempted).length;
          const proficient = avail.filter((id) => progress[id]?.proficient).length;
          const ready = total ? proficient / total : 0;
          const cover = total ? avail.length / total : 0;
          wSum += s.weight || 0;
          wReady += (s.weight || 0) * ready;
          wCover += (s.weight || 0) * cover;
          return { skill: s, total, available: avail.length, attempted, proficient, ready, cover };
        });
        return { rows, readiness: wSum ? wReady / wSum : 0, coverage: wSum ? wCover / wSum : 0 };
      }

      /* Pure: ids of every question mapped to the skills of one topic (chunk). */
      function chunkNodeIds(map, chunkId) {
        const ids = new Set();
        for (const s of map?.skills || []) if (s.chunk === chunkId) for (const id of s.nodes || []) ids.add(id);
        return [...ids];
      }

      return {
        MODULES, BANK_URL, SKILL_MAP_URL, RECORD_KEY, chunkNodeIds,
        fetchJson, fetchContent, bankKey, isReservedNodeId, planBankSync, syncBank, syncAllBanks, sweepOrphanedProgress,
        validateSkillMap, loadSkillMap, loadAllSkillMaps, analyzeSkillMap, nodeProgress, skillRows,
      };
    })();

    /* =====================================================================
       NAMESPACE: Mastery — retire skills you have shown you know, measured in card time
       ---------------------------------------------------------------------
       "Card time" is the position in the global attempt sequence, so "this skill has been away for N cards"
       needs no clock. A skill retires after `successes` full-mark answers on different questions, each coming
       after at least `minGapCards` other cards since the previous attempt on that skill (so it is retrieval
       after interference, not an immediate repeat). Any answer under `failBelow` resets the evidence.
       A retired skill keeps a small priority weight, and one maintenance check comes due after
       `maintenanceCards` cards (doubling after every pass); failing a check re-opens the skill.
       Everything is derived from the attempt log, so it cannot drift out of sync with it. Only the person's own
       choices (remove, re-open) are stored.
       ===================================================================== */
    const Mastery = (() => {
      const DEFAULTS = {
        successes: 3,
        minGapCards: 6,
        passScore: 0.9,
        failBelow: 0.7,
        maintenanceCards: 30,
        maxMaintenanceCards: 480,
        retiredWeight: 0.08,
      };
      const cfgOf = (settings) => ({ ...DEFAULTS, ...(settings?.mastery || {}) });
      // generated "identify the metal" questions are not in the skill map by id. They credit metal identification and CFSE only:
      // they name just a few ligand types, which is far narrower than the whole "name a coordination compound" skill, so they must not retire it
      const GENERATED_INVERSE_SKILLS = ['c7.metal-id', 'c7.cfse'];
      const skillsOfNode = (map, id) => map?.nodeSkills?.[id] || (String(id).startsWith('lf-inv-') ? GENERATED_INVERSE_SKILLS : []);

      /* Pure. `overrides.resetAt[skillId]` = card index before which attempts are ignored (a manual re-open). */
      function evaluate(logs, map, nodes, settings, overrides = {}) {
        const cfg = cfgOf(settings);
        const resetAt = overrides?.resetAt || {};
        const sorted = [...(logs || [])].sort((a, b) => a.timestamp - b.timestamp);
        const variantsByNode = {};
        for (const n of nodes || []) variantsByNode[n.id] = (n.variants || []).length || 1;
        const avail = {};
        for (const sk of map?.skills || []) avail[sk.id] = (sk.nodes || []).reduce((a, id) => a + (variantsByNode[id] || 0), 0);
        const required = (sid) => Math.max(2, Math.min(cfg.successes, avail[sid] || 0));

        const st = {};
        const fresh = () => ({ status: 'active', evidence: [], lastIdx: null, anchorIdx: null, interval: 0, checks: 0, retiredAtIdx: null });
        sorted.forEach((log, idx) => {
          for (const sid of skillsOfNode(map, log.nodeId)) {
            if (resetAt[sid] != null && idx < resetAt[sid]) continue;
            const s0 = (st[sid] ||= fresh());
            const g = Number(log.normalizedGrade) || 0;
            const gap = s0.lastIdx == null ? Infinity : idx - s0.lastIdx - 1;
            if (s0.status === 'retired') {
              if (g < cfg.failBelow) { s0.status = 'active'; s0.evidence = []; s0.checks = 0; s0.interval = 0; }
              else if (g >= cfg.passScore && idx - s0.anchorIdx - 1 >= s0.interval) {
                s0.checks += 1;
                s0.interval = Math.min(cfg.maxMaintenanceCards, s0.interval * 2);
                s0.anchorIdx = idx;
              }
            } else if (g < cfg.failBelow) {
              s0.evidence = [];
            } else if (g >= cfg.passScore && gap >= cfg.minGapCards) {
              const need = required(sid);
              const mustDiffer = (avail[sid] || 0) >= need;
              if (!(mustDiffer && s0.evidence.includes(log.variantId))) s0.evidence.push(log.variantId);
              if (s0.evidence.length >= need) {
