      function multiplyingPrefix(count, useBisTris = false) {
        const c = Number(count) || 1;
        if (useBisTris) {
          const map = { 1: '', 2: 'bis', 3: 'tris', 4: 'tetrakis', 5: 'pentakis', 6: 'hexakis' };
          return map[c] ?? `${c}-`;
        }
        const map = { 1: '', 2: 'di', 3: 'tri', 4: 'tetra', 5: 'penta', 6: 'hexa' };
        return map[c] ?? `${c}-`;
      }

      function escapeRegex(s) {
        return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      }

      function normalizeLigandList(ligandInput, countInput, data) {
        if (Array.isArray(ligandInput)) {
          const merged = [];
          for (const item of ligandInput) {
            const lig = typeof item.ligand === 'object' && item.ligand.id
              ? item.ligand
              : resolveLigand(item.ligand || item.id || item.formula || item, data);
            if (!lig) throw new Error(`Unknown ligand in list: ${JSON.stringify(item)}`);
            const c = Number(item.count ?? 1) || 1;
            const existing = merged.find((m) => m.ligand.id === lig.id);
            if (existing) existing.count += c;
            else merged.push({ ligand: lig, count: c });
          }
          return merged;
        }
        const single = typeof ligandInput === 'object' && ligandInput?.id
          ? ligandInput
          : resolveLigand(ligandInput, data);
        if (!single) throw new Error(`Invalid ligand: ${ligandInput}`);
        return [{ ligand: single, count: Number(countInput) || 6 }];
      }

      function generateIUPACName(metalSymbol, oxState, ligandKeyOrList, count = 6, complexCharge = null, rawData = DEFAULT_DATA, counterIons = null) {
        const data = normalizeData(rawData);
        const metal = typeof metalSymbol === 'object' ? metalSymbol : resolveMetal(metalSymbol, data);
        if (!metal) throw new Error(`Invalid metal (${metalSymbol})`);

        const ligandsList = normalizeLigandList(ligandKeyOrList, count, data);
        const ox = parseRomanOrInt(oxState);
        const ligandChargeSum = ligandsList.reduce((acc, item) => acc + item.count * item.ligand.charge, 0);
        const netCharge = complexCharge !== null && complexCharge !== undefined
          ? Number(complexCharge)
          : ox + ligandChargeSum;

        const isAnionic = netCharge < 0;
        const metalRoot = isAnionic ? metal.ateName : metal.name;
        const oxRoman = romanNumeral(ox);

        // Sort ligands alphabetically by nameInComplex ignoring multiplying prefixes
        const sortedLigands = [...ligandsList].sort((a, b) =>
          a.ligand.nameInComplex.localeCompare(b.ligand.nameInComplex)
        );

        const formatLigandPart = (lig, cnt, ligName) => {
          const prefix = multiplyingPrefix(cnt, lig.useBisTris);
          if (lig.useBisTris) {
            return cnt === 1 ? `(${ligName})` : `${prefix}(${ligName})`;
          }
          return `${prefix}${ligName}`;
        };

        const formatLigandRegex = (lig, cnt, ligName) => {
          const prefix = multiplyingPrefix(cnt, lig.useBisTris);
          if (lig.useBisTris) {
            return cnt === 1
              ? `\\(?${escapeRegex(ligName)}\\)?`
              : `${escapeRegex(prefix)}\\s*\\(\\s*${escapeRegex(ligName)}\\s*\\)`;
          }
          return prefix ? `${escapeRegex(prefix)}[-\\s]*${escapeRegex(ligName)}` : escapeRegex(ligName);
        };

        // Build Cartesian combinations of ligand name variants (e.g. fluorido / fluoro)
        let nameVariantLists = [[]];
        for (const item of sortedLigands) {
          const names = [item.ligand.nameInComplex, ...(item.ligand.altNames || [])];
          const next = [];
          for (const prev of nameVariantLists) {
            for (const n of names) {
              next.push([...prev, { lig: item.ligand, count: item.count, name: n }]);
            }
          }
          nameVariantLists = next;
        }

        const cation = counterIons?.cation || null;
        const anion = counterIons?.anion || null;
        const cationNames = cation ? [cation.ion.name, ...(cation.ion.altNames || [])] : [''];
        const anionNames = anion ? [anion.ion.name, ...(anion.ion.altNames || [])] : [''];

        const acceptedNames = [];
        const acceptedNamePatterns = [];

        for (const variant of nameVariantLists) {
          const complexWord = `${variant.map((v) => formatLigandPart(v.lig, v.count, v.name)).join('')}${metalRoot}(${oxRoman})`;
          const complexRegex = `${variant.map((v) => formatLigandRegex(v.lig, v.count, v.name)).join('[-\\s]*')}[-\\s]*${escapeRegex(metalRoot)}\\s*\\(\\s*${escapeRegex(oxRoman)}\\s*\\)`;

          if (cation || anion) {
            for (const catName of cationNames) {
              for (const anName of anionNames) {
                const full = [catName, complexWord, anName].filter(Boolean).join(' ');
                acceptedNames.push(full);
                const catPart = catName ? `${escapeRegex(catName)}\\s+` : '';
                const anPart = anName ? `\\s+${escapeRegex(anName)}` : '';
                acceptedNamePatterns.push(`^\\s*${catPart}${complexRegex}${anPart}\\s*$`);
              }
            }
          } else {
            acceptedNames.push(complexWord);
            if (netCharge !== 0) acceptedNames.push(`${complexWord} ion`);
            acceptedNamePatterns.push(`^\\s*${complexRegex}(?:\\s+ion)?\\s*$`);
          }
        }

        const canonicalComplex = `${sortedLigands.map((item) => formatLigandPart(item.ligand, item.count, item.ligand.nameInComplex)).join('')}${metalRoot}(${oxRoman})`;
        const canonicalName = [
          cation ? cation.ion.name : '',
          canonicalComplex,
          anion ? anion.ion.name : '',
        ].filter(Boolean).join(' ');

        return {
          canonicalName,
          complexIonName: canonicalComplex,
          acceptedNames: [...new Set(acceptedNames)],
          acceptedNamePatterns: [...new Set(acceptedNamePatterns)],
          metalRoot,
          oxRoman,
          isAnionic,
          netCharge,
        };
      }

      function formatCounterIonPart(counterSpec) {
        if (!counterSpec || !counterSpec.ion) return '';
        const c = Number(counterSpec.count) || 1;
        const f = counterSpec.ion.formula;
        if (c === 1) return f;
        // Polyatomic counter-ions with digits (like NH4, SO4) need parentheses if count > 1
        if (/\d/.test(f) || f === 'OH') return `(${f})${c}`;
        return `${f}${c}`;
      }

      function formatComplexFormula(metalSymbol, ligandInput, count = 6, charge = 0, rawData = DEFAULT_DATA, counterIons = null) {
        const data = normalizeData(rawData);
        const ligandsList = normalizeLigandList(ligandInput, count, data);
        const ligStr = ligandsList.map((item) => {
          const tok = item.ligand.tokenInComplex;
          return item.count === 1 ? tok : `${tok}${item.count}`;
        }).join('');

        const cationStr = formatCounterIonPart(counterIons?.cation);
        const anionStr = formatCounterIonPart(counterIons?.anion);
        if (cationStr || anionStr) {
          return `${cationStr}[${metalSymbol}${ligStr}]${anionStr}`;
        }

        const z = Number(charge) || 0;
        let chargeSuffix = '';
        if (z > 0) chargeSuffix = z === 1 ? '+' : `${z}+`;
        else if (z < 0) chargeSuffix = z === -1 ? '-' : `${Math.abs(z)}-`;
        return `[${metalSymbol}${ligStr}]${chargeSuffix}`;
      }

      function parseChargeSuffix(rawCharge) {
        const s = String(rawCharge ?? '').trim().replace(/^\^/, '').trim();
        if (!s) return 0;
        if (s === '+') return 1;
        if (s === '-' || s === '−') return -1;
        const m1 = s.match(/^(\d+)\s*([+\-−])$/);
        if (m1) return (m1[2] === '+' ? 1 : -1) * Number(m1[1]);
        const m2 = s.match(/^([+\-−])\s*(\d+)$/);
        if (m2) return (m2[1] === '+' ? 1 : -1) * Number(m2[2]);
        const n = Number(s);
        return Number.isFinite(n) ? n : 0;
      }

      function parseCounterIonFragment(rawFrag, role) {
        const s = String(rawFrag || '').trim();
        if (!s) return null;
        // Match e.g. "(NH4)2", "(SO4)3", "K2", "Na2", "Cl3", "F3", "SO4"
        const parenMatch = s.match(/^\(([^)]+)\)(\d*)$/);
        if (parenMatch) {
          const ion = resolveCounterIon(parenMatch[1], role);
          if (!ion) return null;
          return { ion, count: parenMatch[2] ? Number(parenMatch[2]) : 1 };
        }
        // Check exact polyatomic formula with digits first (e.g. SO4, NH4, NO3, ClO4, CO3, PF6, BF4)
        const directIon = resolveCounterIon(s, role);
        if (directIon) {
          return { ion: directIon, count: 1 };
        }
        const elemMatch = s.match(/^([A-Za-z]+)(\d*)$/);
        if (elemMatch) {
          const ion = resolveCounterIon(elemMatch[1], role);
          if (!ion) return null;
          return { ion, count: elemMatch[2] ? Number(elemMatch[2]) : 1 };
        }
        return null;
      }

      function parseInnerCoordinationSphere(innerStr, data) {
        const s = String(innerStr || '').trim();
        // Match leading metal symbol: 'M' or a known metal symbol (2-letter first, then 1-letter)
        const metalSymbols = [...data.metals.map((m) => m.symbol), 'M'].sort((a, b) => b.length - a.length);
        let metal = null;
        let rest = '';
        for (const sym of metalSymbols) {
          if (s.startsWith(sym)) {
            const after = s.slice(sym.length);
            // Avoid matching 'V' when the metal is a 2-letter symbol (already sorted longest first)
            metal = sym;
            rest = after;
            break;
          }
        }
        if (!metal) {
          const mGeneric = s.match(/^([A-Z][a-z]?)(.+)$/);
          if (!mGeneric) throw new Error(`Cannot identify metal in "[${s}]"`);
          metal = mGeneric[1];
          rest = mGeneric[2];
        }

        const ligands = [];
        let pos = 0;
        while (pos < rest.length) {
          if (rest[pos] === '(') {
            const closeIdx = rest.indexOf(')', pos + 1);
            if (closeIdx === -1) throw new Error(`Unclosed parenthesis in "[${s}]"`);
            const tok = rest.slice(pos + 1, closeIdx);
            pos = closeIdx + 1;
            const numMatch = rest.slice(pos).match(/^(\d+)/);
            const cnt = numMatch ? Number(numMatch[1]) : 1;
            if (numMatch) pos += numMatch[1].length;
            const lig = resolveLigand(tok, data);
            if (!lig) throw new Error(`Unknown ligand "(${tok})" in "[${s}]"`);
            const existing = ligands.find((item) => item.ligand.id === lig.id);
            if (existing) existing.count += cnt;
            else ligands.push({ ligand: lig, count: cnt });
          } else {
            const mSimple = rest.slice(pos).match(/^([A-Z][a-z]?)(\d*)/);
            if (!mSimple) throw new Error(`Unexpected token "${rest.slice(pos)}" in "[${s}]"`);
            const tok = mSimple[1];
            const cnt = mSimple[2] ? Number(mSimple[2]) : 1;
            pos += mSimple[0].length;
            const lig = resolveLigand(tok, data);
            if (!lig) throw new Error(`Unknown ligand "${tok}" in "[${s}]"`);
            const existing = ligands.find((item) => item.ligand.id === lig.id);
            if (existing) existing.count += cnt;
            else ligands.push({ ligand: lig, count: cnt });
          }
        }

        if (!ligands.length) throw new Error(`No ligands found in "[${s}]"`);
        return { metal, ligands };
      }

      function parseComplexTemplate(templateInput, rawData = DEFAULT_DATA) {
        const data = normalizeData(rawData);
        if (templateInput && typeof templateInput === 'object') {
          if (templateInput.template && typeof templateInput.template === 'string' && !templateInput.ligands && !templateInput.ligand) {
            const base = parseComplexTemplate(templateInput.template, data);
            if (templateInput.metal) base.metal = templateInput.metal;
            if (templateInput.oxState !== undefined) base.oxState = parseRomanOrInt(templateInput.oxState);
            if (templateInput.geometry) base.geometry = templateInput.geometry;
            return base;
          }
          const metalSym = templateInput.metal || templateInput.metalSymbol || templateInput.M || 'M';
          const ligands = Array.isArray(templateInput.ligands)
            ? normalizeLigandList(templateInput.ligands, undefined, data)
            : normalizeLigandList(
                templateInput.ligand || templateInput.ligandFormula || templateInput.ligandId || templateInput.L,
                templateInput.count ?? templateInput.n ?? 6,
                data
              );
          const totalCount = ligands.reduce((a, b) => a + b.count, 0);
          const coordNumber = ligands.reduce((a, b) => a + b.count * (b.ligand.denticity || 1), 0);
          const ligandChargeSum = ligands.reduce((a, b) => a + b.count * b.ligand.charge, 0);
          const counterIons = templateInput.counterIons || null;
          const counterCharge = (counterIons?.cation ? counterIons.cation.count * counterIons.cation.ion.charge : 0) +
            (counterIons?.anion ? counterIons.anion.count * counterIons.anion.ion.charge : 0);

          const rawCharge = templateInput.charge !== undefined && templateInput.charge !== null
            ? templateInput.charge
            : templateInput.overallCharge;
          const oxRaw = templateInput.oxState !== undefined ? templateInput.oxState : templateInput.oxidationState;

          let charge;
          let oxState;
          if (oxRaw !== undefined && oxRaw !== null) {
            oxState = parseRomanOrInt(oxRaw);
            charge = oxState + ligandChargeSum;
          } else if (rawCharge !== undefined && rawCharge !== null) {
            charge = Number(rawCharge);
            oxState = charge - ligandChargeSum;
          } else if (counterIons && (counterIons.cation || counterIons.anion)) {
            charge = -counterCharge;
            oxState = charge - ligandChargeSum;
          } else {
            oxState = 2;
            charge = oxState + ligandChargeSum;
          }

          return {
            metal: metalSym,
            ligand: ligands[0].ligand,
            ligands,
            isHeteroleptic: ligands.length > 1,
            count: totalCount,
            charge,
            coordNumber,
            oxState,
            counterIons,
            geometry: templateInput.geometry || null,
            templateFormula: formatComplexFormula(metalSym, ligands, totalCount, charge, data, counterIons),
          };
        }

        const str = String(templateInput || '').trim();
        const bracketMatch = str.match(/^([^[\]]*)\[([^\[\]]+)\]([^[\]]*)$/);
        if (!bracketMatch) throw new Error(`Cannot parse complex template: "${str}"`);

        const prefixStr = bracketMatch[1].trim();
        const innerStr = bracketMatch[2].trim();
        const suffixStr = bracketMatch[3].trim();

        const { metal, ligands } = parseInnerCoordinationSphere(innerStr, data);
        const totalCount = ligands.reduce((a, b) => a + b.count, 0);
        const coordNumber = ligands.reduce((a, b) => a + b.count * (b.ligand.denticity || 1), 0);
        const ligandChargeSum = ligands.reduce((a, b) => a + b.count * b.ligand.charge, 0);

        let cation = null;
        let anion = null;
        let charge = 0;

        if (prefixStr) {
          cation = parseCounterIonFragment(prefixStr, 'cation');
          if (!cation) throw new Error(`Unknown counter-cation "${prefixStr}" in "${str}"`);
        }

        if (suffixStr) {
          const maybeAnion = parseCounterIonFragment(suffixStr, 'anion');
          if (maybeAnion && !/[+\-−^]/.test(suffixStr)) {
            anion = maybeAnion;
          } else {
            charge = parseChargeSuffix(suffixStr);
          }
        }

        const counterIons = (cation || anion) ? { cation, anion } : null;
        if (counterIons) {
          const counterCharge = (cation ? cation.count * cation.ion.charge : 0) +
            (anion ? anion.count * anion.ion.charge : 0);
          charge = -counterCharge;
        }

        const oxState = charge - ligandChargeSum;
        return {
          metal,
          ligand: ligands[0].ligand,
          ligands,
          isHeteroleptic: ligands.length > 1,
          count: totalCount,
          charge,
          coordNumber,
          oxState,
          counterIons,
          geometry: null,
          templateFormula: formatComplexFormula(metal, ligands, totalCount, charge, data, counterIons),
        };
      }

      function analyzeComplex(input, options = {}) {
        const mergedOpts = (input && typeof input === 'object') ? { ...input, ...options } : (options || {});
        const data = normalizeData(mergedOpts.lfData || mergedOpts.data || DEFAULT_DATA);
        const pTermMode = (mergedOpts.pTermMode || 'relative') === 'absolute' ? 'absolute' : 'relative';
        const textbookExceptions = Boolean(mergedOpts.textbookExceptions ?? false);

        const parsed = parseComplexTemplate(input, data);

        const metalObj = resolveMetal(parsed.metal, data);
        if (!metalObj) throw new Error(`Unknown metal: ${parsed.metal}`);
        const oxRaw = input?.oxState !== undefined ? input.oxState : input?.oxidationState;
        const oxState = oxRaw !== undefined ? parseRomanOrInt(oxRaw) : parsed.oxState;
        const ligandChargeSum = parsed.ligands.reduce((a, b) => a + b.count * b.ligand.charge, 0);
        const charge = oxState + ligandChargeSum;
        const dn = computeDn(metalObj, oxState, data);
        const effFieldClass = weakestLigandClass(parsed.ligands, oxState);
        const geometry = inferGeometry(parsed.coordNumber, dn, parsed.ligands, parsed.geometry, oxState);
        // Rule: square planar only for d8 with all strong-field ligands
        if (geometry === 'square_planar' && (dn !== 8 || !areAllLigandsStrong(parsed.ligands, oxState))) {
          return null;
        }
        const spinState = inferSpinState(geometry, dn, parsed.ligands, {
          textbookExceptions,
          metal: metalObj.symbol,
          oxState,
          coordNumber: parsed.coordNumber,
        });
        const filling = computeOrbitalFilling(geometry, dn, spinState);
        const muSO = filling.unpaired !== null ? computeSpinOnlyMoment(filling.unpaired) : null;
        const isDiamagnetic = filling.unpaired !== null ? filling.unpaired === 0 : null;
        const magnetic = filling.unpaired === null ? 'undetermined' : (isDiamagnetic ? 'diamagnetic' : 'paramagnetic');
        const pCount = filling.unpaired === null
          ? null
          : (pTermMode === 'absolute' ? filling.pTermsAbsolute : filling.pTermsRelative);
        const naming = generateIUPACName(metalObj, oxState, parsed.ligands, parsed.count, charge, data, parsed.counterIons);
        const formula = formatComplexFormula(metalObj.symbol, parsed.ligands, parsed.count, charge, data, parsed.counterIons);
        const isCoIIIH2OException = isCobaltIIIHexaaquaCase(metalObj.symbol, oxState, parsed.ligands, parsed.coordNumber);

        return {
          metal: metalObj.symbol,
          metalName: metalObj.name,
          oxState,
          oxRoman: romanNumeral(oxState),
          ligand: parsed.ligand.id,
          ligandFormula: parsed.ligand.formula,
          ligands: parsed.ligands,
          isHeteroleptic: parsed.isHeteroleptic,
          counterIons: parsed.counterIons,
          fieldClass: effFieldClass,
          count: parsed.count,
          coordNumber: parsed.coordNumber,
          charge,
          formula,
          dn,
          dnLabel: `d^${dn}`,
          geometry,
          spinState,
          configuration: filling.configuration,
          levels: filling.levels,
          unpaired: filling.unpaired,
          muSO,
          magnetic,
          isDiamagnetic,
          lfseCoeff: filling.lfseCoeff,
          lfseUnit: filling.lfseUnit,
          lfseDisplay: filling.lfseCoeff !== null ? `${filling.lfseCoeff} ${filling.lfseUnit}` : null,
          lfseExpression: filling.lfseExpression,
          pTermsRelative: filling.pTermsRelative,
          pTermsAbsolute: filling.pTermsAbsolute,
          pCount,
          pTerms: pCount,
          pTermMode,
          iupacName: naming.canonicalName,
          complexIonName: naming.complexIonName,
          acceptedNames: naming.acceptedNames,
          acceptedNamePatterns: naming.acceptedNamePatterns,
          isCoIIIH2OException,
          textbookExceptionNote: (!textbookExceptions && isCoIIIH2OException)
            ? 'Note: Under standard ligand-field rules H2O is treated as weak-field, but experimentally [Co(H2O)6]3+ is in fact low-spin (t2g^6 eg^0, diamagnetic).'
            : null,
        };
      }

      function normalizeConstraint(constraint) {
        if (typeof constraint === 'string') {
          const raw = constraint.trim();
          const s = raw.toLowerCase();
          if (s === 'most_unpaired' || s === 'most unpaired') return { type: 'most_unpaired' };
          if (s === 'fewest_unpaired' || s === 'fewest unpaired' || s === 'least_unpaired' || s === 'least unpaired') {
            return { type: 'fewest_unpaired' };
          }
          if (s === 'diamagnetic') return { type: 'diamagnetic' };

          const mMu = s.match(/(?:μs|mu_?s|mu_?so|spin[- ]only)\s*=?\s*([0-9]+(?:\.[0-9]+)?)/i);
          if (mMu) return { type: 'mu_s', value: Number(mMu[1]) };

          const mUnp = s.match(/(?:unpaired\s*=?\s*(\d+)|(\d+)\s+unpaired|one\s+unpaired)/);
          if (mUnp) {
            const val = s.includes('one unpaired') ? 1 : Number(mUnp[1] ?? mUnp[2]);
            return { type: 'unpaired', value: val };
          }

          if (/lfse/i.test(raw) || /Δ|\\Delta/i.test(raw)) {
            const stripped = raw.replace(/^.*?lfse\s*=?\s*/i, '').trim();
            const parsedLfse = parseLfseExpression(stripped);
            if (Number.isFinite(parsedLfse.a)) {
              return {
                type: 'lfse',
                value: parsedLfse.a,
                a: parsedLfse.a,
                b: parsedLfse.b,
                hasExplicitP: parsedLfse.hasExplicitP,
              };
            }
          }

          if (/(?:half[- ]?filled|empty|full|fully[- ]?filled)\s*(?:e_?g|t_?2g|e|t_?2)|(?:e_?g|t_?2g|e|t_?2)\s*(?:half[- ]?filled|empty|full|fully[- ]?filled)/i.test(s)) {
            return { type: 'orbital_occupancy', value: raw };
          }
        }
        if (constraint && typeof constraint === 'object') {
          if (constraint.type === 'lfse') {
            if (typeof constraint.value === 'string' || typeof constraint.expression === 'string') {
              const p = parseLfseExpression(constraint.expression || constraint.value);
              return {
                ...constraint,
                value: p.a,
                a: p.a,
                b: constraint.b !== undefined ? Number(constraint.b) : p.b,
                hasExplicitP: constraint.b !== undefined || p.hasExplicitP,
              };
            }
            const a = Number(constraint.a ?? constraint.value ?? 0);
            const b = Number(constraint.b ?? 0);
            return {
              ...constraint,
              value: a,
              a,
              b,
              hasExplicitP: constraint.b !== undefined || Boolean(constraint.hasExplicitP),
            };
          }
          return constraint;
        }
        return { type: 'unpaired', value: 1 };
      }

      function solveInverseTemplate(templateInput, constraintInput, options = {}) {
        const mergedOpts = (templateInput && typeof templateInput === 'object')
          ? { ...templateInput, ...options }
          : (options || {});
        const effectiveConstraint = constraintInput !== undefined
          ? constraintInput
          : (templateInput && typeof templateInput === 'object' ? templateInput.constraint : undefined);
        const data = normalizeData(mergedOpts.lfData || mergedOpts.data || DEFAULT_DATA);
        const includeD0D10 = Boolean(mergedOpts.includeD0D10InDiamagnetic ?? false);
        const textbookExceptions = Boolean(mergedOpts.textbookExceptions ?? false);
        const pTermMode = (mergedOpts.pTermMode || 'relative') === 'absolute' ? 'absolute' : 'relative';
        const parsed = parseComplexTemplate(templateInput, data);
        const constraint = normalizeConstraint(effectiveConstraint);

        // Identify all metals in Sc–Zn that allow this oxidation state.
        // Amendment 1 & 6: Oxidation state 0 is allowed in fixed items and self-tests (d-count = group - 0).
        const eligibleMetals = data.metals.filter((m) => {
          if (parsed.oxState === 0) {
            return m.group >= 0 && m.group <= 10;
          }
          return m.oxStates.includes(parsed.oxState);
        });

        const allEvaluated = eligibleMetals.map((m) =>
          analyzeComplex(
            {
              metal: m.symbol,
              oxState: parsed.oxState,
              ligands: parsed.ligands,
              count: parsed.count,
              charge: parsed.charge,
              counterIons: parsed.counterIons,
              geometry: parsed.geometry,
            },
            { lfData: data, pTermMode, includeD0D10InDiamagnetic: includeD0D10, textbookExceptions }
          )
        ).filter(Boolean);

        let matching = [];
        if (constraint.type === 'unpaired') {
          const targetK = Number(constraint.value ?? 0);
          matching = allEvaluated.filter((c) => c.unpaired !== null && c.unpaired === targetK);
        } else if (constraint.type === 'most_unpaired') {
          const determined = allEvaluated.filter((c) => c.unpaired !== null);
          const maxU = determined.reduce((acc, c) => Math.max(acc, c.unpaired), 0);
          if (maxU > 0) {
            matching = determined.filter((c) => c.unpaired === maxU);
          }
        } else if (constraint.type === 'fewest_unpaired') {
          const pool = allEvaluated.filter((c) => c.unpaired !== null && (includeD0D10 || (c.dn > 0 && c.dn < 10)));
          if (pool.length > 0) {
            const minU = pool.reduce((acc, c) => Math.min(acc, c.unpaired), Infinity);
            matching = pool.filter((c) => c.unpaired === minU);
          }
        } else if (constraint.type === 'diamagnetic') {
          matching = allEvaluated.filter((c) => {
            if (c.unpaired !== 0) return false;
            if (!includeD0D10 && (c.dn === 0 || c.dn === 10)) return false;
            return true;
          });
        } else if (constraint.type === 'mu_s' || constraint.type === 'mu_so') {
          const targetMu = Number(constraint.value ?? 0);
          const inferredN = muSpinOnlyToUnpaired(targetMu, 0.08);
          matching = allEvaluated.filter((c) =>
            c.unpaired !== null &&
            c.muSO !== null &&
            ((inferredN !== null && c.unpaired === inferredN) || Math.abs(c.muSO - targetMu) <= 0.05)
          );
        } else if (constraint.type === 'orbital_occupancy') {
          matching = allEvaluated.filter((c) => matchesOrbitalOccupancy(c, constraint.value || constraint.occupancy));
        } else if (constraint.type === 'lfse') {
          const targetA = Number(constraint.a ?? constraint.value ?? 0);
          const targetB = Number(constraint.b ?? 0);
          // Match both a and b, with P counted relative to high spin (never match null LFSE e.g. square_planar / undetermined)
          matching = allEvaluated.filter((c) =>
            c.lfseCoeff !== null &&
            c.pTermsRelative !== null &&
            Math.abs(c.lfseCoeff - targetA) < 1e-4 &&
            Math.abs(c.pTermsRelative - targetB) < 1e-4
          );
        }

        // Amendment 5: When textbookExceptions is off and the answer set contains Co(III) with H2O, add a note that [Co(H2O)6]3+ is in fact low-spin.
        const hasCoIIIH2OInSet = !textbookExceptions && matching.some((c) => c.isCoIIIH2OException);
        const textbookExceptionNote = hasCoIIIH2OInSet
          ? 'Note: [Co(H2O)6]3+ is in fact low-spin (t2g^6 eg^0, diamagnetic), although treating H2O as universally weak-field gives 4 unpaired electrons.'
          : null;

        return {
          templateFormula: parsed.templateFormula,
          ligand: parsed.ligand,
          ligands: parsed.ligands,
          isHeteroleptic: parsed.isHeteroleptic,
          counterIons: parsed.counterIons,
          count: parsed.count,
          coordNumber: parsed.coordNumber,
          charge: parsed.charge,
          oxState: parsed.oxState,
          oxRoman: romanNumeral(parsed.oxState),
          constraint,
          validMetals: matching.map((c) => c.metal),
          candidates: matching,
          allEvaluated,
          textbookExceptionNote,
        };
      }

      function buildForwardQuestionNode(spec, options = {}) {
        const analysis = analyzeComplex(spec, options);
        if (!analysis) return null;
        // Amendment 6: Oxidation state 0 is never used in generated questions unless explicitly allowed for fixed items
        if (analysis.oxState === 0 && !options.allowOxStateZero) return null;
        // Amendment 3: Never generate a question whose answer depends on spin state if the weakest ligand is NH3 (intermediate)
        if ((analysis.spinState === 'undetermined' || (analysis.fieldClass === 'intermediate' && dependsOnSpinState(analysis.geometry, analysis.dn))) && !options.allowIntermediateSpinQuestion) {
          return null;
        }

        const pMode = analysis.pTermMode;
        const pLabel = pMode === 'absolute'
          ? 'P count (total electron pairs, absolute)'
          : 'P count (extra pairs vs high spin, relative)';
        const geomLabel = analysis.geometry === 'Oh'
          ? 'octahedral'
          : analysis.geometry === 'Td'
            ? 'tetrahedral'
            : 'square-planar';
        const includeLfse = analysis.geometry !== 'square_planar' && analysis.lfseCoeff !== null;
        const cleanFormulaSlug = analysis.formula.replace(/[^A-Za-z0-9]/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, '').toLowerCase();
        const nodeId = spec.id || `lf-fwd-${analysis.geometry.toLowerCase()}-${cleanFormulaSlug}`;
        const week = spec.week || ((analysis.dn % 2 === 0) ? 7 : 8);
        const complexKindLabel = analysis.isHeteroleptic ? 'heteroleptic' : 'homoleptic';
        const noteSuffix = analysis.textbookExceptionNote ? ` ${analysis.textbookExceptionNote}` : '';

        const stemParts = [
          'its $d^n$ electron count',
          'number of unpaired electrons',
          ...(includeLfse ? [`LFSE stabilisation coefficient (in $${analysis.lfseUnit === 'Δo' ? '\\Delta_o' : '\\Delta_t'}$, positive for stabilisation)`] : []),
          `number of pairing energy ($P$) terms (**${pMode}** mode)`,
          'spin-only magnetic moment $\\mu_{\\text{so}}$ (in $\\mu_{\\text{B}}$)',
          'and IUPAC name',
        ].join(', ');

        const inputFields = [
          { key: 'dn', label: 'd^n count (n)', placeholder: 'e.g. 6 or d6' },
          { key: 'unpaired', label: 'Unpaired e⁻ (n)', placeholder: 'e.g. 4' },
          ...(includeLfse ? [{ key: 'lfse', label: `LFSE coefficient (${analysis.lfseUnit})`, placeholder: 'e.g. 0.4' }] : []),
          { key: 'pCount', label: pLabel, placeholder: 'e.g. 0' },
          { key: 'muSO', label: 'μ_so (μ_B)', placeholder: 'e.g. 4.90' },
          { key: 'name', label: 'IUPAC Name', placeholder: `e.g. ${analysis.iupacName}` },
        ];

        const targets = {
          dn: {
            type: 'pattern',
            caseSensitive: false,
            acceptedPatterns: [`^\\s*(?:d\\^?)?${analysis.dn}\\s*$`],
            expectedDisplay: `${analysis.dn} (d^${analysis.dn})`,
          },
          unpaired: {
            type: 'numeric',
            targetExpr: String(analysis.unpaired),
            tolerance: 0,
            expectedDisplay: String(analysis.unpaired),
          },
          ...(includeLfse ? {
            lfse: {
              type: 'numeric',
              targetExpr: String(analysis.lfseCoeff),
              tolerance: 0.01,
              expectedDisplay: `${analysis.lfseCoeff}`,
            },
          } : {}),
          pCount: {
            type: 'numeric',
            targetExpr: String(analysis.pCount),
            tolerance: 0,
            expectedDisplay: String(analysis.pCount),
          },
          muSO: {
            type: 'numeric',
            targetExpr: String(analysis.muSO),
            tolerance: 0.05,
            expectedDisplay: analysis.muSO.toFixed(2),
          },
          name: {
            type: 'pattern',
            caseSensitive: false,
            acceptedPatterns: analysis.acceptedNamePatterns,
            expectedDisplay: analysis.iupacName,
          },
        };

        const lfseExplPart = includeLfse ? `, $\\text{LFSE} = ${analysis.lfseExpression}$` : '';

        return {
          schemaVersion: '3.0',
          id: nodeId,
          moduleCode: 'CM2021',
          tier: 'atomic',
          metadata: {
            title: `Ligand Field Analysis: ${analysis.formula}`,
            source: 'LF Question Factory',
            week,
            chapters: [7, 8],
            primaryTheme: 'Ligand Field Theory & Magnetism',
            conceptTags: ['ligand-field-theory', 'cfse-calculation', 'spin-only-magnetism', 'iupac-nomenclature'],
            difficultyEstimate: 4.5,
            estimatedMinutes: 2.5,
            examStyle: 'short_2to3',
            family: `lf-fwd-${analysis.metal.toLowerCase()}-${analysis.oxState}`,
            isGeneratedLF: true,
          },
          variants: [
            {
              variantId: `${nodeId}-v1`,
              perspectiveLabel: 'Forward Complex Characterization',
              marks: 3,
              stem: `For the ${complexKindLabel} ${geomLabel} coordination compound **` + '`' + analysis.formula + '`' + `**, determine ${stemParts}.`,
              hint: `${analysis.metal}(${analysis.oxRoman}) is $d^{${analysis.dn}}$ in a ${geomLabel} ${analysis.fieldClass}-field (${analysis.spinState}-spin) environment (${analysis.configuration}).`,
              inputSlot: {
                type: 'mapped_fields',
                layout: 'grid',
                fields: inputFields,
              },
              evaluator: {
                type: 'mapped_fields_match',
                targets,
              },
              explanation: `**${analysis.formula}** (${analysis.iupacName}): ${analysis.metal}(${analysis.oxRoman}) is **$d^{${analysis.dn}}$** (${geomLabel}, ${analysis.spinState} spin, configuration \`${analysis.configuration}\`). Unpaired electrons $n = ${analysis.unpaired}$, $\\mu_{\\text{so}} = \\sqrt{${analysis.unpaired}(${analysis.unpaired}+2)} = ${analysis.muSO.toFixed(2)}\\ \\mu_{\\text{B}}$ (${analysis.magnetic})${lfseExplPart} ($P_{\\text{relative}} = ${analysis.pTermsRelative}, P_{\\text{absolute}} = ${analysis.pTermsAbsolute}$).${noteSuffix}`,
            },
          ],
        };
      }

      function buildInverseQuestionNode(templateInput, constraintInput, options = {}) {
        const solved = solveInverseTemplate(templateInput, constraintInput, options);
        if (!solved.validMetals.length) return null;
        // Amendment 6: Oxidation state 0 is never used in generated questions unless explicitly allowed
        if (solved.oxState === 0 && !options.allowOxStateZero) return null;
        // Amendment 3: Never generate a question whose answer depends on spin state if the weakest ligand is NH3
        if (weakestLigandClass(solved.ligands, solved.oxState) === 'intermediate' && !options.allowIntermediateSpinQuestion) {
          const anySpinDep = solved.allEvaluated.some((c) => dependsOnSpinState(c.geometry, c.dn));
          if (anySpinDep) return null;
        }

        const data = normalizeData(options.lfData || options.data || DEFAULT_DATA);
        const synonyms = {};
        for (const m of data.metals) {
          synonyms[m.name.toLowerCase()] = m.symbol.toLowerCase();
          synonyms[`${m.symbol.toLowerCase()}(${solved.oxRoman.toLowerCase()})`] = m.symbol.toLowerCase();
        }

        const cType = solved.constraint.type;
        let constraintText = '';
        let slug = cType;
        let week = 8;
        if (cType === 'unpaired') {
          const k = Number(solved.constraint.value);
          constraintText = `has **${k === 1 ? 'one unpaired electron' : `${k} unpaired electrons`}** ($n = ${k}$)`;
          slug = `unpaired-${k}`;
          week = 8;
        } else if (cType === 'most_unpaired') {
          constraintText = 'has the **most unpaired electrons**';
          slug = 'most-unpaired';
          week = 8;
        } else if (cType === 'fewest_unpaired') {
          constraintText = 'has the **fewest unpaired electrons**';
          slug = 'fewest-unpaired';
          week = 8;
        } else if (cType === 'diamagnetic') {
          const d0d10Note = options.includeD0D10InDiamagnetic
            ? '(including $d^0 / d^{10}$ configurations)'
            : '(excluding trivial $d^0 / d^{10}$ closed-subshell cases)';
          constraintText = `is **diamagnetic** ($n = 0$) ${d0d10Note}`;
          slug = 'diamagnetic';
          week = 8;
        } else if (cType === 'mu_s' || cType === 'mu_so') {
          const muVal = Number(solved.constraint.value);
          constraintText = `has a **spin-only magnetic moment $\\mu_s = ${muVal.toFixed(2)}\\ \\text{BM}$**`;
          slug = `mus-${String(muVal).replace('.', 'p')}`;
          week = 8;
        } else if (cType === 'orbital_occupancy') {
          const occLabel = String(solved.constraint.value || solved.constraint.occupancy || '');
          constraintText = `has orbital occupancy **"${occLabel}"**`;
          slug = `occ-${occLabel.toLowerCase().replace(/[^a-z0-9]+/g, '-')}`;
          week = 7;
        } else if (cType === 'lfse') {
          const unit = solved.candidates[0]?.lfseUnit || 'Δo';
          const exprDisp = formatLfseExpression(solved.constraint.a ?? solved.constraint.value, solved.constraint.b ?? 0, unit);
          constraintText = `has **$\\text{LFSE} = ${exprDisp}$**`;
          slug = `lfse-${String(solved.constraint.a ?? solved.constraint.value).replace('.', 'p')}-${solved.constraint.b ?? 0}p`;
          week = 7;
        }

        const tplSlug = solved.templateFormula
          .replace(/[\[\]()]/g, '_')
          .replace(/\+/g, 'plus')
          .replace(/-/g, 'minus')
          .replace(/_+/g, '_')
          .replace(/^_|_$/g, '');
        const nodeId = options.id || `lf-inv-${tplSlug}-${slug}`;

        const allAcceptedNamePatterns = [...new Set(solved.candidates.flatMap((c) => c.acceptedNamePatterns))];
        const lfseCandidates = solved.candidates.filter((c) => c.geometry !== 'square_planar' && c.lfseCoeff !== null);
        const includeInverseLfse = lfseCandidates.length > 0 && lfseCandidates.length === solved.candidates.length;
        const allLfsePairs = lfseCandidates.map((c) => ({
          a: c.lfseCoeff,
          b: c.pTermsRelative,
          unit: c.lfseUnit,
          expression: c.lfseExpression,
        }));
        const allLfseValues = [...new Set(lfseCandidates.map((c) => c.lfseCoeff))];
        const firstCand = solved.candidates[0];
        const expectedNamesDisplay = solved.candidates.map((c) => c.iupacName).join(' or ');
        const expectedLfseDisplay = [...new Set(lfseCandidates.map((c) =>
          c.pTermsRelative > 0 ? `${c.lfseExpression} (or ${c.lfseCoeff})` : `${c.lfseExpression}`
        ))].join(' or ');
        const ligSummary = solved.ligands.map((item) => `${item.ligand.formula} (${item.ligand.fieldClass})`).join(', ');
        const noteSuffix = solved.textbookExceptionNote ? ` ${solved.textbookExceptionNote}` : '';

        const invPromptSuffix = includeInverseLfse
          ? `Also provide the IUPAC name and LFSE (as a multiple of $${firstCand.lfseUnit === 'Δo' ? '\\Delta_o' : '\\Delta_t'}$, plus pairing energy $P$ where it applies) for a matching complex.`
          : 'Also provide the IUPAC name for a matching complex.';

        const invFields = [
          {
            key: 'name',
            label: 'IUPAC Name (for a valid M)',
            placeholder: 'IUPAC name of the complex',
          },
          ...(includeInverseLfse ? [{
            key: 'lfse',
            label: `LFSE (${firstCand.lfseUnit})`,
            placeholder: `number × ${firstCand.lfseUnit}`,
          }] : []),
        ];

        const invEvalFields = {
          name: {
            type: 'pattern',
            caseSensitive: false,
            acceptedPatterns: allAcceptedNamePatterns,
            expectedDisplay: expectedNamesDisplay,
          },
          ...(includeInverseLfse ? {
            lfse: {
              type: 'lfse_expr',
              targetValues: allLfseValues,
              targetLfsePairs: allLfsePairs,
              targetExpr: String(firstCand.lfseCoeff),
              tolerance: 0.01,
              expectedDisplay: expectedLfseDisplay,
            },
          } : {}),
        };

        return {
          schemaVersion: '3.0',
          id: nodeId,
          moduleCode: 'CM2021',
          tier: 'atomic',
          metadata: {
            title: `Inverse Ligand Field Identification: ${solved.templateFormula} (${slug.replace(/-/g, ' ')})`,
            source: 'LF Question Factory',
            week,
            chapters: [7, 8],
            primaryTheme: 'Inverse Metal Identification & LFT',
            conceptTags: ['ligand-field-theory', 'inverse-metal-identification', 'cfse-calculation', 'spin-only-magnetism'],
            difficultyEstimate: 5.5,
            estimatedMinutes: 3,
            examStyle: 'short_2to3',
            family: `lf-inv-${tplSlug}`,
            isGeneratedLF: true,
            lfTemplate: solved.templateFormula,
            lfConstraintType: cType,
            lfCoordNumber: solved.coordNumber,
            lfAnswerCount: solved.validMetals.length,
            textbookExceptionNote: solved.textbookExceptionNote,
          },
          variants: [
            {
              variantId: `${nodeId}-v1`,
              perspectiveLabel: includeInverseLfse ? 'Inverse 3d Metal Set + Name & LFSE' : 'Inverse 3d Metal Set + Name',
              marks: 3,
              stem: `Identify **all** first-row transition metals $\\text{M} \\in \\{\\text{Sc}\\text{--}\\text{Zn}\\}$ for which **` + '`' + solved.templateFormula + '`' + `** ${constraintText}. ${invPromptSuffix}`,
              hint: `In \`${solved.templateFormula}\`, the metal oxidation state is ${solved.oxState >= 0 ? `+${solved.oxState}` : solved.oxState} (${solved.oxRoman}), with ligand(s): ${ligSummary}.`,
              inputSlot: {
                type: 'unordered_set',
                placeholder: 'Type metal symbol (e.g. Ti, Cr, Mn, Fe, Co, Cu) and press Enter',
                fields: invFields,
              },
              evaluator: {
                type: 'set_match',
                targetSet: solved.validMetals,
                synonyms,
                caseSensitive: false,
                penaltyRatio: 0.5,
                falsePositivePenalty: 0.5,
                textbookExceptionNote: solved.textbookExceptionNote,
                fields: invEvalFields,
              },
              explanation: `For \`${solved.templateFormula}\`, $\\text{M}$ is in oxidation state **${solved.oxRoman}** ($${solved.oxState >= 0 ? `+${solved.oxState}` : solved.oxState}$). Valid 3d metal(s): **$\\{${solved.validMetals.join(', ')}\\}$**. Matching complex(es): ${solved.candidates.map((c) => `\`${c.formula}\` (${c.iupacName}, $d^{${c.dn}}$, \`${c.configuration}\`, $n=${c.unpaired}$${c.lfseExpression ? `, $\\text{LFSE} = ${c.lfseExpression}$` : ''})`).join('; ')}.${noteSuffix}`,
            },
          ],
        };
      }

      function generateForwardQuestions(options = {}) {
        const data = normalizeData(options.lfData || options.data || DEFAULT_DATA);
        // Only use weak and strong ligands in generated spin-state / LFT questions (never NH3 as weakest when spin-state dependent)
        const spinLigands = data.ligands.filter((l) => l.fieldClass === 'weak' || l.fieldClass === 'strong');
        const findLig = (id) => spinLigands.find((l) => l.id === id) || null;
        if (!spinLigands.length) return [];

        const nodes = [];
        for (const m of data.metals) {
          for (const ox of m.oxStates) {
            if (ox === 0) continue; // Oxidation state 0 is never used in generated questions
            const dn = m.group - ox;
            if (dn < 0 || dn > 10) continue;
            const h2o = findLig('H2O');
            const cn = findLig('CN-');
            const cl = findLig('Cl-');
            const en = findLig('en');

            if (h2o && ox < 4 && !(m.symbol === 'Cu' && ox === 1)) {
              const n1 = buildForwardQuestionNode({ metal: m.symbol, oxState: ox, ligand: h2o.id, count: 6, week: 7 }, options);
              if (n1) nodes.push(n1);
            }
            if (cn && dn >= 4 && dn <= 7 && ox <= 3) {
              const n2 = buildForwardQuestionNode({ metal: m.symbol, oxState: ox, ligand: cn.id, count: 6, week: 8 }, options);
              if (n2) nodes.push(n2);
            }
            if (en && dn === 6 && ox === 3) {
              const nEn = buildForwardQuestionNode({ metal: m.symbol, oxState: ox, ligand: en.id, count: 3, week: 7 }, options);
              if (nEn) nodes.push(nEn);
            }
            if (cl && ox >= 2 && ox <= 3 && (dn === 2 || dn === 5 || dn === 7 || dn === 8)) {
              const n3 = buildForwardQuestionNode({ metal: m.symbol, oxState: ox, ligand: cl.id, count: 4, geometry: 'Td', week: 8 }, options);
              if (n3) nodes.push(n3);
            }
          }
        }
        return nodes;
      }

      function generateInverseQuestions(options = {}) {
        const data = normalizeData(options.lfData || options.data || DEFAULT_DATA);
        const hasLig = (id) => data.ligands.some((l) => l.id === id && (l.fieldClass === 'weak' || l.fieldClass === 'strong'));

        const candidateSpecs = [];
        if (hasLig('H2O')) {
          candidateSpecs.push(
            { template: '[M(H2O)6]3+', constraint: { type: 'unpaired', value: 1 } },
            { template: '[M(H2O)6]3+', constraint: { type: 'unpaired', value: 2 } },
            { template: '[M(H2O)6]3+', constraint: { type: 'unpaired', value: 3 } },
            { template: '[M(H2O)6]3+', constraint: { type: 'most_unpaired' } },
            { template: '[M(H2O)6]3+', constraint: { type: 'lfse', value: 0.4 } },
            { template: '[M(H2O)6]3+', constraint: { type: 'lfse', value: 1.2 } },
            { template: '[M(H2O)6]2+', constraint: { type: 'lfse', value: 0.6 } },
            { template: '[M(H2O)6]2+', constraint: { type: 'lfse', value: 0.8 } },
            { template: '[M(H2O)6]2+', constraint: { type: 'lfse', value: 1.2 } },
            { template: '[M(H2O)6]2+', constraint: { type: 'unpaired', value: 3 } },
            { template: '[M(H2O)6]2+', constraint: { type: 'most_unpaired' } },
            { template: '[M(H2O)6]2+', constraint: { type: 'diamagnetic' } },
            { template: '[M(H2O)6]SO4', constraint: { type: 'lfse', value: 0.4 } }
          );
          if (hasLig('Cl-')) {
            candidateSpecs.push(
              { template: '[M(H2O)6]Cl3', constraint: { type: 'unpaired', value: 4 } },
              { template: '[M(H2O)6]Cl3', constraint: { type: 'orbital_occupancy', value: 'eg empty' } }
            );
          }
        }
        if (hasLig('F-')) {
          candidateSpecs.push(
            { template: 'K2[MF4]', constraint: { type: 'orbital_occupancy', value: 'half-filled e' } },
            { template: 'K2[MF4]', constraint: { type: 'mu_s', value: 3.87 } }
          );
        }
        if (hasLig('en') && hasLig('F-')) {
          candidateSpecs.push(
            { template: '[M(en)3]F3', constraint: { type: 'lfse', a: 2, b: 2 } },
            { template: '[M(en)3]F3', constraint: { type: 'orbital_occupancy', value: 't2g full' } }
          );
        }
        if (hasLig('Br-')) {
          candidateSpecs.push(
            { template: '[MBr4]-', constraint: { type: 'most_unpaired' } },
            { template: '[MBr4]-', constraint: { type: 'unpaired', value: 1 } },
            { template: '[MBr4]2-', constraint: { type: 'unpaired', value: 2 } },
            { template: '[MBr4]2-', constraint: { type: 'lfse', value: 0.8 } },
            { template: '[MBr4]2-', constraint: { type: 'lfse', value: 1.2 } }
          );
        }
        if (hasLig('Cl-')) {
          candidateSpecs.push(
            { template: '[MCl4]2-', constraint: { type: 'most_unpaired' } },
            { template: '[MCl4]2-', constraint: { type: 'unpaired', value: 3 } },
            { template: '[MCl6]3-', constraint: { type: 'unpaired', value: 4 } }
          );
        }
        if (hasLig('CN-')) {
          candidateSpecs.push(
            { template: '[M(CN)6]3-', constraint: { type: 'diamagnetic' } },
            { template: '[M(CN)6]3-', constraint: { type: 'unpaired', value: 1 } },
            { template: '[M(CN)6]3-', constraint: { type: 'unpaired', value: 2 } },
            { template: '[M(CN)6]3-', constraint: { type: 'lfse', a: 2.0, b: 2 } },
            { template: '[M(CN)6]3-', constraint: { type: 'lfse', a: 2.4, b: 2 } },
            { template: '[M(CN)6]4-', constraint: { type: 'diamagnetic' } },
            { template: '[M(CN)6]4-', constraint: { type: 'lfse', a: 2.4, b: 2 } }
          );
        }

        const nodes = [];
        for (const item of candidateSpecs) {
          const node = buildInverseQuestionNode(item.template, item.constraint, options);
          if (node) nodes.push(node); // Emit only inverse questions with >= 1 answer
        }

        /* Extended pool for the set composer: every constraint the engine can solve on the conventional
           complexes. These are composer-only (kept out of the study queue, mock papers and the bank list) so one
           skill cannot flood the queue; their ids are stable, so attempts on them still count for mastery. */
        if (options.extendedInverse !== false) {
          const have = new Set(nodes.map((n) => n.id));
          const extOpts = { ...options, allowOxStateZero: false };
          const templates = ['[M(H2O)6]2+', '[M(H2O)6]3+', '[MCl4]-', '[MCl4]2-', '[MBr4]-', '[MBr4]2-', '[MI4]-', '[MI4]2-',
            '[MF6]3-', '[MCl6]3-', '[M(CN)6]3-', '[M(CN)6]4-', '[M(en)3]3+', '[M(en)3]2+'];
          for (const t of templates) {
            let constraints;
            try {
              const probe = solveInverseTemplate(t, { type: 'most_unpaired' }, extOpts);
              constraints = [{ type: 'most_unpaired' }, { type: 'diamagnetic' }];
              for (let k = 1; k <= 5; k++) constraints.push({ type: 'unpaired', value: k });
              const pairs = new Set(probe.allEvaluated.filter((c) => c.lfseCoeff !== null && c.pTermsRelative !== null).map((c) => `${c.lfseCoeff}|${c.pTermsRelative}`));
              for (const pr of pairs) { const [a, b] = pr.split('|').map(Number); constraints.push({ type: 'lfse', a, b }); }
            } catch (err) { continue; }
            for (const c of constraints) {
              let node = null;
              try { node = buildInverseQuestionNode(t, c, extOpts); } catch (err) { node = null; }
              if (!node || have.has(node.id)) continue;
              node.metadata.composerOnly = true;
              have.add(node.id);
              nodes.push(node);
            }
          }
        }
        return nodes;
      }

      /* Pure. Compose an exam-style set (like the finals' "identify the first-row metal" question) from the
         generated inverse nodes: distinct complexes, covering aqua, tetrahedral, strong-field and an LFSE clue,
         with at least one part that has more than one valid metal. Deterministic for a given seed. */
      function composeMetalIdSet(pool, options = {}) {
        const parts = Math.max(1, Number(options.parts) || 5);
        let st = Number.isFinite(Number(options.seed)) && options.seed !== undefined && options.seed !== null
          ? (Math.abs(Math.floor(Number(options.seed))) % 2147483646) || 1
          : Math.floor(Math.random() * 2147483646) + 1;
        const rand = () => { st = (st * 16807) % 2147483647; return (st - 1) / 2147483646; };
        const cands = (pool || []).filter((n) => String(n.id).startsWith('lf-inv-') && n.metadata?.lfTemplate);
        const tpl = (n) => n.metadata.lfTemplate;
        const wants = [
          (n) => /H2O/.test(tpl(n)),
          (n) => n.metadata.lfCoordNumber === 4,
          (n) => /CN|\(en\)/.test(tpl(n)),
          (n) => n.metadata.lfConstraintType === 'lfse',
          (n) => n.metadata.lfAnswerCount >= 2,
        ];
        const chosen = [];
        const usedTpl = new Set();
        const draw = (pred) => {
          const opts = cands.filter((n) => pred(n) && !usedTpl.has(tpl(n)) && !chosen.includes(n));
          if (!opts.length) return false;
          const n = opts[Math.floor(rand() * opts.length)];
          chosen.push(n); usedTpl.add(tpl(n));
          return true;
        };
        for (const pred of wants) { if (chosen.length < parts) draw(pred); }
        while (chosen.length < parts && draw(() => true));
        for (let i = chosen.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [chosen[i], chosen[j]] = [chosen[j], chosen[i]]; }
        return chosen;
      }

      function generateQuestionBank(options = {}) {
        return [
          ...generateForwardQuestions(options),
          ...generateInverseQuestions(options),
        ];
      }

      function runSelfTest(options = {}) {
        const testOpts = {
          lfData: DEFAULT_DATA,
          pTermMode: 'relative',
          includeD0D10InDiamagnetic: false,
          textbookExceptions: false,
          allowOxStateZero: true,
          ...options,
        };
        const cases = [
          {
            label: '[M(H2O)6]3+ one unpaired',
            template: '[M(H2O)6]3+',
            constraint: { type: 'unpaired', value: 1 },
            expected: ['Ti'],
          },
          {
            label: '[MBr4]- most unpaired',
            template: '[MBr4]-',
            constraint: { type: 'most_unpaired' },
            expected: ['Fe'],
          },
          {
            label: 'diamagnetic [M(CN)6]3-',
            template: '[M(CN)6]3-',
            constraint: { type: 'diamagnetic' },
            expected: ['Co'],
          },
          {
            label: '[M(H2O)6]2+ with LFSE 0.6 Δo',
            template: '[M(H2O)6]2+',
            constraint: { type: 'lfse', value: 0.6 },
            expected: ['Cr', 'Cu'],
          },
          {
            label: '[M(H2O)6]Cl3 with 4 unpaired',
            template: '[M(H2O)6]Cl3',
            constraint: { type: 'unpaired', value: 4 },
            expected: ['Mn', 'Co'],
          },
          {
            label: 'K2[MF4] with half-filled e',
            template: 'K2[MF4]',
            constraint: { type: 'orbital_occupancy', value: 'half-filled e' },
            expected: ['Ti', 'Mn'],
          },
          {
            label: 'Na2[M(NH3)2(H2O)2(SCN)2] with μs = 5.92 BM',
            template: 'Na2[M(NH3)2(H2O)2(SCN)2]',
            constraint: { type: 'mu_s', value: 5.92 },
            expected: ['V'],
          },
          {
            label: '[M(en)3]F3 with LFSE = 2Δo − 2P',
            template: '[M(en)3]F3',
            constraint: 'LFSE = 2Δo − 2P',
            expected: ['Fe'],
          },
          {
            label: '[M(H2O)6]SO4 with LFSE = 0.4Δo',
            template: '[M(H2O)6]SO4',
            constraint: 'LFSE = 0.4Δo',
            expected: ['Fe'],
          },
        ];

        const results = cases.map((tc) => {
          const solved = solveInverseTemplate(tc.template, tc.constraint, testOpts);
          const actual = solved.validMetals;
          const passed = actual.length === tc.expected.length && actual.every((m, idx) => m === tc.expected[idx]);
          return {
            label: tc.label,
            template: tc.template,
            expected: tc.expected,
            actual,
            passed,
            pass: passed,
            textbookExceptionNote: solved.textbookExceptionNote || null,
          };
        });

        const coNH3 = analyzeComplex('[Co(NH3)6]3+', testOpts);
        const coNH3Passed = Boolean(
          coNH3 &&
          coNH3.spinState === 'low' &&
          coNH3.unpaired === 0 &&
          coNH3.lfseExpression === '2.4Δo − 2P'
        );
        const coNH3Result = {
          label: '[Co(NH3)6]3+ → low spin, 0 unpaired, LFSE 2.4Δo − 2P',
          template: '[Co(NH3)6]3+',
          expected: ['low', 0, '2.4Δo − 2P'],
          actual: coNH3 ? [coNH3.spinState, coNH3.unpaired, coNH3.lfseExpression] : [],
          passed: coNH3Passed,
          pass: coNH3Passed,
          textbookExceptionNote: null,
        };
        const allResults = [...results, coNH3Result];

        const allPassed = allResults.every((r) => r.passed);
        const summaryLine = allResults.map((r) =>
          r.template === '[Co(NH3)6]3+'
            ? `[Co(NH3)6]3+ → ${r.actual.join(', ')}`
            : `${r.label} → {${r.actual.join(', ')}}`
        ).join('; ');
        if (allPassed) {
          console.log(`[LF Self-Test] PASS: ${summaryLine}`);
        } else {
          console.error(`[LF Self-Test] FAIL: ${summaryLine}`, allResults);
        }
        return { passed: allPassed, allPassed, results: allResults, summary: summaryLine };
      }

      const selfTestResult = runSelfTest();

      return {
        DEFAULT_DATA,
        COUNTER_IONS,
        cloneDefaultData,
        romanNumeral,
        parseRomanOrInt,
        normalizeData,
        resolveData: normalizeData,
        resolveMetal,
        resolveLigand,
        resolveCounterIon,
        computeDn,
        weakestLigandClass,
        areAllLigandsStrong,
        inferGeometry,
        inferSpinState,
        dependsOnSpinState,
        computeOrbitalFilling,
        computeSpinOnlyMoment,
        muSpinOnlyToUnpaired,
        matchesOrbitalOccupancy,
        parseLfseExpression,
        formatLfseExpression,
        multiplyingPrefix,
        generateIUPACName,
        formatComplexFormula,
        parseComplexTemplate,
        analyzeComplex,
        normalizeConstraint,
        solveInverseTemplate,
        buildForwardQuestionNode,
        buildInverseQuestionNode,
        generateForwardQuestions,
        generateInverseQuestions,
        generateQuestionBank,
        composeMetalIdSet,
        runSelfTest,
        selfTestResult,
      };
    })();

    Scheduler.DEFAULT_SETTINGS.lfData = LF.cloneDefaultData();

    /* =====================================================================
       NAMESPACE 5: Evaluators — All 7 Declarative Grading Engines + Zero-Step Veto
       ===================================================================== */
    const Evaluators = (() => {
      function parseUserNumber(raw) {
        if (typeof raw === 'number') return raw;
        const cleaned = String(raw ?? '').trim().replace(/,/g, '');
        if (!cleaned) return NaN;
        // Allow simple fractions or numeric strings via Expr if safe
        if (/^[+-]?\d+(\.\d+)?([eE][+-]?\d+)?$/.test(cleaned)) return Number(cleaned);
        try {
          const val = Expr.evaluate(cleaned, {});
          return typeof val === 'number' && Number.isFinite(val) ? val : NaN;
        } catch (_) {
          return NaN;
        }
      }

      /* Show a number the way a marker would: to `sig` significant figures, plain or scientific, with its unit. */
      function formatExpected(x, sig, unit) {
        let t;
        if (Number.isFinite(sig)) {
          const e = x === 0 ? 0 : Math.floor(Math.log10(Math.abs(x)));
          t = (e < -3 || e > 5) ? x.toExponential(Math.max(0, sig - 1)).replace('e', ' × 10^').replace('^+', '^') : Number(x.toPrecision(sig)).toString();
        } else t = String(x);
        return unit ? `${t} ${unit}` : t;
      }

      /* Numeric answer. Pass when within an absolute tolerance and/or a relative one (relTol, a fraction).
         When it fails, say why if the value matches a known slip: wrong sign, off by a power of ten, or one of
         the listed wrong routes (evaluator.paths: [{label, expr}]). */
      function gradeNumeric(evaluator, userInput, scope = {}) {
        const target = Number(Expr.evaluate(evaluator.targetExpr, scope));
        const hasAbs = evaluator.tolerance !== undefined, hasRel = evaluator.relTol !== undefined;
        const tol = hasAbs || !hasRel ? Number(evaluator.tolerance ?? 0.01) : 0;
        const rel = hasRel ? Number(evaluator.relTol) : 0;
        const shown = formatExpected(target, evaluator.sig === undefined ? undefined : Number(evaluator.sig), evaluator.unit);
        const userNum = parseUserNumber(userInput);
        if (!Number.isFinite(userNum)) {
          return { normalizedGrade: 0, passed: false, feedback: 'Please enter a valid numerical value.', expectedDisplay: shown };
        }
        const near = (u, t, r) => Math.abs(u - t) <= Math.max(tol, Math.abs(t) * r) + 1e-12;
        const passed = near(userNum, target, rel);
        let note = '', noteCode = '';
        if (!passed) {
          const slack = Math.max(rel, 0.02);
          const paths = Array.isArray(evaluator.paths) ? evaluator.paths : [];
          for (const p of paths) {
            let v; try { v = Number(Expr.evaluate(p.expr, scope)); } catch (_) { continue; }
            if (Number.isFinite(v) && near(userNum, v, slack)) { note = p.label; noteCode = p.label; break; }
          }
          if (!note && target !== 0 && Math.abs(userNum + target) <= Math.max(tol, Math.abs(target) * slack)) { note = 'Right size but the wrong sign: check which way round the subtraction or the log goes.'; noteCode = 'sign'; }
          if (!note && target !== 0 && userNum !== 0 && userNum / target > 0) {
            const k = Math.round(Math.log10(userNum / target));
            if (k !== 0 && Math.abs(k) <= 9 && Math.abs(userNum / target / Math.pow(10, k) - 1) <= 0.02) { note = `Off by a factor of 10^${k}: check the units and prefixes (mM vs M, mg vs g, mV vs V).`; noteCode = 'power-of-ten'; }
          }
        }
        return {
          normalizedGrade: passed ? 1 : 0,
          passed,
          feedback: passed ? `Matches (${userNum}).` : `Entered ${userNum}; expected ${shown}.`,
          expectedDisplay: shown,
          ...(note ? { note, noteCode } : {}),
        };
      }

      /* A short word answer chosen from a few (reject/keep, same/different...). The expected key comes from an expression. */
      function gradeKeyword(spec, raw, scope = {}) {
        const expected = String(Expr.evaluate(spec.expectedExpr, scope));
        const syn = spec.synonyms || {};
        const norm = (t) => ` ${String(t ?? '').toLowerCase().replace(/[^a-z0-9+\-]+/g, ' ').trim()} `;
        const u = norm(raw);
        let best = null;
        for (const key of new Set([expected, ...Object.keys(syn)])) {
          for (const w of [key, ...(syn[key] || [])]) {
            const nw = norm(w);
            if (nw.trim() && u.includes(nw) && (!best || nw.length > best.len)) best = { key, len: nw.length };
          }
        }
        const passed = Boolean(best && best.key === expected);
        const display = spec.displays?.[expected] ?? expected;
        return { normalizedGrade: passed ? 1 : 0, passed, feedback: passed ? 'Correct.' : `Expected: ${display}.`, expectedDisplay: display };
      }

      function gradePattern(evaluator, userInput) {
        const raw = String(userInput ?? '').trim();
        const caseSensitive = evaluator.caseSensitive !== false;
        const flags = caseSensitive ? '' : 'i';
        for (const pat of (evaluator.acceptedPatterns || [])) {
          const re = new RegExp(pat, flags);
          if (re.test(raw)) {
            return { normalizedGrade: 1, passed: true, feedback: 'Accepted exact pattern match.', expectedDisplay: evaluator.expectedDisplay || pat };
          }
        }
        for (const pc of (evaluator.partialCreditMatches || [])) {
          const re = new RegExp(pc.pattern, flags);
          if (re.test(raw)) {
            const score = Math.max(0, Math.min(1, Number(pc.score ?? 0.5)));
            return { normalizedGrade: score, passed: score >= 0.7, feedback: `Partial credit (${Math.round(score * 100)}%): answer matches partial pattern.`, expectedDisplay: evaluator.expectedDisplay || evaluator.acceptedPatterns?.[0] || '' };
          }
        }
        return { normalizedGrade: 0, passed: false, feedback: 'Does not match expected format or answer.', expectedDisplay: evaluator.expectedDisplay || evaluator.acceptedPatterns?.[0] || '' };
      }

      function gradeSet(evaluator, userInput, scope = {}) {
        const caseSensitive = evaluator.caseSensitive !== false;
        const penalty = Number(evaluator.penaltyRatio ?? 0.5);
        const rawSymMap = evaluator.synonyms || {};
        const norm = (tok) => {
          const t = String(tok || '').trim();
          return caseSensitive ? t : t.toLowerCase();
        };
        const synMap = {};
        for (const [k, v] of Object.entries(rawSymMap)) synMap[norm(k)] = norm(v);

        const targetSet = new Set((evaluator.targetSet || []).map((x) => norm(x)));
        const isCompound = userInput && typeof userInput === 'object' && !Array.isArray(userInput);
        const rawTokensSource = isCompound
          ? (userInput.tokens ?? userInput.set ?? userInput.metals ?? [])
          : userInput;
        const userRaw = Array.isArray(rawTokensSource)
          ? rawTokensSource.flatMap((s) => String(s ?? '').split(/[\n,]+/)).map((s) => s.trim()).filter(Boolean)
          : String(rawTokensSource ?? '').split(/[\n,]+/).map((s) => s.trim()).filter(Boolean);
        const userSet = new Set(userRaw.map((x) => { const nx = norm(x); return synMap[nx] || nx; }));

        if (targetSet.size === 0) return { normalizedGrade: 1, passed: true, feedback: 'Empty target set.' };
        let hits = 0;
        let extras = 0;
        for (const u of userSet) {
          if (targetSet.has(u)) hits++;
          else extras++;
        }
        const grade = Math.max(0, (hits - penalty * extras) / targetSet.size);
        const metalSetGradeObj = {
          normalizedGrade: Number(grade.toFixed(4)),
          passed: grade >= 0.85,
          hits,
          extras,
          targetCount: targetSet.size,
          expectedDisplay: `{${(evaluator.targetSet || []).join(', ')}}`,
          feedback: `Matched ${hits}/${targetSet.size} metal(s)${extras > 0 ? ` (${extras} penalized)` : ''}.`,
        };

        if (isCompound && evaluator.fields && typeof evaluator.fields === 'object') {
          const fieldSource = (userInput.fields && typeof userInput.fields === 'object') ? userInput.fields : userInput;
          const fieldKeys = Object.keys(evaluator.fields);
          if (fieldKeys.length > 0) {
            const fieldResults = {};
            let fieldSum = 0;
            for (const fk of fieldKeys) {
              const spec = evaluator.fields[fk];
              const fVal = fieldSource[fk] ?? '';
              let fRes;
              if (spec.type === 'lfse_expr' || Array.isArray(spec.targetLfsePairs)) {
                const tol = Number(spec.tolerance ?? 0.01);
                const pairs = Array.isArray(spec.targetLfsePairs) && spec.targetLfsePairs.length
                  ? spec.targetLfsePairs
                  : (spec.targetValues || [Number(Expr.evaluate(spec.targetExpr ?? '0', scope))]).map((v) => ({ a: Number(v), b: 0 }));
                const parsedLfse = LF.parseLfseExpression(fVal);
                const uNum = parseUserNumber(fVal);
                const ok = pairs.some((pair) => {
                  const targetA = Number(pair.a ?? 0);
                  const targetB = Number(pair.b ?? 0);
                  if (Number.isFinite(parsedLfse.a)) {
                    const aMatch = Math.abs(parsedLfse.a - targetA) <= tol + 1e-12;
                    if (!aMatch) return false;
                    if (parsedLfse.hasExplicitP) {
                      return Math.abs(parsedLfse.b - targetB) <= tol + 1e-12;
                    }
                    // If user typed just a number or "aΔo", accept if b == 0 or if numeric-only entry matches a
                    return targetB === 0 || Number.isFinite(uNum);
                  }
                  return Number.isFinite(uNum) && Math.abs(uNum - targetA) <= tol + 1e-12;
                });
                const expDisp = spec.expectedDisplay || pairs.map((p) => LF.formatLfseExpression(p.a, p.b, p.unit || 'Δo')).join(' or ');
                fRes = {
                  normalizedGrade: ok ? 1 : 0,
                  passed: ok,
                  feedback: ok ? `Correct LFSE (${String(fVal).trim()}).` : `Expected ${expDisp}.`,
                  expectedDisplay: expDisp,
                };
              } else if (spec.type === 'numeric' || Array.isArray(spec.targetValues)) {
                const tol = Number(spec.tolerance ?? 0.01);
                const uNum = parseUserNumber(fVal);
                const allowed = Array.isArray(spec.targetValues) && spec.targetValues.length
                  ? spec.targetValues.map(Number)
                  : [Number(Expr.evaluate(spec.targetExpr ?? '0', scope))];
                const ok = Number.isFinite(uNum) && allowed.some((t) => Math.abs(uNum - t) <= tol + 1e-12);
                const expDisp = spec.expectedDisplay || allowed.join(' or ');
                fRes = {
                  normalizedGrade: ok ? 1 : 0,
                  passed: ok,
                  feedback: ok ? `Exact match (${uNum}).` : `Expected ${expDisp}.`,
                  expectedDisplay: expDisp,
                };
              } else {
                fRes = gradePattern(
                  {
                    acceptedPatterns: spec.acceptedPatterns || [],
                    caseSensitive: spec.caseSensitive !== false,
                    partialCreditMatches: spec.partialCreditMatches || [],
                    expectedDisplay: spec.expectedDisplay,
                  },
                  fVal
                );
              }
              fieldResults[fk] = fRes;
              fieldSum += fRes.normalizedGrade;
            }
            const combinedGrade = Number(((grade + fieldSum) / (1 + fieldKeys.length)).toFixed(4));
            const passedFields = Object.values(fieldResults).filter((r) => r.passed).length;
            const separateGrades = {
              metalSet: metalSetGradeObj,
              ...fieldResults,
            };
            const breakdownParts = [
              `Metal set: ${Math.round(metalSetGradeObj.normalizedGrade * 100)}% (${hits}/${targetSet.size})`,
              ...(fieldResults.name ? [`Name: ${Math.round(fieldResults.name.normalizedGrade * 100)}%`] : []),
              ...(fieldResults.lfse ? [`LFSE: ${Math.round(fieldResults.lfse.normalizedGrade * 100)}%`] : []),
            ];
            return {
              normalizedGrade: combinedGrade,
              passed: grade >= 0.85 && passedFields === fieldKeys.length,
              feedback: `${breakdownParts.join(' · ')}${evaluator.textbookExceptionNote ? ` — ${evaluator.textbookExceptionNote}` : ''}`,
              hits,
              extras,
              targetCount: targetSet.size,
              setGrade: Number(grade.toFixed(4)),
              fieldResults,
              separateGrades,
              textbookExceptionNote: evaluator.textbookExceptionNote || null,
            };
          }
        }

        return {
          normalizedGrade: Number(grade.toFixed(4)),
          passed: grade >= 0.85,
          feedback: `Matched ${hits}/${targetSet.size} expected items${extras > 0 ? ` with ${extras} incorrect item(s) penalized` : ''}${evaluator.textbookExceptionNote ? ` — ${evaluator.textbookExceptionNote}` : ''}.`,
          hits,
          extras,
          targetCount: targetSet.size,
          setGrade: Number(grade.toFixed(4)),
          separateGrades: { metalSet: metalSetGradeObj },
          textbookExceptionNote: evaluator.textbookExceptionNote || null,
        };
      }

      function gradeMappedFields(evaluator, userInput, scope = {}) {
        const targets = evaluator.targets || {};
        const keys = Object.keys(targets);
        if (!keys.length) return { normalizedGrade: 0, passed: false, feedback: 'No target fields configured.' };
        const inp = userInput && typeof userInput === 'object' ? userInput : {};
        let total = 0;
        const fieldResults = {};
        // the student's own numbers, so a later step can be marked "consistent with your earlier answer" (u_<key>)
        const sc = { ...scope };
        for (const k of keys) { const n = parseUserNumber(inp[k] ?? ''); if (Number.isFinite(n)) sc[`u_${k}`] = n; }
        for (const k of keys) {
          const spec = targets[k];
          const val = inp[k] ?? '';
          let res;
          if (spec.type === 'numeric') {
            res = gradeNumeric({ targetExpr: spec.targetExpr, tolerance: spec.tolerance, relTol: spec.relTol, sig: spec.sig, unit: spec.unit, paths: spec.paths }, val, sc);
            if (!res.passed && Array.isArray(spec.ecf)) {
              const u = parseUserNumber(val);
              for (const e of spec.ecf) {
                let v; try { v = Number(Expr.evaluate(e.expr, sc)); } catch (_) { continue; }
                if (Number.isFinite(v) && Number.isFinite(u) && Math.abs(u - v) <= Math.abs(v) * Math.max(spec.relTol ?? 0.01, 0.01) + 1e-12) {
                  res = { ...res, normalizedGrade: 0.5, note: e.label || 'Your method is right but it uses an earlier wrong value, so this is part credit.', noteCode: 'carried-forward' };
                  break;
                }
              }
            }
          } else if (spec.type === 'keyword') {
            res = gradeKeyword(spec, val, sc);
          } else if (spec.type === 'set_match') {
            res = gradeSet(spec, val, scope);
          } else {
            res = gradePattern({ acceptedPatterns: spec.acceptedPatterns || [], caseSensitive: spec.caseSensitive !== false, partialCreditMatches: spec.partialCreditMatches || [], expectedDisplay: spec.expectedDisplay }, val);
          }
          if (spec.expectedDisplay && spec.type !== 'keyword') res.expectedDisplay = spec.expectedDisplay;
          fieldResults[k] = res;
          total += res.normalizedGrade;
        }
        const grade = Number((total / keys.length).toFixed(4));
        const passedCount = Object.values(fieldResults).filter((r) => r.passed).length;
        return {
          normalizedGrade: grade,
          passed: grade >= 0.99,
          feedback: `${passedCount}/${keys.length} fields correct.`,
          fieldResults,
        };
      }

      function gradeChoice(evaluator, userInput) {
        const targetSet = new Set(evaluator.targetIds || []);
        const selected = new Set(Array.isArray(userInput) ? userInput : (userInput ? [userInput] : []));
        if (!targetSet.size) return { normalizedGrade: 0, passed: false, feedback: 'No target options configured.' };

        if (evaluator.gradingMode === 'exact' || targetSet.size === 1) {
          const exact = selected.size === targetSet.size && [...targetSet].every((id) => selected.has(id));
          return {
            normalizedGrade: exact ? 1 : 0,
            passed: exact,
            feedback: exact ? 'Correct choice selected.' : 'Incorrect selection.',
          };
        }

        let hits = 0, extras = 0;
        for (const id of selected) {
          if (targetSet.has(id)) hits++;
          else extras++;
        }
        const grade = Math.max(0, Math.min(1, (hits - 0.5 * extras) / targetSet.size));
        return {
          normalizedGrade: Number(grade.toFixed(4)),
          passed: grade >= 0.85,
          feedback: `Selected ${hits}/${targetSet.size} correct option(s)${extras ? `, ${extras} distractor(s) penalized` : ''}.`,
        };
      }

      function gradeWidgetState(evaluator, userInput) {
        if (evaluator.widgetType === 'orbital_energy_diagram') {
          const boxes = userInput?.boxes || {};
          // boxes: { t2g: [0|1|2, ...], eg: [0|1|2, ...] } or { e: [...], t2: [...] }
          const expectedLevels = evaluator.expectedLevels || {};
          let totalElectrons = 0;
          let unpaired = 0;
          let hundViolations = 0;
          const levelCounts = {};

          for (const [lvl, arr] of Object.entries(boxes)) {
            const list = Array.isArray(arr) ? arr : [];
            const sum = list.reduce((a, b) => a + b, 0);
            levelCounts[lvl] = sum;
            totalElectrons += sum;
            const singles = list.filter((x) => x === 1).length;
            const doubles = list.filter((x) => x === 2).length;
            const empties = list.filter((x) => x === 0).length;
            unpaired += singles;
            if (doubles > 0 && empties > 0) hundViolations++;
          }

          const expTotal = Number(evaluator.expectedElectrons ?? 0);
          if (totalElectrons !== expTotal) {
            return {
              normalizedGrade: 0,
              passed: false,
              feedback: `Placed ${totalElectrons} electron(s), but complex requires ${expTotal} d-electrons.`,
            };
          }
          const levelsMatch = Object.entries(expectedLevels).every(([k, v]) => levelCounts[k] === v);
          const unpairedMatch = evaluator.expectedUnpaired === undefined || unpaired === evaluator.expectedUnpaired;
          if (levelsMatch && unpairedMatch && hundViolations === 0) {
            return {
              normalizedGrade: 1,
              passed: true,
              feedback: `Correct orbital configuration (${Object.entries(levelCounts).map(([k, v]) => `${k}^${v}`).join(' ')}, ${unpaired} unpaired).`,
            };
          }
          if (levelsMatch && hundViolations > 0) {
            return {
              normalizedGrade: 0.5,
              passed: false,
              feedback: `Level counts match, but Hund's rule violated (electrons paired in ${Object.keys(boxes).join('/')} while degenerate orbitals remain empty).`,
            };
          }
          return {
            normalizedGrade: 0,
            passed: false,
            feedback: `Incorrect spin-state distribution: got ${Object.entries(levelCounts).map(([k, v]) => `${k}^${v}`).join(' ')}, expected ${Object.entries(expectedLevels).map(([k, v]) => `${k}^${v}`).join(' ')}.`,
          };
        }

        if (evaluator.widgetType === 'isomer_3d_canvas') {
          const geom = userInput?.geom || 'Oh';
          const labels = userInput?.labels || [];
          const edges = userInput?.edges || [];
          const G = IsomerEngine.GEOMS[geom];
          if (!G) return { normalizedGrade: 0, passed: false, feedback: 'Invalid geometry.' };
          if (labels.length !== G.n || labels.some((l) => !l)) {
            return { normalizedGrade: 0, passed: false, feedback: `Please assign ligands to all ${G.n} coordination sites.` };
          }
          const cfg = {
            labels: labels.slice(),
            edges: edges.map(([a, b]) => (a < b ? [a, b] : [b, a])),
          };
          const userCanon = IsomerEngine.canon(cfg, G.rots);
          const targetCanon = evaluator.targetCanonKey || IsomerEngine.isoById[evaluator.targetIsoId]?.key;
          if (!targetCanon) {
