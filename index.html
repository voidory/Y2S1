      #appRoot .seg > button { min-height: 34px; }

  <script type="module">
    /* =====================================================================
       NAMESPACE 1: Expr — Sandboxed Recursive-Descent Expression Compiler
       Strictly NO eval() or new Function().
       Supports: arithmetic (+,-,*,/,^,%), comparisons (<,<=,>,>=,==,!=),
       logical (&&,||,!), ternaries (cond ? a : b), math functions
       (sqrt,abs,sin,cos,tan,log,ln,exp,pow,min,max,floor,ceil,round,sigfig),
       and {{expr}} template interpolation.
       ===================================================================== */
    const Expr = (() => {
      const FUNCTIONS = {
        sqrt: (x) => Math.sqrt(x),
        abs: (x) => Math.abs(x),
        sin: (x) => Math.sin(x),
        cos: (x) => Math.cos(x),
        tan: (x) => Math.tan(x),
        log: (x) => Math.log10(x),
        ln: (x) => Math.log(x),
        exp: (x) => Math.exp(x),
        pow: (a, b) => Math.pow(a, b),
        min: (...args) => Math.min(...args),
        max: (...args) => Math.max(...args),
        floor: (x) => Math.floor(x),
        ceil: (x) => Math.ceil(x),
        round: (x, d = 0) => {
          const factor = Math.pow(10, Math.round(d));
          return Math.round((Number(x) + Number.EPSILON) * factor) / factor;
        },
        sigfig: (x, n = 3) => {
          const num = Number(x);
          if (!Number.isFinite(num) || num === 0) return 0;
          return Number(num.toPrecision(Math.max(1, Math.min(15, Math.round(n)))));
        },
        str: (x) => String(x),
        // statistics and display helpers for the analytical-chemistry questions
        nth: (k, ...a) => a.map(Number).sort((x, y) => x - y)[Math.round(k) - 1],
        sum: (...a) => a.reduce((t, x) => t + Number(x), 0),
        mean: (...a) => a.reduce((t, x) => t + Number(x), 0) / a.length,
        sd: (...a) => { const m = a.reduce((t, x) => t + Number(x), 0) / a.length; return Math.sqrt(a.reduce((t, x) => t + (Number(x) - m) ** 2, 0) / (a.length - 1)); },
        fix: (x, d = 2) => Number(x).toFixed(Math.max(0, Math.min(12, Math.round(d)))),
        sci: (x, d = 2) => {
          const n = Number(x);
          if (!Number.isFinite(n) || n === 0) return '0';
          let e = Math.floor(Math.log10(Math.abs(n)));
          let m = n / Math.pow(10, e);
          if (Math.abs(Number(m.toFixed(d))) >= 10) { m /= 10; e += 1; }
          return `${m.toFixed(d)}\\times10^{${e}}`;
        },
      };
      const CONSTANTS = { pi: Math.PI, PI: Math.PI, e: Math.E, E: Math.E, true: true, false: false };

      function tokenize(src) {
        const tokens = [];
        let i = 0;
        const len = src.length;
        while (i < len) {
          const ch = src[i];
          if (/\s/.test(ch)) { i++; continue; }
          if (ch === '"' || ch === "'") {
            const quote = ch; i++;
            let val = '';
            while (i < len && src[i] !== quote) {
              if (src[i] === '\\' && i + 1 < len) { val += src[i + 1]; i += 2; }
              else { val += src[i]; i++; }
            }
            if (src[i] !== quote) throw new Error('Unterminated string literal');
            i++;
            tokens.push({ type: 'STR', value: val });
            continue;
          }
          if (/[0-9]/.test(ch) || (ch === '.' && i + 1 < len && /[0-9]/.test(src[i + 1]))) {
            let numStr = '';
            while (i < len && /[0-9.]/.test(src[i])) { numStr += src[i]; i++; }
            if (i < len && (src[i] === 'e' || src[i] === 'E')) {
              numStr += src[i]; i++;
              if (i < len && (src[i] === '+' || src[i] === '-')) { numStr += src[i]; i++; }
              while (i < len && /[0-9]/.test(src[i])) { numStr += src[i]; i++; }
            }
            const num = Number(numStr);
            if (!Number.isFinite(num)) throw new Error('Invalid number: ' + numStr);
            tokens.push({ type: 'NUM', value: num });
            continue;
          }
          if (/[A-Za-z_]/.test(ch)) {
            let id = '';
            while (i < len && /[A-Za-z0-9_]/.test(src[i])) { id += src[i]; i++; }
            tokens.push({ type: 'ID', value: id });
            continue;
          }
          const two = src.slice(i, i + 2);
          if (['<=', '>=', '==', '!=', '&&', '||'].includes(two)) {
            tokens.push({ type: 'OP', value: two }); i += 2; continue;
          }
          if ('+-*/^%<>!?:(),'.includes(ch)) {
            tokens.push({ type: 'OP', value: ch }); i++; continue;
          }
          throw new Error('Unexpected character in expression: ' + ch);
        }
        tokens.push({ type: 'EOF', value: null });
        return tokens;
      }

      function evaluate(expression, scope = {}) {
        if (typeof expression === 'number' || typeof expression === 'boolean') return expression;
        const src = String(expression).trim();
        if (!src) return '';
        const tokens = tokenize(src);
        let pos = 0;
        const peek = () => tokens[pos];
        const consume = () => tokens[pos++];

        function parseTernary() {
          const cond = parseOr();
          if (peek().type === 'OP' && peek().value === '?') {
            consume();
            const tVal = parseTernary();
            if (peek().type !== 'OP' || peek().value !== ':') throw new Error('Expected : in ternary');
            consume();
            const fVal = parseTernary();
            return cond ? tVal : fVal;
          }
          return cond;
        }
        function parseOr() {
          let left = parseAnd();
          while (peek().type === 'OP' && peek().value === '||') {
            consume();
            const right = parseAnd();
            left = Boolean(left || right);
          }
          return left;
        }
        function parseAnd() {
          let left = parseEquality();
          while (peek().type === 'OP' && peek().value === '&&') {
            consume();
            const right = parseEquality();
            left = Boolean(left && right);
          }
          return left;
        }
        function parseEquality() {
          let left = parseComparison();
          while (peek().type === 'OP' && (peek().value === '==' || peek().value === '!=')) {
            const op = consume().value;
            const right = parseComparison();
            left = op === '==' ? left == right : left != right;
          }
          return left;
        }
        function parseComparison() {
          let left = parseAdditive();
          while (peek().type === 'OP' && ['<', '<=', '>', '>='].includes(peek().value)) {
            const op = consume().value;
            const right = parseAdditive();
            if (op === '<') left = left < right;
            else if (op === '<=') left = left <= right;
            else if (op === '>') left = left > right;
            else left = left >= right;
          }
          return left;
        }
        function parseAdditive() {
          let left = parseMultiplicative();
          while (peek().type === 'OP' && (peek().value === '+' || peek().value === '-')) {
            const op = consume().value;
            const right = parseMultiplicative();
            if (op === '+') left = (typeof left === 'string' || typeof right === 'string') ? String(left) + String(right) : Number(left) + Number(right);
            else left = Number(left) - Number(right);
          }
          return left;
        }
        function parseMultiplicative() {
          let left = parseUnary();
          while (peek().type === 'OP' && (peek().value === '*' || peek().value === '/' || peek().value === '%')) {
            const op = consume().value;
            const right = parseUnary();
            if (op === '*') left = Number(left) * Number(right);
            else if (op === '/') left = Number(left) / Number(right);
            else left = Number(left) % Number(right);
          }
          return left;
        }
        function parseUnary() {
          if (peek().type === 'OP' && (peek().value === '-' || peek().value === '+' || peek().value === '!')) {
            const op = consume().value;
            const val = parseUnary();
            if (op === '-') return -Number(val);
            if (op === '+') return +Number(val);
            return !val;
          }
          return parsePower();
        }
        function parsePower() {
          const base = parsePrimary();
          if (peek().type === 'OP' && peek().value === '^') {
            consume();
            const exp = parseUnary();
            return Math.pow(Number(base), Number(exp));
          }
          return base;
        }
        function parsePrimary() {
          const tok = peek();
          if (tok.type === 'NUM' || tok.type === 'STR') { consume(); return tok.value; }
          if (tok.type === 'OP' && tok.value === '(') {
            consume();
            const val = parseTernary();
            if (peek().type !== 'OP' || peek().value !== ')') throw new Error('Expected closing parenthesis');
            consume();
            return val;
          }
          if (tok.type === 'ID') {
            consume();
            const name = tok.value;
            if (peek().type === 'OP' && peek().value === '(') {
              consume();
              const args = [];
              if (!(peek().type === 'OP' && peek().value === ')')) {
                args.push(parseTernary());
                while (peek().type === 'OP' && peek().value === ',') {
                  consume();
                  args.push(parseTernary());
                }
              }
              if (peek().type !== 'OP' || peek().value !== ')') throw new Error('Expected ) after function call');
              consume();
              if (!Object.prototype.hasOwnProperty.call(FUNCTIONS, name)) {
                throw new Error('Unknown or disallowed function: ' + name);
              }
              return FUNCTIONS[name](...args);
            }
            if (Object.prototype.hasOwnProperty.call(scope, name)) return scope[name];
            if (Object.prototype.hasOwnProperty.call(CONSTANTS, name)) return CONSTANTS[name];
            throw new Error('Unknown identifier: ' + name);
          }
          throw new Error('Unexpected token in expression');
        }

        const result = parseTernary();
        if (peek().type !== 'EOF') throw new Error('Unexpected trailing token');
        return result;
      }

      function interpolate(text, scope = {}) {
        if (typeof text !== 'string') return '';
        return text.replace(/\{\{([^}]+)\}\}/g, (_, expr) => {
          try {
            const val = evaluate(expr.trim(), scope);
            return val === undefined || val === null ? '' : String(val);
          } catch (e) {
            return `{{${expr}}}`;
          }
        });
      }

      return { evaluate, interpolate, FUNCTIONS };
    })();

    /* =====================================================================
       NAMESPACE 2: DB — IndexedDB Persistence (Dexie.js) & Validator
       ===================================================================== */
    const DB = (() => {
      const VALID_SLOTS = new Set(['typed_short', 'unordered_set', 'mapped_fields', 'typed_synthesis', 'choice', 'interactive_widget', 'ordered_list', 'typed_equation']);
      const VALID_EVALS = new Set(['numeric_match', 'pattern_match', 'set_match', 'mapped_fields_match', 'widget_state_match', 'choice_match', 'atomic_rubric', 'order_match', 'isomer_set_match', 'name_match', 'equation_match']);
      let dexieInstance = null;

      function validateQuestionNodeV3(node) {
        const errors = [];
        if (!node || typeof node !== 'object') return { valid: false, errors: ['Node must be an object'] };
        if (node.schemaVersion !== '3.0') errors.push('schemaVersion must be "3.0"');
        if (!node.id || typeof node.id !== 'string') errors.push('Missing string id');
        if (!node.moduleCode || typeof node.moduleCode !== 'string') errors.push('Missing string moduleCode');
        if (node.tier !== 'atomic' && node.tier !== 'synthesis') errors.push('tier must be "atomic" or "synthesis"');
        if (!node.metadata || typeof node.metadata !== 'object') {
          errors.push('Missing metadata object');
        } else {
          if (!node.metadata.title) errors.push('metadata.title required');
          if (!Number.isFinite(node.metadata.week)) errors.push('metadata.week must be numeric');
          if (!node.metadata.primaryTheme) errors.push('metadata.primaryTheme required');
          if (!Array.isArray(node.metadata.conceptTags)) errors.push('metadata.conceptTags must be array');
        }
        if (!Array.isArray(node.variants) || node.variants.length === 0) {
          errors.push('variants must be a non-empty array');
        } else {
          node.variants.forEach((v, idx) => {
            if (!v.variantId) errors.push(`variants[${idx}].variantId missing`);
            if (!v.stem) errors.push(`variants[${idx}].stem missing`);
            if (!v.inputSlot || !VALID_SLOTS.has(v.inputSlot.type)) errors.push(`variants[${idx}].inputSlot.type invalid`);
            if (!v.evaluator || !VALID_EVALS.has(v.evaluator.type)) errors.push(`variants[${idx}].evaluator.type invalid`);
            if (v.inputSlot?.type === 'typed_short' && !v.inputSlot.formatHint) {
              errors.push(`variants[${idx}].inputSlot.formatHint is required for typed_short`);
            }
            if (v.inputSlot?.type === 'ordered_list' && (!Array.isArray(v.inputSlot.items) || v.inputSlot.items.length < 2)) {
              errors.push(`variants[${idx}].inputSlot.items must have at least 2 items for ordered_list`);
            }
            if (v.evaluator?.type === 'atomic_rubric' && (!Array.isArray(v.evaluator.rubric) || v.evaluator.rubric.length === 0)) {
              errors.push(`variants[${idx}].evaluator.rubric must be non-empty for atomic_rubric`);
            }
          });
        }
        return { valid: errors.length === 0, errors };
      }

      async function getDexieConstructor() {
        if (window.__DexieLib) return window.__DexieLib;
        if (window.Dexie) return window.Dexie;
        try {
          const mod = await import(/* @vite-ignore */ 'https://unpkg.com/dexie@4.0.10/dist/dexie.mjs');
          window.__DexieLib = mod.default || mod.Dexie || mod;
          return window.__DexieLib;
        } catch (err) {
          await new Promise((resolve) => {
            const timer = setTimeout(resolve, 1800);
            window.addEventListener('dexie-ready', () => { clearTimeout(timer); resolve(); }, { once: true });
          });
          if (window.__DexieLib) return window.__DexieLib;
          throw new Error('Failed to load Dexie.js IndexedDB engine: ' + err.message);
        }
      }

      async function init() {
        if (dexieInstance) return dexieInstance;
        const DexieCtor = await getDexieConstructor();
        const db = new DexieCtor('UnifiedMasteryEngineDB_v3');
        db.version(1).stores({
          modules: 'moduleCode, title, examTimestamp',
          questionNodes: 'id, moduleCode, tier, metadata.week, metadata.primaryTheme, *metadata.conceptTags',
          reviewStates: 'nodeId, moduleCode, dueMs',
          attemptLogs: 'id, nodeId, variantId, timestamp',
          settings: 'key',
        });
        await db.open();
        dexieInstance = db;
        return db;
      }

      async function exportBundle() {
        const db = await init();
        const [modules, questionNodes, reviewStates, attemptLogs, settings] = await Promise.all([
          db.modules.toArray(),
          db.questionNodes.toArray(),
          db.reviewStates.toArray(),
          db.attemptLogs.toArray(),
          db.settings.toArray(),
        ]);
        return {
          bundleVersion: '3.0',
          exportedAt: new Date().toISOString(),
          modules,
          questionNodes,
          reviewStates,
          attemptLogs,
          settings,
        };
      }

      async function importBundle(bundle, mode = 'merge') {
        if (!bundle || typeof bundle !== 'object') throw new Error('Invalid bundle JSON');
        const db = await init();
        const stats = { modules: 0, questionNodes: 0, reviewStates: 0, attemptLogs: 0, rejectedNodes: 0 };

        if (mode === 'overwrite') {
          await db.transaction('rw', db.modules, db.questionNodes, db.reviewStates, db.attemptLogs, db.settings, async () => {
            await Promise.all([db.modules.clear(), db.questionNodes.clear(), db.reviewStates.clear(), db.attemptLogs.clear()]);
            if (Array.isArray(bundle.modules) && bundle.modules.length) {
              await db.modules.bulkPut(bundle.modules);
              stats.modules = bundle.modules.length;
            }
            if (Array.isArray(bundle.questionNodes)) {
              const valid = [];
              for (const n of bundle.questionNodes) {
                if (validateQuestionNodeV3(n).valid) valid.push(n);
                else stats.rejectedNodes++;
              }
              if (valid.length) await db.questionNodes.bulkPut(valid);
              stats.questionNodes = valid.length;
            }
            if (Array.isArray(bundle.reviewStates) && bundle.reviewStates.length) {
              await db.reviewStates.bulkPut(bundle.reviewStates);
              stats.reviewStates = bundle.reviewStates.length;
            }
            if (Array.isArray(bundle.attemptLogs) && bundle.attemptLogs.length) {
              await db.attemptLogs.bulkPut(bundle.attemptLogs);
              stats.attemptLogs = bundle.attemptLogs.length;
            }
            if (Array.isArray(bundle.settings) && bundle.settings.length) {
              await db.settings.bulkPut(bundle.settings);
            }
          });
          return stats;
        }

        // merge or skip
        const isSkip = mode === 'skip';
        await db.transaction('rw', db.modules, db.questionNodes, db.reviewStates, db.attemptLogs, db.settings, async () => {
          if (Array.isArray(bundle.modules)) {
            for (const m of bundle.modules) {
              if (!m.moduleCode) continue;
              const existing = await db.modules.get(m.moduleCode);
              if (existing && isSkip) continue;
              await db.modules.put(m);
              stats.modules++;
            }
          }
          if (Array.isArray(bundle.questionNodes)) {
            for (const n of bundle.questionNodes) {
              if (!validateQuestionNodeV3(n).valid) { stats.rejectedNodes++; continue; }
              const existing = await db.questionNodes.get(n.id);
              if (existing && isSkip) continue;
              await db.questionNodes.put(n);
              stats.questionNodes++;
            }
          }
          if (Array.isArray(bundle.reviewStates)) {
            for (const r of bundle.reviewStates) {
              if (!r.nodeId) continue;
              const existing = await db.reviewStates.get(r.nodeId);
              if (existing && isSkip) continue;
              if (existing && mode === 'merge') {
                const chosen = (r.lastReviewMs || 0) >= (existing.lastReviewMs || 0) ? r : existing;
                const mergedStats = { ...(existing.variantStats || {}), ...(r.variantStats || {}) };
                await db.reviewStates.put({ ...chosen, variantStats: mergedStats });
              } else {
                await db.reviewStates.put(r);
              }
              stats.reviewStates++;
            }
          }
          if (Array.isArray(bundle.attemptLogs)) {
            for (const log of bundle.attemptLogs) {
              if (!log.id) continue;
              const existing = await db.attemptLogs.get(log.id);
              if (existing && isSkip) continue;
              await db.attemptLogs.put(log);
              stats.attemptLogs++;
            }
          }
          if (Array.isArray(bundle.settings)) {
            for (const s of bundle.settings) {
              if (!s.key) continue;
              const existing = await db.settings.get(s.key);
              if (existing && isSkip) continue;
              await db.settings.put(s);
            }
          }
        });
        return stats;
      }

      return { init, validateQuestionNodeV3, exportBundle, importBundle };
    })();

    /* =====================================================================
       NAMESPACE 3: Scheduler — FSRS-Inspired Memory Dynamics, Finals Countdown,
       Fault-Isolation Boosting & Anti-Rote Variant/Variable Sampling
       ===================================================================== */
    const Scheduler = (() => {
      const DAY_MS = 86400000;
      const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));

      const DEFAULT_SETTINGS = {
        key: 'global',
        contentVersion: null,
        fsrs: { requestRetention: 0.90, maxIntervalDays: 90, initialStabilityDays: 1.5 },
        includeGoldenBankInQueue: true,
        allocByMarks: true,
        pTermMode: 'relative',
        includeD0D10InDiamagnetic: false,
        textbookExceptions: false,
        lfData: null,
        mockPaper: {
          defaultDurationMinutes: 30,
          defaultQuestionCount: 8,
          proportions: {
            mcq_1mark: 0.25,
            short_2to3: 0.50,
            construct_4to6: 0.25,
          },
        },
        llm: { enabled: false, endpoint: 'http://localhost:11434/api/generate', model: 'llama3.1', apiKey: '' },
      };

      function retrievability(S, elapsedDays) {
        const s = Math.max(0.1, S || 1);
        const t = Math.max(0, elapsedDays || 0);
        return Math.pow(1 + (19 / 81) * (t / s), -0.5);
      }

      function nextIntervalDays(S, targetRetention = 0.90, maxDays = 90) {
        const r = clamp(targetRetention, 0.70, 0.98);
        const factor = (81 / 19) * (Math.pow(r, -2) - 1);
        return clamp(S * factor, 0.25, maxDays);
      }

      function updateReviewState(prevState, node, variantId, normalizedGrade, nowMs = Date.now(), settings = DEFAULT_SETTINGS, mod = null) {
        const fsrs = settings?.fsrs || DEFAULT_SETTINGS.fsrs;
        const examTs = mod?.examTimestamp ?? null;
        const rawMaxDays = Number(fsrs.maxIntervalDays) || 90;
        const effectiveMaxDays = (examTs !== null && examTs !== undefined && Number.isFinite(Number(examTs)))
          ? Math.max(0.25, Math.min(rawMaxDays, (Number(examTs) - nowMs) / DAY_MS))
          : rawMaxDays;

        const g = clamp(Number(normalizedGrade) || 0, 0, 1);
        const seedDiff = clamp(Number(node?.metadata?.difficultyEstimate ?? 5.0), 1, 10);
        const base = prevState || {
          nodeId: node.id,
          moduleCode: node.moduleCode,
          S: fsrs.initialStabilityDays || 1.5,
          D: seedDiff,
          reps: 0,
          lapses: 0,
          lastReviewMs: 0,
          dueMs: nowMs,
          variantStats: {},
        };

        const elapsedDays = base.lastReviewMs > 0 ? Math.max(0.01, (nowMs - base.lastReviewMs) / DAY_MS) : 0;
        const R = base.reps > 0 ? retrievability(base.S, elapsedDays) : 0.85;

        // Grade to FSRS continuous rating (1..4 equivalent)
        const rating = g >= 0.90 ? 4 : g >= 0.70 ? 3 : g >= 0.45 ? 2 : 1;
        let newD = clamp(base.D - 0.55 * (rating - 3) + 0.08 * (5.0 - base.D), 1.0, 10.0);
        let newS;
        let newLapses = base.lapses || 0;

        if (g < 0.45) {
          // Lapse or Zero-Step Veto
          newLapses += 1;
          newS = Math.max(0.35, base.S * 0.35 * Math.pow(Math.max(0.2, g + 0.2), 0.4));
        } else if (base.reps === 0) {
          newS = rating === 4 ? 3.5 : rating === 3 ? 1.8 : 0.8;
        } else {
          const hardPenalty = rating === 2 ? 0.72 : 1.0;
          const easyBonus = rating === 4 ? 1.32 : 1.0;
          const gain = Math.exp(1.15) * (11 - newD) * Math.pow(base.S, -0.22) * (Math.exp(0.95 * (1 - R)) - 1) * hardPenalty * easyBonus;
          newS = clamp(base.S * (1 + Math.max(0.05, gain)), 0.35, rawMaxDays);
        }

        const intervalDays = g < 0.45 ? 0.25 : nextIntervalDays(newS, fsrs.requestRetention || 0.90, effectiveMaxDays);
        const prevVar = base.variantStats?.[variantId] || { attempts: 0, meanGrade: g, lastSeenMs: 0 };
        const attempts = prevVar.attempts + 1;
        const meanGrade = ((prevVar.meanGrade * prevVar.attempts) + g) / attempts;

        return {
          nodeId: node.id,
          moduleCode: node.moduleCode,
          S: Number(newS.toFixed(4)),
          D: Number(newD.toFixed(3)),
          reps: (base.reps || 0) + 1,
          lapses: newLapses,
          lastReviewMs: nowMs,
          dueMs: Math.round(nowMs + intervalDays * DAY_MS),
          variantStats: {
            ...(base.variantStats || {}),
            [variantId]: { attempts, meanGrade: Number(meanGrade.toFixed(4)), lastSeenMs: nowMs },
          },
        };
      }

      function computeFaultSkillMap(attemptLogs = [], nowMs = Date.now()) {
        // Recent missed skill tags decay with a 10-day half-life
        const faultScores = {};
        for (const log of attemptLogs) {
          if (!Array.isArray(log.missedSkillTags) || !log.missedSkillTags.length) continue;
          const ageDays = Math.max(0, (nowMs - (log.timestamp || nowMs)) / DAY_MS);
          const decay = Math.pow(0.5, ageDays / 10);
          const severity = log.normalizedGrade < 0.45 ? 1.5 : 1.0;
          for (const tag of log.missedSkillTags) {
            faultScores[tag] = (faultScores[tag] || 0) + decay * severity;
          }
        }
        return faultScores;
      }

      function priorityScore(node, reviewState, moduleMap, faultSkillMap, nowMs = Date.now()) {
        const mod = moduleMap?.[node.moduleCode];
        const hasExam = mod && mod.examTimestamp !== null && mod.examTimestamp !== undefined;
        const daysToExam = hasExam ? Math.max(0.5, (mod.examTimestamp - nowMs) / DAY_MS) : null;
        const urgency = hasExam ? clamp(18 / daysToExam, 0.6, 4.0) : 1;
        const weekInfo = mod?.weeks?.find((w) => w.weekNum === node.metadata?.week);
        const weekWeight = weekInfo?.examWeight ?? 1.0;
        const goldenScale = node.metadata?.isGoldenBank ? 0.5 : 1.0;

        // Fault isolation boost: if atomic node's conceptTags match recent missedSkillTags
        let faultBoost = 0;
        if (node.tier === 'atomic' && Array.isArray(node.metadata?.conceptTags)) {
          for (const tag of node.metadata.conceptTags) {
            if (faultSkillMap[tag]) faultBoost += Math.min(4.0, faultSkillMap[tag] * 1.4);
          }
        }

        if (!reviewState) {
          // New unseen node
          const tierBase = node.tier === 'atomic' ? 1.4 : 1.1;
          return {
            score: (tierBase + faultBoost) * weekWeight * urgency * 0.75 * goldenScale,
            bucket: faultBoost > 0.5 ? 'weakAtomic' : 'newMaterial',
            retrievability: 0,
            overdueDays: 0,
            faultBoost,
          };
        }

        const elapsed = Math.max(0, (nowMs - (reviewState.lastReviewMs || nowMs)) / DAY_MS);
        const R = retrievability(reviewState.S, elapsed);
        const overdueDays = (nowMs - (reviewState.dueMs || nowMs)) / DAY_MS;
        const isDue = overdueDays >= 0;
        const dueWeight = isDue ? (1.5 + clamp(overdueDays, 0, 14) * 0.25) : clamp((1 - R) * 1.4, 0.05, 1.1);
        const lapseFactor = 1 + (reviewState.lapses || 0) * 0.3;

        let bucket = isDue ? 'dueReviews' : 'newMaterial';
        if (faultBoost > 0.4 || (node.tier === 'atomic' && (reviewState.lapses > 0 || R < 0.75))) {
          bucket = 'weakAtomic';
        }

        const score = (dueWeight * lapseFactor + faultBoost) * weekWeight * urgency * goldenScale;
        return { score, bucket, retrievability: R, overdueDays, faultBoost };
      }

      let _lastServedFamily = null;
      let _lastServedNodeId = null;

      function resolvePreviousFamily(nodes, attemptLogs = [], filters = {}) {
        if (filters.lastFamily !== undefined) return filters.lastFamily || null;
        if (filters.excludeFamily !== undefined) return filters.excludeFamily || null;
        if (filters.excludeNodeId) {
          const prev = nodes.find((n) => n.id === filters.excludeNodeId);
          if (prev?.metadata?.family) return prev.metadata.family;
        }
        if (Array.isArray(attemptLogs) && attemptLogs.length > 0) {
          let latestLog = attemptLogs[0];
          for (const log of attemptLogs) {
            if ((log.timestamp || 0) >= (latestLog.timestamp || 0)) latestLog = log;
          }
          if (latestLog?.nodeId) {
            const prev = nodes.find((n) => n.id === latestLog.nodeId);
            if (prev?.metadata?.family) return prev.metadata.family;
          }
        }
        if (_lastServedFamily && nodes.some((n) => n.id === _lastServedNodeId)) {
          return _lastServedFamily;
        }
        return null;
      }

      /* Pure. Attention follows marks AND your level. Two parts, both a multiplier per node:
         probe: a topic with fewer than `probeN` questions tried (and some left) is lifted in proportion to its marks, so a few cards
                in every topic come first and the queue learns your level across the whole syllabus instead of walking it in order;
         focus: the target share of cards is marks x (1 - level), level = your latest grades shrunk toward a prior (your own rating of
                the topic, else 0.5), so a topic you have shown you know fades after two or three cards and a weak one keeps its share.
         Actual share = the last `window` cards (smoothed). Clamped so it nudges, never dictates. */
      function allocationMultipliers(nodes, map, logs, opts = {}) {
        const out = new Map();
        if (!map?.skills?.length) return out;
        const win = opts.window ?? 150, power = opts.power ?? 0.6, probeN = opts.probeN ?? 3, K0 = 2;
        const ratings = opts.ratings || {}, mod = opts.moduleCode || '';
        const skillById = Object.fromEntries(map.skills.map((k) => [k.id, k]));
        const chunkOf = (id) => {
          let best = null;
          for (const sid of map.nodeSkills?.[id] || []) { const k = skillById[sid]; if (k && (!best || k.weight > best.weight)) best = k; }
          return best?.chunk || null;
        };
        const marks = {};
        let tot = 0;
        for (const k of map.skills) { if (!k.chunk) continue; marks[k.chunk] = (marks[k.chunk] || 0) + (k.weight || 0); tot += k.weight || 0; }
        if (tot <= 0) return out;
        const ids = new Set(nodes.map((n) => n.id));
        const mine = [...(logs || [])].filter((l) => ids.has(l.nodeId)).sort((a, b) => a.timestamp - b.timestamp);
        const latest = {};
        for (const l of mine) latest[l.nodeId] = Number.isFinite(Number(l.normalizedGrade)) && l.normalizedGrade != null ? Number(l.normalizedGrade) : 0.5;
        const tried = {}, sum = {}, size = {};
        for (const n of nodes) { const c = chunkOf(n.id); if (c) size[c] = (size[c] || 0) + 1; }
        for (const [id, g] of Object.entries(latest)) { const c = chunkOf(id); if (c) { tried[c] = (tried[c] || 0) + 1; sum[c] = (sum[c] || 0) + g; } }
        const need = {};
        let needTot = 0;
        for (const c of Object.keys(marks)) {
          const prior = PRIOR[ratings[`${mod}:${c}`] ?? -1] ?? 0.5;
          const level = ((sum[c] || 0) + K0 * (prior || 0.5)) / ((tried[c] || 0) + K0);
          need[c] = marks[c] * Math.max(0.2, 1 - level);
          needTot += need[c];
        }
        if (needTot <= 0) return out;
        const recent = mine.slice().reverse().slice(0, win);
        const served = {};
        for (const l of recent) { const c = chunkOf(l.nodeId); if (c) served[c] = (served[c] || 0) + 1; }
        const nChunks = Object.keys(marks).length;
        for (const n of nodes) {
          const c = chunkOf(n.id);
          if (!c || !marks[c]) continue;
          const t = need[c] / needTot;
          const a = ((served[c] || 0) + 1) / (recent.length + 12);
          let m = Math.pow(t / a, power);
          const t0 = tried[c] || 0;
          if (t0 < probeN && t0 < (size[c] || 0) && latest[n.id] === undefined) m *= 1 + (probeN - t0) * 0.8 * Math.min(1, (marks[c] / tot) * nChunks);
          out.set(n.id, clamp(m, 0.35, 6));
        }
        return out;
      }

      /* Pure. Per topic (chunk) of one module: marks at stake, how well you do now, and the marks recoverable per hour of work.
         Your latest grade per question counts; an untried question counts as your own rating of the topic (0 never seen, 1 shaky, 2 ok, 3 solid). */
      const PRIOR = [0, 0.4, 0.7, 0.9];
      function planChunks(nodes, map, logs, ratings = {}, moduleCode = '') {
        if (!map?.skills?.length) return [];
        const skillById = Object.fromEntries(map.skills.map((k) => [k.id, k]));
        const chunkOf = (id) => {
          let best = null;
          for (const sid of map.nodeSkills?.[id] || []) { const k = skillById[sid]; if (k && (!best || k.weight > best.weight)) best = k; }
          return best?.chunk || null;
        };
        const latest = {};
        for (const l of [...(logs || [])].sort((a, b) => a.timestamp - b.timestamp)) latest[l.nodeId] = Number(l.normalizedGrade) || 0;
        const marks = {};
        for (const k of map.skills) if (k.chunk) marks[k.chunk] = (marks[k.chunk] || 0) + (k.weight || 0) * 100;
        const rows = {};
        for (const n of nodes) {
          const c = chunkOf(n.id);
          if (!c) continue;
          const r = (rows[c] ||= { chunk: c, marks: marks[c] || 0, n: 0, tried: 0, sum: 0, minutes: 0, needed: 0 });
          const prior = PRIOR[ratings[`${moduleCode}:${c}`] ?? 0] ?? 0;
          const g = latest[n.id] !== undefined ? latest[n.id] : prior;
          r.n += 1; r.sum += g; if (latest[n.id] !== undefined) r.tried += 1;
          if (g < 0.7) { r.minutes += Number(n.metadata?.estimatedMinutes) || 3; r.needed += 1; }
        }
        const names = Object.fromEntries((map.chunks || []).map((c) => [c.id, c]));
        return Object.values(rows).map((r) => {
          const score = r.n ? r.sum / r.n : 0;
          const recoverable = r.marks * Math.max(0, 0.85 - score);
          return { ...r, name: names[r.chunk]?.name || r.chunk, part: names[r.chunk]?.part || '', score, recoverable, perHour: r.minutes > 0 ? recoverable / (r.minutes / 60) : 0 };
        }).sort((a, b) => b.perHour - a.perHour);
      }

      /* Pure. Today's blocks: `hours` of work cut into blocks, shared between modules by `shares`, each block on the module's best remaining topic. */
      function planBlocks(rowsByModule, hours, shares, blockMin = 40) {
        const total = Math.max(1, Math.round((hours * 60) / blockMin));
        const codes = Object.keys(rowsByModule);
        const sumShare = codes.reduce((a, c) => a + (shares[c] ?? 1 / codes.length), 0) || 1;
        const want = {};
        let given = 0;
        for (const c of codes) { want[c] = Math.round(total * ((shares[c] ?? 1 / codes.length) / sumShare)); given += want[c]; }
        while (given < total) { const c = codes.slice().sort((a, b) => (shares[b] ?? 0) - (shares[a] ?? 0))[0]; want[c] += 1; given += 1; }
        while (given > total) { const c = codes.slice().sort((a, b) => want[b] - want[a])[0]; want[c] -= 1; given -= 1; }
        const queues = {};
        for (const c of codes) queues[c] = rowsByModule[c].filter((r) => r.perHour > 0).slice(0, 4);
        const out = [];
        const idx = Object.fromEntries(codes.map((c) => [c, 0]));
        const left = { ...want };
        while (out.length < total) {
          let any = false;
          for (const c of codes) {
            if (left[c] <= 0 || !queues[c].length) continue;
            const r = queues[c][idx[c] % queues[c].length]; idx[c] += 1; left[c] -= 1; any = true;
            const per = r.needed ? r.minutes / r.needed : 3;
            out.push({ module: c, chunk: r.chunk, name: r.name, minutes: blockMin, cards: Math.max(1, Math.round(blockMin / Math.max(1, per))), marks: r.marks, score: r.score, perHour: r.perHour });
          }
          if (!any) break;
        }
        return out;
      }

      function selectNextNode(nodes, reviewMap, moduleMap, attemptLogs, settings = DEFAULT_SETTINGS, filters = {}, nowMs = Date.now()) {
        const faultMap = computeFaultSkillMap(attemptLogs, nowMs);
        const includeGolden = (settings?.includeGoldenBankInQueue ?? true) || Boolean(filters.includeGolden);
        const prevFamily = resolvePreviousFamily(nodes, attemptLogs, filters);

        let pool = nodes.filter((n) => {
          if (filters.moduleCode && filters.moduleCode !== 'ALL' && n.moduleCode !== filters.moduleCode) return false;
          if (filters.tier && filters.tier !== 'ALL' && n.tier !== filters.tier) return false;
          if (filters.skillTag && !(n.metadata?.conceptTags || []).includes(filters.skillTag)) return false;
          if (filters.chunkNodeIds && !filters.chunkNodeIds.includes(n.id)) return false;
          if (filters.masteryAdj?.exclude.has(n.id) && !filters.forceNodeId) return false;
          if (n.metadata?.composerOnly && !filters.forceNodeId) return false;
          if (filters.excludeNodeId && n.id === filters.excludeNodeId && nodes.length > 1) return false;
          if (!includeGolden && !filters.forceNodeId && n.metadata?.isGoldenBank && !reviewMap[n.id]) return false;
          return true;
        });

        if (!pool.length) {
          const filtered = (filters.moduleCode && filters.moduleCode !== 'ALL') || (filters.tier && filters.tier !== 'ALL') || filters.skillTag
            || filters.chunkNodeIds || (filters.masteryAdj && filters.masteryAdj.exclude.size > 0);
          if (filtered) return { node: null, meta: null, queuePreview: [] }; // the "No matching questions" screen explains it
          pool = nodes.slice(0, 20);
        }

        // Never serve two nodes of the same metadata.family back to back (when an alternative exists)
        if (prevFamily && !filters.forceNodeId) {
          const nonSameFamily = pool.filter((n) => !n.metadata?.family || n.metadata.family !== prevFamily);
          if (nonSameFamily.length > 0) {
            pool = nonSameFamily;
          }
        }

        const scored = pool.map((node) => {
          const meta = priorityScore(node, reviewMap[node.id], moduleMap, faultMap, nowMs);
          const m = filters.masteryAdj?.mult.get(node.id);
          if (m != null) { meta.score *= m; meta.masteryMult = m; } // retired skill: rarely comes up
          const am = filters.allocMult?.get(node.id);
          if (am != null) { meta.score *= am; meta.allocMult = am; }
          if (!reviewMap[node.id]) { let h = 0; for (const ch of String(node.id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; meta.score *= 1 + 0.06 * ((h % 1000) / 1000); } // unseen questions: scramble ties so the order is not the chapter order
          return { node, meta };
        }).sort((a, b) => b.meta.score - a.meta.score);

        if (filters.forceNodeId) {
          const forced = nodes.find((n) => n.id === filters.forceNodeId);
          if (forced) {
            const meta = priorityScore(forced, reviewMap[forced.id], moduleMap, faultMap, nowMs);
            _lastServedFamily = forced.metadata?.family || null;
            _lastServedNodeId = forced.id;
            return { node: forced, meta, queuePreview: scored.slice(0, 8) };
          }
        }

        const chosen = scored[0]?.node || null;
        _lastServedFamily = chosen?.metadata?.family || null;
        _lastServedNodeId = chosen?.id || null;

        return {
          node: chosen,
          meta: scored[0]?.meta || null,
          queuePreview: scored.slice(0, 8),
        };
      }

      function selectVariant(node, reviewState) {
        const variants = node?.variants || [];
        if (variants.length <= 1) return variants[0] || null;
        const stats = reviewState?.variantStats || {};
        // Anti-rote: prefer least-recently-seen, fewest attempts, and lowest meanGrade
        const scored = variants.map((v) => {
          const st = stats[v.variantId];
          if (!st) return { v, priority: 1000 + Math.random() };
          const ageHours = Math.max(0, (Date.now() - (st.lastSeenMs || 0)) / 3600000);
          const weakness = 1 - (st.meanGrade ?? 0.5);
          return { v, priority: ageHours * 0.25 + weakness * 40 - st.attempts * 2 };
        }).sort((a, b) => b.priority - a.priority);
        return scored[0].v;
      }

      function instantiateVariant(variant, seedOverride = null) {
        const scope = {};
        const sampledCfg = variant?.variables?.sampled || {};
        const derivedCfg = variant?.variables?.derived || {};

        let s = seedOverride ?? Math.floor(Math.random() * 2147483646) + 1;
        const rand = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };

        for (const [k, def] of Object.entries(sampledCfg)) {
          if (def.type === 'choice' && Array.isArray(def.options) && def.options.length) {
            scope[k] = def.options[Math.floor(rand() * def.options.length)];
          } else if (def.type === 'range') {
            const min = Number(def.min ?? 0);
            const max = Number(def.max ?? 10);
            const step = Number(def.step ?? 1);
            const steps = Math.max(0, Math.floor((max - min) / step));
            const raw = min + Math.floor(rand() * (steps + 1)) * step;
            const dec = def.decimals ?? (String(step).includes('.') ? String(step).split('.')[1].length : 0);
            scope[k] = Number(raw.toFixed(dec));
          }
        }

        for (const [k, expr] of Object.entries(derivedCfg)) {
          try {
            scope[k] = Expr.evaluate(expr, scope);
          } catch (e) {
            scope[k] = 0;
          }
        }

        const resolvedStem = Expr.interpolate(variant.stem, scope);
        const resolvedHint = variant.hint ? Expr.interpolate(variant.hint, scope) : '';
        const resolvedExplanation = variant.explanation ? Expr.interpolate(variant.explanation, scope) : '';
        const resolvedCaveat = variant.overallCaveat ? Expr.interpolate(variant.overallCaveat, scope) : '';

        // Pick-one options are authored with the key first; shuffle them (opt-in, seeded) so the position gives nothing away.
        let shown = variant;
        const slot = variant?.inputSlot;
        if (slot?.type === 'choice' && slot.shuffleOptions && Array.isArray(slot.options) && slot.options.length > 1) {
          const opts = slot.options.slice();
          for (let i = opts.length - 1; i > 0; i--) {
            const j = Math.floor(rand() * (i + 1));
            [opts[i], opts[j]] = [opts[j], opts[i]];
          }
          shown = { ...variant, inputSlot: { ...slot, options: opts } };
        }

        return {
          variant: shown,
          scope,
          resolvedStem,
          resolvedHint,
          resolvedExplanation,
          resolvedCaveat,
        };
      }

      function computeModuleReadiness(mod, nodes, reviewMap, nowMs = Date.now(), attemptLogs = []) {
        const modNodes = nodes.filter((n) => n.moduleCode === mod.moduleCode);
        const hasExam = mod.examTimestamp !== null && mod.examTimestamp !== undefined;
        const targetExamMs = hasExam ? mod.examTimestamp : (nowMs + 14 * DAY_MS);
        const daysToExam = hasExam ? Math.max(0, (mod.examTimestamp - nowMs) / DAY_MS) : null;

        // Latest attempt log per nodeId
        const latestLogByNode = {};
        if (Array.isArray(attemptLogs)) {
          for (const log of attemptLogs) {
            if (!log?.nodeId) continue;
            const prev = latestLogByNode[log.nodeId];
            if (!prev || (log.timestamp || 0) >= (prev.timestamp || 0)) {
              latestLogByNode[log.nodeId] = log;
            }
          }
        }

        let weightedSum = 0;
        let weightTotal = 0;
        let dueCount = 0;
        let attemptedCount = 0;
        let proficientCount = 0;
        const weekStats = {};

        for (const w of (mod.weeks || [])) {
          weekStats[w.weekNum] = {
            ...w,
            count: 0,
            due: 0,
            attemptedCount: 0,
            proficientCount: 0,
            neverAttemptedCount: 0,
            attemptedPct: 0,
            proficientPct: 0,
            projectedSum: 0,
            projectedRetention: 0,
          };
        }

        for (const n of modNodes) {
          const wk = n.metadata?.week ?? 1;
          const wInfo = mod.weeks?.find((w) => w.weekNum === wk);
          const wkWeight = wInfo?.examWeight ?? 1.0;
          const rs = reviewMap[n.id];
          const latestLog = latestLogByNode[n.id];
          const isAttempted = Boolean(latestLog || (rs && (rs.reps || 0) > 0));
          let lastScore = null;
          if (latestLog && typeof latestLog.normalizedGrade === 'number') {
            lastScore = latestLog.normalizedGrade;
          } else if (rs && rs.variantStats && Object.keys(rs.variantStats).length) {
            const entries = Object.values(rs.variantStats).sort((a, b) => (b.lastSeenMs || 0) - (a.lastSeenMs || 0));
            lastScore = entries[0]?.meanGrade ?? null;
          }
          const isProficient = isAttempted && lastScore !== null && lastScore >= 0.7;

          const projR = rs ? retrievability(rs.S, Math.max(0, (targetExamMs - (rs.lastReviewMs || nowMs)) / DAY_MS)) : 0.15;

          if (!rs || rs.dueMs <= nowMs) dueCount++;
          if (isAttempted) attemptedCount++;
          if (isProficient) proficientCount++;

          weightedSum += projR * wkWeight;
          weightTotal += wkWeight;

          if (!weekStats[wk]) {
            weekStats[wk] = {
              weekNum: wk,
              title: `Chapter ${wk}`,
              examWeight: wkWeight,
              count: 0,
              due: 0,
              attemptedCount: 0,
              proficientCount: 0,
              neverAttemptedCount: 0,
              attemptedPct: 0,
              proficientPct: 0,
              projectedSum: 0,
              projectedRetention: 0,
            };
          }
          weekStats[wk].count += 1;
          weekStats[wk].projectedSum += projR;
          if (!rs || rs.dueMs <= nowMs) weekStats[wk].due += 1;
          if (isAttempted) weekStats[wk].attemptedCount += 1;
          if (isProficient) weekStats[wk].proficientCount += 1;
        }

        for (const w of Object.values(weekStats)) {
          w.neverAttemptedCount = w.count - w.attemptedCount;
          w.attemptedPct = w.count > 0 ? (w.attemptedCount / w.count) * 100 : 0;
          w.proficientPct = w.count > 0 ? (w.proficientCount / w.count) * 100 : 0;
          w.projectedRetention = w.count > 0 ? w.projectedSum / w.count : 0;
        }

        const totalNodes = modNodes.length;
        const neverAttemptedCount = totalNodes - attemptedCount;
        const attemptedPct = totalNodes > 0 ? (attemptedCount / totalNodes) * 100 : 0;
        const proficientPct = totalNodes > 0 ? (proficientCount / totalNodes) * 100 : 0;
        const projectedRetention = weightTotal > 0 ? weightedSum / weightTotal : 0;
        return {
          moduleCode: mod.moduleCode,
          daysToExam,
          totalNodes,
          dueCount,
          attemptedCount,
          proficientCount,
          neverAttemptedCount,
          attemptedPct,
          proficientPct,
          masteredCount: proficientCount,
          projectedRetention,
          weeks: Object.values(weekStats).sort((a, b) => a.weekNum - b.weekNum),
        };
      }

      function inferNodeExamStyle(node) {
        if (node?.metadata?.examStyle) return node.metadata.examStyle;
        if (node?.tier === 'synthesis') return 'construct_4to6';
        const firstMarks = Number(node?.variants?.[0]?.marks ?? 2);
        if (firstMarks <= 1) return 'mcq_1mark';
        if (firstMarks >= 4) return 'construct_4to6';
        return 'short_2to3';
      }

      /* What a blank answer looks like for a variant's answer type. */
      function initialInputFor(variant) {
        const slot = variant.inputSlot || {};
        if (slot.type === 'unordered_set') return [];
        if (slot.type === 'mapped_fields') return {};
        if (slot.type === 'choice') return slot.selectionMode === 'multi' ? [] : '';
        if (slot.type === 'interactive_widget') return {};
        if (slot.type === 'ordered_list') {
          const rawIds = (slot.items || []).map((it) => (typeof it === 'object' ? String(it.id) : String(it)));
          const target = (variant.evaluator?.targetOrder || []).map((x) => String(x));
          if (rawIds.length > 1 && rawIds.every((v, i) => v === target[i])) return rawIds.slice(1).concat(rawIds[0]);
          return rawIds;
        }
        return '';
      }

      /* Final-exam style papers: a few big questions, each made of parts drawn from named nodes. A part may list
         alternatives (one is picked), and every part gets its own random data. Marks come from the variants. */
      const FINAL_RECIPES = {
        CM2011: {
          label: 'Final-style paper', durationMinutes: 120,
          note: 'Built like the 2025-26 final: Q1 statistics, PSI, electrochemistry reasoning and propagation; Q2 ISE and Kjeldahl with spectrophotometry; Q3 the extraction chain with a pH; Q4 GC and HPLC, written. Part sizes and exact parts change from year to year, so treat the length as a guide.',
          sections: [
            { label: 'Question 1 · Statistics, air quality, electrochemistry, propagation', parts: [['bk-m11-t1-ttest-final'], ['bk-m11-a-sub'], ['bk-m11-a-written'], ['bk-m11-e-ksp'], ['bk-m11-e-ionic'], ['bk-m11-t1-errprop']] },
            { label: 'Question 2 · Ion-selective electrode, Kjeldahl and spectrophotometry', parts: [['bk-m11-q-kjeldahl'], ['bk-m11-p-cal'], ['bk-m11-p-written'], ['bk-m11-s-beer'], ['bk-m11-s-beer'], ['bk-m11-s-fl-explain']] },
            { label: 'Question 3 · Extraction', parts: [['bk-m11-x-acid/x-acid-chain']] },
            { label: 'Question 4 · GC and HPLC', parts: [['bk-m11-g-detectors/g-tcd'], ['bk-m11-g-detectors/g-fid'], ['bk-m11-g-columns/g-open-packed'], ['bk-m11-g-tprog/g-tprog'], ['bk-m11-h-gradient/h-grad-vs-iso'], ['bk-m11-h-order/h-ord-final'], ['bk-m11-g-ms/g-gcms-lcms']] },
          ],
        },
      };

      function assembleRecipePaper(nodes, recipe, options = {}) {
        const byId = Object.fromEntries(nodes.map((n) => [n.id, n]));
        const rnd = options.random || Math.random;
        const questions = [];
        const sections = [];
        const usedVariants = new Set();
        let totalMarks = 0;
        for (const sec of recipe.sections) {
          let secMarks = 0;
          for (const part of sec.parts) {
            // an entry is a node id, or node/variant to fix the variant (the final's Q3 chain, the named Q4 parts)
            const avail = part.filter((id) => byId[String(id).split('/')[0]]);
            if (!avail.length) continue;
            const pickedEntry = String(avail[Math.floor(rnd() * avail.length)]);
            const [pickedId, pinned] = pickedEntry.split('/');
            const node = byId[pickedId];
            // the same node may appear twice in a recipe, but never as the same variant
            let variant = pinned ? node.variants.find((x) => x.variantId === pinned) || null : null;
            for (let tries = 0; tries < 8 && !variant; tries++) {
              const v = selectVariant(node, options.reviewMap?.[node.id]);
              if (v && !usedVariants.has(`${node.id}/${v.variantId}`)) variant = v;
              else if (node.variants.length > 1) { const free = node.variants.filter((x) => !usedVariants.has(`${node.id}/${x.variantId}`)); if (free.length) variant = free[Math.floor(rnd() * free.length)]; }
            }
            if (!variant) continue;
            usedVariants.add(`${node.id}/${variant.variantId}`);
            const marks = Number(variant.marks ?? 1);
            secMarks += marks;
            questions.push({
              index: questions.length, node, examStyle: inferNodeExamStyle(node), section: sec.label, inst: instantiateVariant(variant),
              userInput: initialInputFor(variant), paperScratchpad: false, rubricChecks: {}, evalResult: null, earnedMarks: 0,
            });
          }
          totalMarks += secMarks;
          sections.push({ label: sec.label, marks: secMarks });
        }
        const weeks = [...new Set(questions.map((q) => Number(q.node.metadata?.week)))].sort((a, b) => a - b);
        return {
          mockId: options.mockId || `final-${Date.now()}`, durationMinutes: recipe.durationMinutes, chapters: weeks,
          proportions: { mcq_1mark: 0, short_2to3: 0, construct_4to6: 1 }, styleTargets: { mcq_1mark: 0, short_2to3: 0, construct_4to6: questions.length },
          questions, totalMarks, sections,
        };
      }

      function assembleMockPaper(nodes, options = {}) {
        const chapters = Array.isArray(options.chapters) && options.chapters.length
          ? new Set(options.chapters.map((c) => Number(c)))
          : null;
        const durationMinutes = Math.max(5, Number(options.durationMinutes) || 30);
        const rawProps = options.proportions || DEFAULT_SETTINGS.mockPaper.proportions;
        const pMcq = Math.max(0, Number(rawProps.mcq_1mark ?? 0.25));
        const pShort = Math.max(0, Number(rawProps.short_2to3 ?? 0.50));
        const pConst = Math.max(0, Number(rawProps.construct_4to6 ?? 0.25));
        const pSum = (pMcq + pShort + pConst) || 1;
        const normProps = {
          mcq_1mark: pMcq / pSum,
          short_2to3: pShort / pSum,
          construct_4to6: pConst / pSum,
        };

        const eligible = nodes.filter((n) => {
          if (n.metadata?.composerOnly) return false;
          if (chapters && !chapters.has(Number(n.metadata?.week))) return false;
          return true;
        });

        const requestedCount = Number(options.totalQuestions) > 0
          ? Number(options.totalQuestions)
          : Math.max(3, Math.min(12, Math.round(durationMinutes / 3.5)));
        const targetCount = Math.min(eligible.length, requestedCount);
        if (targetCount === 0) {
          return {
            mockId: options.mockId || `mock-${Date.now()}`,
            durationMinutes,
            chapters: chapters ? [...chapters].sort((a, b) => a - b) : [],
            proportions: normProps,
            styleTargets: { mcq_1mark: 0, short_2to3: 0, construct_4to6: 0 },
            questions: [],
            totalMarks: 0,
          };
        }

        // Largest-remainder quota allocation across examStyle buckets
        const styleKeys = ['mcq_1mark', 'short_2to3', 'construct_4to6'];
        const exactQuotas = styleKeys.map((k) => ({ key: k, exact: normProps[k] * targetCount }));
        const styleTargets = {};
        let assigned = 0;
        for (const q of exactQuotas) {
          styleTargets[q.key] = Math.floor(q.exact);
          assigned += styleTargets[q.key];
        }
        exactQuotas
          .slice()
          .sort((a, b) => (b.exact - Math.floor(b.exact)) - (a.exact - Math.floor(a.exact)))
          .forEach((q) => {
            if (assigned < targetCount) {
              styleTargets[q.key] += 1;
              assigned += 1;
            }
          });

        const hasSeed = options.seed !== undefined && options.seed !== null;
        let rngState = 1;
        if (hasSeed) {
          const numSeed = Number(options.seed);
          if (Number.isFinite(numSeed)) {
            rngState = (Math.abs(Math.floor(numSeed)) % 2147483646) || 1;
          } else {
            let h = 2166136261;
            const str = String(options.seed);
            for (let i = 0; i < str.length; i++) {
              h ^= str.charCodeAt(i);
              h = Math.imul(h, 16777619);
            }
            rngState = (Math.abs(h) % 2147483646) || 1;
          }
        }
        const rand = hasSeed
          ? () => { rngState = (rngState * 16807) % 2147483647; return (rngState - 1) / 2147483646; }
          : () => Math.random();

        const shuffleInPlace = (arr) => {
          for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(rand() * (i + 1));
            const tmp = arr[i];
            arr[i] = arr[j];
            arr[j] = tmp;
          }
          return arr;
        };

        const moduleMap = options.moduleMap
          ? options.moduleMap
          : Array.isArray(options.modules)
            ? Object.fromEntries(options.modules.map((m) => [m.moduleCode, m]))
            : options.module
              ? { [options.module.moduleCode]: options.module }
              : (typeof SEED_MODULES !== 'undefined'
                ? Object.fromEntries(SEED_MODULES.map((m) => [m.moduleCode, m]))
                : {});

        const getChapterWeight = (n) => {
          const mod = moduleMap?.[n.moduleCode];
          const wk = Number(n.metadata?.week);
          const wInfo = mod?.weeks?.find((w) => Number(w.weekNum) === wk);
          const rawW = wInfo?.examWeight ?? n.metadata?.examWeight ?? 1.0;
          const w = Number(rawW);
          return Number.isFinite(w) ? Math.max(0, w) : 1.0;
        };

        const nowMs = Number(options.nowMs) || Date.now();
        const isPreferred = (n) => {
          const rs = options.reviewMap?.[n.id];
          return !rs || (rs.reps || 0) === 0 || (rs.dueMs ?? 0) <= nowMs;
        };

        const pickWeighted = (candidates) => {
          if (!candidates.length) return null;
          if (candidates.length === 1) return candidates[0];
          let totalWeight = 0;
          const weights = candidates.map((n) => {
            const w = getChapterWeight(n);
            totalWeight += w;
            return w;
          });
          if (totalWeight <= 0) {
            return candidates[Math.floor(rand() * candidates.length)];
          }
          let r = rand() * totalWeight;
          for (let i = 0; i < candidates.length; i++) {
            r -= weights[i];
            if (r <= 0) return candidates[i];
          }
          return candidates[candidates.length - 1];
        };

        const buckets = { mcq_1mark: [], short_2to3: [], construct_4to6: [] };
        for (const n of eligible) {
          const st = inferNodeExamStyle(n);
          if (buckets[st]) buckets[st].push(n);
          else buckets.short_2to3.push(n);
        }
        for (const st of styleKeys) {
          shuffleInPlace(buckets[st]);
        }
        const shuffledEligible = shuffleInPlace(eligible.slice());

        const pickedNodes = [];
        const pickedIds = new Set();
        const usedFamilies = new Set();

        const pickFromPool = (pool) => {
          const avail = pool.filter((n) => !pickedIds.has(n.id));
          if (!avail.length) return null;
          const isFreshFamily = (n) => {
            const fam = n.metadata?.family;
            return !fam || !usedFamilies.has(fam);
          };
          const t1 = avail.filter((n) => isPreferred(n) && isFreshFamily(n));
          if (t1.length) return pickWeighted(t1);
          const t2 = avail.filter((n) => !isPreferred(n) && isFreshFamily(n));
          if (t2.length) return pickWeighted(t2);
          const t3 = avail.filter((n) => isPreferred(n));
          if (t3.length) return pickWeighted(t3);

    /* Pure: chapters that the seed lists for a module but the stored module row lacks, added without touching anything the
       user edited. Returns the module rows to write (empty when nothing is missing). */
    function addMissingWeeks(storedMods, seedMods) {
      const patches = [];
      for (const seedMod of seedMods) {
        const prev = (storedMods || []).find((m) => m.moduleCode === seedMod.moduleCode);
        if (!prev) continue;
        const have = new Set((prev.weeks || []).map((w) => Number(w.weekNum)));
        const add = (seedMod.weeks || []).filter((w) => !have.has(Number(w.weekNum)));
        if (add.length) patches.push({ ...prev, weeks: [...(prev.weeks || []), ...add].sort((x, y) => Number(x.weekNum) - Number(y.weekNum)) });
      }
      return patches;
    }

          { id: 'CO', formula: 'CO', tokenInComplex: '(CO)', charge: 0, denticity: 1, donorAtom: 'C', nameInComplex: 'carbonyl', altNames: [], fieldClass: 'strong' },

      const DEFAULT_METAL_BY_SYMBOL = Object.fromEntries(DEFAULT_DATA.metals.map((m) => [m.symbol, m]));
      const DEFAULT_LIGAND_BY_ID = Object.fromEntries(DEFAULT_DATA.ligands.map((l) => [l.id, l]));
      const IDO_TO_CANONICAL_O = {
        fluorido: 'fluoro',
        chlorido: 'chloro',
        bromido: 'bromo',
        iodido: 'iodo',
        hydroxido: 'hydroxo',
        cyanido: 'cyano',

      function cloneDefaultData() {
        return JSON.parse(JSON.stringify(DEFAULT_DATA));
      }

      function romanNumeral(n) {
        const k = Number(n);
        return INT_TO_ROMAN[k] ?? String(n);
      }

      function parseRomanOrInt(val) {
        if (typeof val === 'number' && Number.isFinite(val)) return Math.round(val);
        const s = String(val ?? '').trim().toUpperCase();
        if (s in ROMAN_TO_INT) return ROMAN_TO_INT[s];
        const parsed = Number(s);
        return Number.isFinite(parsed) ? Math.round(parsed) : NaN;
      }

      function normalizeData(rawData) {
        const src = rawData && typeof rawData === 'object' ? rawData : DEFAULT_DATA;
        let metalsArr = [];
        if (Array.isArray(src.metals)) {
          metalsArr = src.metals;
        } else if (src.metals && typeof src.metals === 'object') {
          metalsArr = Object.entries(src.metals).map(([symbol, v]) => (Array.isArray(v) ? { symbol, oxStates: v } : { symbol, ...v }));
        } else {
          metalsArr = DEFAULT_DATA.metals;
        }

        const metals = metalsArr.map((m) => {
          const sym = String(m.symbol || m.id || '').trim();
          const fallback = DEFAULT_METAL_BY_SYMBOL[sym] || { group: 8, name: sym.toLowerCase(), ateName: `${sym.toLowerCase()}ate`, oxStates: [2] };
          const rawOx = Array.isArray(m.oxStates || m.allowedOxidationStates || m.oxidationStates)
            ? (m.oxStates || m.allowedOxidationStates || m.oxidationStates)
            : fallback.oxStates;
          const oxStates = rawOx.map(parseRomanOrInt).filter((x) => Number.isFinite(x));
          return {
            symbol: sym,
            group: Number.isFinite(Number(m.group)) ? Number(m.group) : fallback.group,
            oxStates: oxStates.length ? oxStates : fallback.oxStates,
            name: String(m.name || fallback.name).toLowerCase(),
            ateName: String(m.ateName || fallback.ateName).toLowerCase(),
          };
        }).filter((m) => m.symbol);

        let ligandsArr = [];
        if (Array.isArray(src.ligands)) {
          ligandsArr = [...src.ligands];
        } else if (src.ligands && typeof src.ligands === 'object') {
          ligandsArr = Object.entries(src.ligands).map(([id, v]) => ({ id, ...v }));
        } else {
          ligandsArr = [...DEFAULT_DATA.ligands];
        }

        // Ensure any newly introduced default ligands (e.g. SCN-, NCS-) exist if not already present
        for (const defLig of DEFAULT_DATA.ligands) {
          const exists = ligandsArr.some((l) => {
            const lid = String(l.id || l.key || l.formula || '').trim().toLowerCase();
            return lid === defLig.id.toLowerCase() || lid === defLig.formula.toLowerCase();
          });
          if (!exists) ligandsArr.push(defLig);
        }

        const ligands = ligandsArr.map((l) => {
          const id = String(l.id || l.key || l.formula || '').trim();
          const fallback = DEFAULT_LIGAND_BY_ID[id] || DEFAULT_DATA.ligands.find((d) => d.formula.toLowerCase() === id.replace(/[+-]+$/, '').toLowerCase()) || {};
          const formula = String(l.formula || fallback.formula || id.replace(/[+-]+$/, '')).trim();
          const tokenInComplex = String(l.tokenInComplex || fallback.tokenInComplex || (formula.length > 2 || /\d/.test(formula) ? `(${formula})` : formula));
          const rawField = String(l.fieldClass || l.field || fallback.fieldClass || 'weak').toLowerCase();

          const fieldClass = (formula.toLowerCase() === 'en' && rawField === 'intermediate') ? 'strong' : rawField;

          let altNames = Array.isArray(l.altNames)
            ? l.altNames.map((a) => String(a).toLowerCase())
            : [...(fallback.altNames || [])];
          if (IDO_TO_CANONICAL_O[nameInComplex]) {
            const idoForm = nameInComplex;
            nameInComplex = IDO_TO_CANONICAL_O[idoForm];
            altNames = [idoForm, ...altNames.filter((a) => a !== nameInComplex && a !== idoForm)];
          }

            id: id || fallback.id || formula,
            formula,
            tokenInComplex,
            charge: Number.isFinite(Number(l.charge)) ? Number(l.charge) : (fallback.charge ?? 0),
            denticity: Number.isFinite(Number(l.denticity)) ? Number(l.denticity) : (fallback.denticity ?? 1),
            donorAtom: String(l.donorAtom || fallback.donorAtom || ''),
            useBisTris: Boolean(l.useBisTris ?? fallback.useBisTris ?? false),
            nameInComplex,
            altNames,
            fieldClass,
          };
        }).filter((l) => l.id);

        return { metals, ligands };

      function resolveMetal(symbol, rawData = DEFAULT_DATA) {
        const data = normalizeData(rawData);
        const target = String(symbol || '').trim().toLowerCase();
        return data.metals.find((m) => m.symbol.toLowerCase() === target || m.name === target) || null;
      }

      function resolveLigand(key, rawData = DEFAULT_DATA) {
        const data = normalizeData(rawData);
        const raw = String(key || '').trim();
        const cleaned = raw.replace(/^\(|\)$/g, '').trim();
        const lower = cleaned.toLowerCase();
        return data.ligands.find((l) =>
          l.id.toLowerCase() === lower ||
          l.formula.toLowerCase() === lower ||
          l.tokenInComplex.replace(/^\(|\)$/g, '').toLowerCase() === lower ||
          l.nameInComplex === lower ||
          (l.altNames || []).includes(lower)
        ) || null;
      }

      function resolveCounterIon(rawToken, role = 'any') {
        const cleaned = String(rawToken || '').trim().replace(/^\(|\)$/g, '');
        if (!cleaned) return null;
        const pools = role === 'cation'
          ? COUNTER_IONS.cations
          : role === 'anion'
            ? COUNTER_IONS.anions
            : [...COUNTER_IONS.cations, ...COUNTER_IONS.anions];
        return pools.find((ion) => ion.formula === cleaned || ion.name === cleaned.toLowerCase()) || null;
      }

      function computeDn(metalSymbol, oxState, rawData = DEFAULT_DATA) {
        const metal = typeof metalSymbol === 'object' ? metalSymbol : resolveMetal(metalSymbol, rawData);
        if (!metal) throw new Error(`Unknown metal: ${metalSymbol}`);
        const ox = parseRomanOrInt(oxState);
        const dn = metal.group - ox;
        return Math.max(0, Math.min(10, dn));

      function effectiveLigandFieldClass(ligItem, oxState = null) {
        const lig = ligItem?.ligand || ligItem;

        const formula = String(lig.formula || lig.id || '').toUpperCase();

        return rawClass;

        if (typeof ligandsOrFieldClass === 'string') {
          const raw = ligandsOrFieldClass.toLowerCase();
          if (raw === 'intermediate' && Number(oxState) === 3) return 'strong';
          return raw;
        }
        const list = Array.isArray(ligandsOrFieldClass) ? ligandsOrFieldClass : [ligandsOrFieldClass].filter(Boolean);
        const classes = list.map((item) => effectiveLigandFieldClass(item, oxState));
        if (!classes.length) return 'weak';
        if (classes.includes('weak')) return 'weak';
        if (classes.includes('intermediate')) return 'intermediate';
        return 'strong';
      }

      function areAllLigandsStrong(ligandsOrFieldClass, oxState = null) {
        if (typeof ligandsOrFieldClass === 'string') {
          return weakestLigandClass(ligandsOrFieldClass, oxState) === 'strong';
        }
        const list = Array.isArray(ligandsOrFieldClass) ? ligandsOrFieldClass : [ligandsOrFieldClass].filter(Boolean);
        if (!list.length) return false;
        return list.every((item) => effectiveLigandFieldClass(item, oxState) === 'strong');

        const sym = typeof metalSymbol === 'object' ? metalSymbol?.symbol : String(metalSymbol || '').trim();
        if (sym !== 'Co' || Number(oxState) !== 3 || Number(coordNumber) !== 6) return false;
        const list = Array.isArray(ligandsList) ? ligandsList : [ligandsList].filter(Boolean);
        if (!list.length) return false;
        return list.some((item) => {
          const lig = item?.ligand || item;
          const f = String(lig?.formula || lig?.id || '').toUpperCase();
          return f === 'H2O';

          const g = String(explicitGeometry).trim();

          if (g === 'Td' || g === 'tetrahedral') return 'Td';
          if (g === 'square_planar' || g === 'D4h' || g === 'SP') return 'square_planar';

        if (Number(coordNumber) === 6) return 'Oh';
        if (Number(coordNumber) === 4) {
          if (Number(dn) === 8 && areAllLigandsStrong(ligandsOrFieldClass, oxState)) {
            return 'square_planar';
          }
          return 'Td';
        }
        return 'Oh';
      }

      function dependsOnSpinState(geometry, dn) {
        if (geometry === 'Oh') {
          const d = Number(dn);
          return d >= 4 && d <= 7;
        }
        if (geometry === 'Td' || geometry === 'square_planar') {
          return Number(dn) === 8;
        }
        return false;
      }

      function inferSpinState(geometry, dn, ligandsOrFieldClass, options = {}) {
        const oxState = options?.oxState ?? null;
        if (geometry === 'square_planar') return 'low';
        // Check textbook exception: [Co(H2O)6]3+ is low-spin when textbookExceptions flag is on
        if (
          geometry === 'Oh' &&
          options &&
          options.textbookExceptions &&
          isCobaltIIIHexaaquaCase(options.metal, oxState, ligandsOrFieldClass, options.coordNumber ?? 6)
        ) {
          return 'low';
        }
        // Heteroleptic rule: any weak-field ligand -> high spin; all strong -> low spin
        const weakest = weakestLigandClass(ligandsOrFieldClass, oxState);
        if (weakest === 'weak') return 'high';
        if (weakest === 'strong') return geometry === 'Td' ? 'high' : 'low';
        // Intermediate (e.g. NH3 with M(II)): if result depends on spin state, return 'undetermined'
        if (dependsOnSpinState(geometry, dn)) {
          return 'undetermined';
        }
        return 'high';

      function subshellUnpaired(electrons, orbitals) {
        const e = Math.max(0, Math.min(2 * orbitals, Number(electrons) || 0));
        return e <= orbitals ? e : 2 * orbitals - e;
      }

        const e = Math.max(0, Math.min(2 * orbitals, Number(electrons) || 0));
        return Math.max(0, e - orbitals);

        const bAbs = formatCleanCoeff(Math.abs(bNum));
        const sign = bNum > 0 ? ' − ' : ' + ';
        return `${aClean}${unit}${sign}${bAbs}P`;
      }

      function parseLfseExpression(rawInput) {
        if (rawInput && typeof rawInput === 'object') {
          const aVal = Number(rawInput.a ?? rawInput.value ?? rawInput.lfseCoeff ?? 0);
          const bVal = Number(rawInput.b ?? rawInput.pTerms ?? rawInput.pCount ?? 0);
          return {
            a: Number.isFinite(aVal) ? aVal : NaN,
            b: Number.isFinite(bVal) ? bVal : 0,
            hasExplicitP: rawInput.b !== undefined || rawInput.pTerms !== undefined,
          };
        }
        const s = String(rawInput ?? '')
          .trim()
          .replace(/\\Delta_[ot]/gi, 'Δ')
          .replace(/Δ[ot]?/gi, 'Δ')
          .replace(/delta_[ot]/gi, 'Δ')
          .replace(/delta/gi, 'Δ')
          .replace(/[−–—]/g, '-');
        if (!s) return { a: NaN, b: 0, hasExplicitP: false };

        // Pure number case: e.g. "0.6" or "+0.4"
        if (/^[+-]?\d+(?:\.\d+)?$/.test(s)) {
          return { a: Number(s), b: 0, hasExplicitP: false };
        }

        let a = NaN;
        let b = 0;
        let hasExplicitP = false;

        const mDelta = s.match(/([+-]?\s*\d+(?:\.\d+)?)\s*\*?\s*Δ/i);
        if (mDelta) {
          a = Number(mDelta[1].replace(/\s+/g, ''));
        } else if (/^[+-]?\s*Δ/i.test(s)) {
          a = s.trim().startsWith('-') ? -1 : 1;
        } else {
          const mLead = s.match(/^([+-]?\d+(?:\.\d+)?)/);
          if (mLead) a = Number(mLead[1]);
        }

        const mP = s.match(/([+-]\s*\d*(?:\.\d+)?)\s*\*?\s*P\b/i);
        if (mP) {
          hasExplicitP = true;
          const rawP = mP[1].replace(/\s+/g, '');
          const coeffP = (rawP === '+' || rawP === '') ? 1 : (rawP === '-' ? -1 : Number(rawP));
          // In "aΔ − bP", a "- 2P" term corresponds to b = +2
          b = -coeffP;
        } else if (/\b0\s*\*?\s*P\b/i.test(s)) {
          hasExplicitP = true;
          b = 0;
        }

        return { a, b, hasExplicitP };
      }

      function computeOrbitalFilling(geometry, dn, spinState = 'high') {
        const d = Math.max(0, Math.min(10, Number(dn) || 0));
        const highSpinPairs = Math.max(0, d - 5);

        if (String(spinState).toLowerCase() === 'undetermined') {
          return {
            geometry,
            spinState: 'undetermined',
            levels: null,
            configuration: null,
            unpaired: null,
            lfse: null,
            lfseCoeff: null,
            lfseUnit: null,
            lfseDisplay: null,
            lfseExpression: null,
            pTermsRelative: null,
            pTermsAbsolute: null,
          };
        }

        if (geometry === 'Td') {
          const eCount = Math.min(2, d) + Math.max(0, Math.min(2, d - 5));
          const t2Count = Math.max(0, Math.min(3, d - 2)) + Math.max(0, d - 7);
          const unpaired = subshellUnpaired(eCount, 2) + subshellUnpaired(t2Count, 3);
          const pTermsAbsolute = subshellPairs(eCount, 2) + subshellPairs(t2Count, 3);
          const pTermsRelative = Math.max(0, pTermsAbsolute - highSpinPairs);
          const lfseCoeff = Number((0.6 * eCount - 0.4 * t2Count).toFixed(4));
          const lfseUnit = 'Δt';
          const lfseExpression = formatLfseExpression(lfseCoeff, pTermsRelative, lfseUnit);
          return {
            geometry: 'Td',
            spinState: 'high',
            levels: { e: eCount, t2: t2Count },
            configuration: `e^${eCount} t2^${t2Count}`,
            unpaired,
            lfse: lfseExpression,
            lfseCoeff,
            lfseUnit,
            lfseDisplay: `${lfseCoeff} ${lfseUnit}`,
            lfseExpression,
            pTermsRelative,
            pTermsAbsolute,
          };
        }

        if (geometry === 'square_planar') {
          // Square planar only for d8 with strong-field ligands: lower 4 orbitals filled (4 pairs, 0 unpaired); LFSE is null
          const unpaired = d === 8 ? 0 : subshellUnpaired(d, 5);
          const pTermsAbsolute = d === 8 ? 4 : Math.floor(d / 2);
          const pTermsRelative = Math.max(0, pTermsAbsolute - highSpinPairs);
          return {
            geometry: 'square_planar',
            spinState: 'low',
            levels: { lower4: Math.min(8, d), dx2y2: Math.max(0, d - 8) },
            configuration: `d_xz^2 d_yz^2 d_z2^2 d_xy^2 d_x2-y2^${Math.max(0, d - 8)}`,
            unpaired,
            lfse: null,
            lfseCoeff: null,
            lfseUnit: null,
            lfseDisplay: null,
            lfseExpression: null,
            pTermsRelative,
            pTermsAbsolute,
          };
        }

        // Octahedral (Oh)
        const isLow = String(spinState).toLowerCase() === 'low';
        let t2gCount;
        let egCount;
        if (isLow) {
          t2gCount = Math.min(6, d);
          egCount = Math.max(0, d - 6);
        } else {
          t2gCount = Math.min(3, d) + Math.max(0, Math.min(3, d - 5));
          egCount = Math.max(0, Math.min(2, d - 3)) + Math.max(0, d - 8);
        }

        const unpaired = subshellUnpaired(t2gCount, 3) + subshellUnpaired(egCount, 2);
        const pTermsAbsolute = subshellPairs(t2gCount, 3) + subshellPairs(egCount, 2);
        const pTermsRelative = Math.max(0, pTermsAbsolute - highSpinPairs);
        const lfseCoeff = Number((0.4 * t2gCount - 0.6 * egCount).toFixed(4));
        const lfseUnit = 'Δo';
        const lfseExpression = formatLfseExpression(lfseCoeff, pTermsRelative, lfseUnit);

        return {
          geometry: 'Oh',
          spinState: isLow ? 'low' : 'high',
          levels: { t2g: t2gCount, eg: egCount },
          configuration: `t2g^${t2gCount} eg^${egCount}`,
          unpaired,
          lfse: lfseExpression,
          lfseCoeff,
          lfseUnit,
          lfseDisplay: `${lfseCoeff} ${lfseUnit}`,
          lfseExpression,
          pTermsRelative,
          pTermsAbsolute,
        };
      }

      function computeSpinOnlyMoment(unpaired) {
        const n = Math.max(0, Number(unpaired) || 0);
        return Number(Math.sqrt(n * (n + 2)).toFixed(4));
      }

      function muSpinOnlyToUnpaired(muBM, tolerance = 0.08) {
        const target = Number(muBM);
        if (!Number.isFinite(target) || target < 0) return null;
        // Exact analytical inversion of μ = √(n(n+2)) => n = -1 + √(1 + μ^2)
        const exactN = -1 + Math.sqrt(1 + target * target);
        const rounded = Math.round(exactN);
        if (rounded >= 0 && rounded <= 5) {
          const checkMu = computeSpinOnlyMoment(rounded);
          if (Math.abs(checkMu - target) <= tolerance) return rounded;
        }
        return null;
      }

      function matchesOrbitalOccupancy(complexAnalysis, rawDesc) {
        if (!complexAnalysis || !complexAnalysis.levels || complexAnalysis.spinState === 'undetermined') return false;
        const desc = String(rawDesc || '').trim().toLowerCase().replace(/[_-]/g, ' ').replace(/\s+/g, ' ');
        const { geometry, levels, dn } = complexAnalysis;
        // Exclude trivial d0 / d10 configurations unless explicitly requested
        if (dn === 0 || dn === 10) return false;

        if (geometry === 'Td') {
          const e = levels.e ?? 0;
          const t2 = levels.t2 ?? 0;
          if (desc === 'half filled e' || desc === 'e half filled') {
            // In Td high-spin, e is half-filled (e^2) without partial t2 mismatch when t2 is empty (d2, e^2 t2^0) or half-filled (d5, e^2 t2^3)
            return e === 2 && (t2 === 0 || t2 === 3);
          }
          if (desc === 'e empty' || desc === 'empty e') return e === 0;
          if (desc === 'e full' || desc === 'full e' || desc === 'fully filled e') return e === 4 && (t2 === 3 || t2 === 6);
          if (desc === 't2 empty' || desc === 'empty t2') return t2 === 0 && e > 0;
          if (desc === 'half filled t2' || desc === 't2 half filled') return t2 === 3;
          if (desc === 't2 full' || desc === 'full t2' || desc === 'fully filled t2') return t2 === 6;
          return false;
        }

        if (geometry === 'Oh') {
          const t2g = levels.t2g ?? 0;
          const eg = levels.eg ?? 0;
          if (desc === 'eg empty' || desc === 'empty eg') return eg === 0 && t2g > 0;
          if (desc === 'half filled eg' || desc === 'eg half filled') return eg === 2;
          if (desc === 'eg full' || desc === 'full eg' || desc === 'fully filled eg') return eg === 4;
          if (desc === 't2g full' || desc === 'full t2g' || desc === 'fully filled t2g') return t2g === 6;
          if (desc === 'half filled t2g' || desc === 't2g half filled') return t2g === 3 && (eg === 0 || eg === 2);
          if (desc === 't2g empty' || desc === 'empty t2g') return t2g === 0;
          return false;
        }

        return false;
      }
