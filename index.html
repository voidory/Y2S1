          btn.addEventListener('click', () => { appState.ui.sheet = btn.dataset.openSheet; renderStudyView(root); });
        });
        const closeSheet = () => { appState.ui.sheet = null; renderStudyView(root); };
        $$('[data-close-sheet]', root).forEach((btn) => btn.addEventListener('click', closeSheet));
        $('[data-sheet-backdrop]', root)?.addEventListener('click', (e) => { if (e.target === e.currentTarget) closeSheet(); });

        $$('[data-jump-node]', root).forEach((btn) => {
          btn.addEventListener('click', () => {
            appState.filters.forceNodeId = btn.dataset.jumpNode;
            loadNextQuestion();
          });
        });

        // Slot-specific bindings
        if (slot.type === 'typed_short') {
          const inp = $('#shortAnsInput', root);
          inp?.addEventListener('input', (e) => { cur.userInput = e.target.value; });
          inp?.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && phase === 'answering') {
              e.preventDefault();
              $('#btnSubmitAnswer', root)?.click();
            }
          });
        } else if (slot.type === 'unordered_set') {
          const hasCompanionFields = Array.isArray(slot.fields) && slot.fields.length > 0;
          const ensureSetObj = () => {
            if (hasCompanionFields) {
              if (!cur.userInput || typeof cur.userInput !== 'object' || Array.isArray(cur.userInput)) {
                cur.userInput = { tokens: Array.isArray(cur.userInput) ? cur.userInput : [], fields: {} };
              }
              if (!Array.isArray(cur.userInput.tokens)) cur.userInput.tokens = [];
              if (!cur.userInput.fields || typeof cur.userInput.fields !== 'object') cur.userInput.fields = {};
              return cur.userInput.tokens;
            }
            if (!Array.isArray(cur.userInput)) cur.userInput = [];
            return cur.userInput;
          };
          const addTok = () => {
            const inp = $('#setTokenInput', root);
            const val = inp?.value.trim();
            if (!val) return;
            const tokArr = ensureSetObj();
            val.split(/[,\n]+/).map((s) => s.trim()).filter(Boolean).forEach((t) => tokArr.push(t));
            inp.value = '';
            render();
            $('#setTokenInput', root)?.focus();
          };
          $('#btnAddSetToken', root)?.addEventListener('click', addTok);
          $('#setTokenInput', root)?.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); addTok(); }
          });
          $$('[data-del-token]', root).forEach((btn) => {
            btn.addEventListener('click', () => {
              const tokArr = ensureSetObj();
              tokArr.splice(Number(btn.dataset.delToken), 1);
              render();
            });
          });
          $$('[data-set-field-key]', root).forEach((inp) => {
            inp.addEventListener('input', (e) => {
              ensureSetObj();
              cur.userInput.fields[inp.dataset.setFieldKey] = e.target.value;
            });
          });
        } else if (slot.type === 'mapped_fields') {
          $$('[data-mf-key]', root).forEach((inp) => {
            inp.addEventListener('input', (e) => {
              if (!cur.userInput || typeof cur.userInput !== 'object') cur.userInput = {};
              cur.userInput[inp.dataset.mfKey] = e.target.value;
            });
            // Enter submits once every field has something in it; until then it jumps to the next empty field
            inp.addEventListener('keydown', (e) => {
              if (e.key !== 'Enter' || phase !== 'answering' || e.isComposing) return;
              e.preventDefault();
              const all = $$('[data-mf-key]', root);
              const empty = all.find((el, i) => i > all.indexOf(inp) && !String(el.value || '').trim()) || all.find((el) => !String(el.value || '').trim());
              if (empty && empty !== inp) empty.focus();
              else $('#btnSubmitAnswer', root)?.click();
            });
          });
        } else if (slot.type === 'choice') {
          $$('input[name="choiceInput"]', root).forEach((inp) => {
            inp.addEventListener('keydown', (e) => {
              if (e.key === 'Enter' && phase === 'answering') { e.preventDefault(); inp.checked = true; inp.dispatchEvent(new Event('change')); $('#btnSubmitAnswer', root)?.click(); }
            });
            inp.addEventListener('change', () => {
              if (slot.selectionMode === 'multi') {
                cur.userInput = $$('input[name="choiceInput"]:checked', root).map((el) => el.value);
              } else {
                cur.userInput = inp.value;
              }
            });
          });
        } else if (slot.type === 'ordered_list') {
          bindOrderedListInteractions($('#orderedListContainer', root), () => cur.userInput, (nextOrder) => {
            cur.userInput = nextOrder;
            render();
          });
        } else if (slot.type === 'typed_equation') {
          const eqInp = $('#equationAnsInput', root);
          eqInp?.addEventListener('input', (e) => { cur.userInput = e.target.value; });
        } else if (slot.type === 'interactive_widget') {
          const mount = $('#widgetMount', root);
          if (mount) {
            if (slot.widgetType === 'isomer_3d_canvas') {
              appState.cleanupWidget = Widgets.mountIsomerCanvas(mount, slot.widgetConfig || {}, cur.userInput, (st) => {
                cur.userInput = st;
              });
            } else if (slot.widgetType === 'orbital_energy_diagram') {
              appState.cleanupWidget = Widgets.mountOrbitalDiagram(mount, slot.widgetConfig || {}, cur.userInput, (st) => {
                cur.userInput = st;
              });
            }
          }
        } else if (slot.type === 'typed_synthesis') {
          const ta = $('#synthesisInput', root);
          const drawMode = isDrawThenCompareVariant(variant);
          const minW = slot.minWordsToUnlockRubric ?? (drawMode ? 0 : 15);
          const updateUnlockBtn = () => {
            const wc = countWords(cur.userInput);
            const ok = drawMode || cur.paperScratchpad || wc >= minW;
            const ro = $('#wordCountReadout', root);
            if (ro) {
              ro.textContent = `${wc} / ${minW} words`;
              ro.className = `font-mono ${ok ? 'text-emerald-700' : 'text-slate-500'}`;
            }
            const btn = $('#btnUnlockRubric', root);
            if (btn) btn.disabled = !ok;
          };
          ta?.addEventListener('input', (e) => { cur.userInput = e.target.value; updateUnlockBtn(); });
          $('#paperScratchpadToggle', root)?.addEventListener('change', (e) => {
            cur.paperScratchpad = e.target.checked;
            updateUnlockBtn();
          });
          $('#btnUnlockRubric', root)?.addEventListener('click', () => {
            cur.phase = 'rubric';
            render();
          });
          $$('[data-rubric-id]', root).forEach((cb) => {
            cb.addEventListener('change', (e) => {
              cur.rubricChecks[cb.dataset.rubricId] = e.target.checked;
            });
          });
          $('#btnLLMAssist', root)?.addEventListener('click', async () => {
            try {
              showToast('Running AI rubric pre-check...');
              const res = await Evaluators.requestLLMRubricPrecheck(appState.settings.llm, inst.resolvedStem, cur.userInput, variant.evaluator.rubric);
              if (res?.checks) {
                Object.assign(cur.rubricChecks, res.checks);
                render();
                showToast(res.note ? `AI Pre-Check: ${res.note}` : 'AI pre-check populated checkboxes. Review before finalizing.');
              }
            } catch (err) {
              showToast('AI pre-check failed: ' + err.message, true);
            }
          });
          $('#btnFinalizeRubric', root)?.addEventListener('click', async () => {
            const evalRes = Evaluators.evaluate(variant, cur.userInput, inst.scope, cur.rubricChecks, node);
            await commitAttempt(evalRes);
          });
        }

        if (drawThenCompare && slot.type !== 'typed_synthesis') {
          $('#btnCommitDrawCompare', root)?.addEventListener('click', () => {
            cur.phase = 'rubric';
            render();
          });
          $$('[data-rubric-id]', root).forEach((cb) => {
            cb.addEventListener('change', (e) => {
              cur.rubricChecks[cb.dataset.rubricId] = e.target.checked;
            });
          });
          $('#btnFinalizeRubric', root)?.addEventListener('click', async () => {
            const evalRes = Evaluators.evaluate(variant, cur.userInput, inst.scope, cur.rubricChecks, node);
            await commitAttempt(evalRes);
          });
        }

        $('#btnSubmitAnswer', root)?.addEventListener('click', async () => {
          if (slot.type === 'unordered_set') {
            const pending = $('#setTokenInput', root)?.value?.trim();
            if (pending) {
              const hasCompanionFields = Array.isArray(slot.fields) && slot.fields.length > 0;
              const parts = pending.split(/[,\n]+/).map((s) => s.trim()).filter(Boolean);
              if (hasCompanionFields) {
                if (!cur.userInput || typeof cur.userInput !== 'object' || Array.isArray(cur.userInput)) {
                  cur.userInput = { tokens: Array.isArray(cur.userInput) ? cur.userInput : [], fields: {} };
                }
                if (!Array.isArray(cur.userInput.tokens)) cur.userInput.tokens = [];
                parts.forEach((p) => cur.userInput.tokens.push(p));
              } else {
                if (!Array.isArray(cur.userInput)) cur.userInput = [];
                parts.forEach((p) => cur.userInput.push(p));
              }
            }
          }
          const evalRes = Evaluators.evaluate(variant, cur.userInput, inst.scope, null, node);
          await commitAttempt(evalRes);
        });
        $('#btnNextInChain', root)?.addEventListener('click', (e) => {
          const targetId = e.currentTarget.dataset.chainNext;
          if (targetId) {
            appState.filters.forceNodeId = targetId;
            loadNextQuestion();
          }
        });
        $('#btnNextQuestion', root)?.addEventListener('click', () => loadNextQuestion({ skipCurrent: true }));
        $('#btnDrillTopic', root)?.addEventListener('click', (e) => drillTopic(e.currentTarget.dataset.chunk));
        $('#btnRetryLater', root)?.addEventListener('click', () => {
          if (!appState.session.retry.some((r) => r.nodeId === node.id)) appState.session.retry.push({ nodeId: node.id, after: appState.session.cards + appState.retryAfterCards });
          cur.retryQueued = true;
          render();
        });
        $$('[data-drill-skill]', root).forEach((btn) => {
          btn.addEventListener('click', () => {
            appState.filters.skillTag = btn.dataset.drillSkill;
            appState.filters.tier = 'atomic';
            loadNextQuestion();
          });
        });

        renderMath(root);
      }

      function bindOrderedListInteractions(listEl, getOrder, setOrder) {
        if (!listEl) return;
        $$('[data-order-move]', listEl).forEach((btn) => {
          btn.addEventListener('click', () => {
            const [idxStr, deltaStr] = btn.dataset.orderMove.split(':');
            const idx = Number(idxStr);
            const delta = Number(deltaStr);
            const arr = (getOrder() || []).slice();
            const targetIdx = idx + delta;
            if (targetIdx < 0 || targetIdx >= arr.length) return;
            const tmp = arr[idx];
            arr[idx] = arr[targetIdx];
            arr[targetIdx] = tmp;
            setOrder(arr);
          });
        });

        let dragFromIdx = null;
        $$('[data-order-item]', listEl).forEach((row) => {
          row.addEventListener('dragstart', (e) => {
            dragFromIdx = Number(row.dataset.orderIdx);
            if (e.dataTransfer) e.dataTransfer.effectAllowed = 'move';
          });
          row.addEventListener('dragover', (e) => {
            e.preventDefault();
          });
          row.addEventListener('drop', (e) => {
            e.preventDefault();
            const toIdx = Number(row.dataset.orderIdx);
            if (dragFromIdx === null || dragFromIdx === toIdx) return;
            const arr = (getOrder() || []).slice();
            const [moved] = arr.splice(dragFromIdx, 1);
            arr.splice(toIdx, 0, moved);
            dragFromIdx = null;
            setOrder(arr);
          });
        });
      }

      function stopMockTimer() {
        if (appState.mock.timerId) {
          clearInterval(appState.mock.timerId);
          appState.mock.timerId = null;
        }
      }

      /* A fixed-format paper from the metal-ID composer: five parts, six marks each (the finals' Q3 shape). */
      function startFinalPaper() {
        const recipe = Scheduler.FINAL_RECIPES[appState.activeModule];
        if (!recipe) return;
        const paper = Scheduler.assembleRecipePaper(appState.nodes, recipe, { reviewMap: appState.reviewMap });
        if (paper.questions.length < 6) { showToast('Not enough questions for a final-style paper yet.', true); return; }
        startMockPaper({ durationMinutes: paper.durationMinutes, chapters: paper.chapters, paper });
      }

      function startMetalIdSet() {
        const pool = [...appState.nodes, ...appState.composerNodes];
        const picked = LF.composeMetalIdSet(pool, { parts: 5 });
        if (picked.length < 3) { showToast('Not enough generated metal-ID questions yet; reload to finish seeding.', true); return; }
        const questions = picked.map((node, idx) => {
          const variant = { ...node.variants[0], marks: 6 };
          return {
            index: idx, node, examStyle: 'short_2to3', inst: Scheduler.instantiateVariant(variant),
            userInput: [], paperScratchpad: '', rubricChecks: {}, evalResult: null, earnedMarks: 0,
          };
        });
        startMockPaper({
          durationMinutes: 25, chapters: [7, 8],
          paper: { mockId: `metalset-${Date.now()}`, durationMinutes: 25, chapters: [7, 8], proportions: { mcq_1mark: 0, short_2to3: 1, construct_4to6: 0 }, styleTargets: { mcq_1mark: 0, short_2to3: questions.length, construct_4to6: 0 }, questions, totalMarks: questions.length * 6 },
        });
      }

      function startMockPaper(options = {}) {
        stopMockTimer();
        const mod = activeMod();
        const chapters = Array.isArray(options.chapters) && options.chapters.length
          ? options.chapters
          : appState.mock.selectedChapters;
        const durationMinutes = Math.max(5, Number(options.durationMinutes ?? appState.mock.durationMinutes) || 30);
        const totalQuestions = Number(options.questionCount ?? appState.mock.questionCount) || 8;
        const proportions = options.proportions || appState.settings?.mockPaper?.proportions || Scheduler.DEFAULT_SETTINGS.mockPaper.proportions;

        const paper = options.paper || Scheduler.assembleMockPaper(appState.nodes, {
          chapters,
          durationMinutes,
          totalQuestions,
          proportions,
          reviewMap: appState.reviewMap,
          modules: appState.modules,
        });

        const nowMs = Date.now();
        appState.mock = {
          ...appState.mock,
          phase: 'in_progress',
          reviewFilter: 'all',
          resultTab: 'chapters',
          durationMinutes,
          questionCount: totalQuestions,
          selectedChapters: chapters.slice(),
          mockId: paper.mockId,
          questions: paper.questions,
          proportions: paper.proportions,
          styleTargets: paper.styleTargets,
          activeIdx: 0,
          startedAtMs: nowMs,
          endsAtMs: nowMs + durationMinutes * 60000,
          timerId: null,
          chapterBreakdown: [],
          totalEarned: 0,
          totalMarks: paper.totalMarks,
          moduleWeeks: mod.weeks || [],
        };

        appState.mock.timerId = setInterval(() => {
          const remMs = appState.mock.endsAtMs - Date.now();
          const timerEl = $('#mockTimerReadout');
          if (timerEl && remMs > 0) {
            const secs = Math.max(0, Math.ceil(remMs / 1000));
            const mm = String(Math.floor(secs / 60)).padStart(2, '0');
            const ss = String(secs % 60).padStart(2, '0');
            timerEl.textContent = `${mm}:${ss}`;
          }
          if (remMs <= 0 && appState.mock.phase === 'in_progress') {
            stopMockTimer();
            beginMockSubmitFlow();
          }
        }, 1000);

        render();
        return appState.mock;
      }

      async function beginMockSubmitFlow() {
        stopMockTimer();
        const hasSynthesis = appState.mock.questions.some((q) => q.inst.variant.evaluator?.type === 'atomic_rubric');
        if (hasSynthesis && appState.mock.phase === 'in_progress') {
          appState.mock.phase = 'self_marking';
          render();
          return;
        }
        await finalizeMockPaper();
      }

      async function finalizeMockPaper() {
        stopMockTimer();
        const m = appState.mock;
        if (!m.questions.length) return null;
        const db = await DB.init();
        const nowMs = Date.now();
        const modMap = moduleMap();
        const perQDurationMs = Math.max(1000, Math.round((nowMs - (m.startedAtMs || nowMs - 60000)) / m.questions.length));

        const chapterMap = {};
        const mod = activeMod();
        for (const w of (mod.weeks || [])) {
          chapterMap[w.weekNum] = {
            weekNum: w.weekNum,
            title: w.title,
            earnedMarks: 0,
            totalMarks: 0,
            questionCount: 0,
          };
        }

        let totalEarned = 0;
        let totalMarks = 0;
        const newReviewStates = [];
        const newLogs = [];

        for (const q of m.questions) {
          const variant = q.inst.variant;
          const evalRes = Evaluators.evaluate(variant, q.userInput, q.inst.scope, q.rubricChecks, q.node);
          const qMarks = Number(variant.marks ?? 1);
          const earned = Number((evalRes.normalizedGrade * qMarks).toFixed(2));
          q.evalResult = evalRes;
          q.earnedMarks = earned;

          totalEarned += earned;
          totalMarks += qMarks;

          const wk = Number(q.node.metadata?.week ?? 1);
          if (!chapterMap[wk]) {
            chapterMap[wk] = { weekNum: wk, title: `Chapter ${wk}`, earnedMarks: 0, totalMarks: 0, questionCount: 0 };
          }
          chapterMap[wk].earnedMarks = Number((chapterMap[wk].earnedMarks + earned).toFixed(2));
          chapterMap[wk].totalMarks = Number((chapterMap[wk].totalMarks + qMarks).toFixed(2));
          chapterMap[wk].questionCount += 1;

          const prevRs = appState.reviewMap[q.node.id];
          const nodeMod = modMap[q.node.moduleCode] || mod;
          const nextRs = Scheduler.updateReviewState(
            prevRs,
            q.node,
            variant.variantId,
            evalRes.normalizedGrade,
            nowMs,
            appState.settings,
            nodeMod
          );
          appState.reviewMap[q.node.id] = nextRs;
          newReviewStates.push(nextRs);

          const logEntry = {
            id: `att-${nowMs}-${q.index}-${Math.random().toString(36).slice(2, 6)}`,
            mockId: m.mockId,
            nodeId: q.node.id,
            variantId: variant.variantId,
            timestamp: nowMs,
            durationMs: perQDurationMs,
            normalizedGrade: evalRes.normalizedGrade,
            earnedMarks: earned,
            totalMarks: qMarks,
            chapter: wk,
            userInput: q.userInput,
            rubricChecks: q.rubricChecks || null,
            missedSkillTags: evalRes.missedSkillTags || [],
            errorTags: safeErrorTags(variant, q.userInput, evalRes, q.rubricChecks),
          };
          newLogs.push(logEntry);
        }

        await db.transaction('rw', db.reviewStates, db.attemptLogs, async () => {
          await db.reviewStates.bulkPut(newReviewStates);
          await db.attemptLogs.bulkPut(newLogs);
        });

        appState.attemptLogs = [...newLogs, ...appState.attemptLogs];
        for (const l of newLogs) appState.masteryLogs.push({ nodeId: l.nodeId, variantId: l.variantId, timestamp: l.timestamp, normalizedGrade: l.normalizedGrade });
        m.totalEarned = Number(totalEarned.toFixed(2));
        m.totalMarks = Number(totalMarks.toFixed(2));
        m.chapterBreakdown = Object.values(chapterMap).filter((c) => c.questionCount > 0 || m.selectedChapters.includes(c.weekNum));
        m.phase = 'submitted';
        render();
        return m;
      }

                      </div>
                      <div class="font-mono font-semibold ${chPct >= 70 ? 'text-emerald-700' : 'text-slate-800'}">
                        ${ch.earnedMarks} / ${ch.totalMarks} marks (${chPct}%)
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </section>
        `;
        const styleName = { mcq_1mark: 'MCQ', short_2to3: 'Short', construct_4to6: 'Construct' };
        const missedQs = m.questions.filter((q) => !q.evalResult?.passed);
        const onlyMissed = m.reviewFilter === 'missed';
        const shownQs = onlyMissed ? missedQs : m.questions;
        const filterBtn = (key, label, n) => `<button type="button" data-review-filter="${key}" class="px-3 py-1.5 text-xs font-medium rounded-full border ${((key === 'missed') === onlyMissed) ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-slate-700 border-slate-300'}">${label} (${n})</button>`;
        const secQuestions = `
            <section class="space-y-3">
              <div class="flex flex-wrap items-center gap-2" role="group" aria-label="Filter questions">${filterBtn('all', 'All', m.questions.length)}${filterBtn('missed', 'Marks lost', missedQs.length)}</div>
              ${shownQs.length ? shownQs.map((q) => `
                <div class="bg-white border border-slate-200 rounded-xl p-4 space-y-3" data-mock-review-q="${q.index}">
                  <div class="flex items-center justify-between text-xs">
                    <span class="font-mono text-slate-600">Q${q.index + 1} · Ch ${q.node.metadata.week} · ${esc(styleName[q.examStyle] || q.examStyle)}</span>
                    <span class="font-mono font-semibold ${q.evalResult?.passed ? 'text-emerald-700' : 'text-rose-700'}">${q.earnedMarks} / ${q.inst.variant.marks} marks</span>
                  </div>
                  <div class="font-display text-sm font-semibold text-slate-900">${esc(q.node.metadata.title)}</div>
                  <div class="text-xs text-slate-700">${esc(q.evalResult?.feedback || '')}</div>
                  ${answerReviewHtml(q.inst.variant, q.userInput, q.evalResult, q.rubricChecks)}
                  ${q.inst.resolvedExplanation ? `<div class="text-xs text-slate-600 bg-slate-50 border border-slate-200 rounded p-2.5 prose-math">${renderMarkdownLite(q.inst.resolvedExplanation)}</div>` : ''}
                </div>
              `).join('') : '<p class="text-sm text-slate-600">No marks lost on this paper.</p>'}
            </section>
        `;
        root.innerHTML = `
          <div class="view max-w-4xl">
            <div class="bg-white border border-slate-200 rounded-xl p-4 flex items-center justify-between gap-3 shrink-0">
              <div>
                <div class="text-xs font-semibold text-blue-700">Mock paper graded</div>
                <h1 class="font-display text-lg sm:text-xl font-bold text-slate-900 mt-0.5">Total Score: ${m.totalEarned} / ${m.totalMarks} marks (${pct}%)</h1>
                
              </div>
              <button type="button" id="btnNewMockPaper" class="px-4 py-2 text-xs sm:text-sm font-medium bg-slate-900 text-white rounded-lg hover:bg-slate-800">
                New Mock Paper
              </button>
            </div>
            <div class="seg shrink-0" role="tablist" aria-label="Results sections">
              <button type="button" role="tab" data-seg-mock="chapters" aria-selected="${resTab === 'chapters'}">By chapter</button>
              <button type="button" role="tab" data-seg-mock="questions" aria-selected="${resTab === 'questions'}">Question review</button>
            </div>
            <div class="view-scroll space-y-3">${resTab === 'questions' ? secQuestions : secChapters}</div>
          </div>
        `;
        $$('[data-seg-mock]', root).forEach((btn) => {
          btn.addEventListener('click', () => { m.resultTab = btn.dataset.segMock; renderMockView(root); });
        });
        $$('[data-review-filter]', root).forEach((btn) => {
          btn.addEventListener('click', () => { m.reviewFilter = btn.dataset.reviewFilter; renderMockView(root); });
        });

        $('#btnNewMockPaper', root)?.addEventListener('click', () => {
          m.phase = 'setup';
          render();
        });
        renderMath(root);
      }

      /* Skill-map readiness, split so the summary and the list can sit on different tabs. */
      function skillMapParts() {
        if (!appState.skillMap) {
          const err = appState.content.skillMap?.error;
          const msg = `<p class="text-sm text-slate-500">Skill map not loaded${err ? ': ' + esc(err) : '.'}</p>`;
          return { summary: msg, list: msg, contentCheck: msg, readiness: null };
        }
        const map = appState.skillMap;
        const nodes = appState.nodes.filter((n) => n.moduleCode === map.module);
        const nodeIds = new Set(nodes.map((n) => n.id));
        const analysis = Content.analyzeSkillMap(map, nodeIds);
        const { rows, readiness, coverage } = Content.skillRows(map, nodeIds, Content.nodeProgress(nodes, appState.reviewMap, appState.attemptLogs));
        const ms = Mastery.evaluate(appState.masteryLogs, map, nodes, appState.settings, appState.masteryPrefs);
        const removedMap = appState.masteryPrefs.removed;
        const act = 'px-2 py-0.5 text-[11px] font-medium border rounded-md';
        const masteryHtml = (sid) => {
          const m = ms.states[sid];
          if (removedMap[sid]) return `<span class="text-slate-500">removed</span> <button type="button" data-mastery-act="restore" data-skill="${esc(sid)}" class="${act} border-slate-300 text-slate-700">Restore</button>`;
          if (m?.status === 'retired') {
            return `<span class="text-emerald-700 font-semibold">mastered</span> <span class="text-slate-500">· check in ${m.dueIn} cards</span>
              <button type="button" data-mastery-act="reopen" data-skill="${esc(sid)}" class="${act} border-slate-300 text-slate-700">Reopen</button>
              <button type="button" data-mastery-act="remove" data-skill="${esc(sid)}" class="${act} border-slate-300 text-slate-700">Remove</button>`;
          }
          return m?.evidence ? `<span class="text-slate-500">mastery ${m.evidence}/${m.required}</span>` : '';
        };
        // group by theory chunk when the map defines them, otherwise fall back to chapters
        const groups = (map.chunks?.length
          ? map.chunks.map((c) => ({ key: c.id, title: c.name, part: c.part, summary: c.summary, rows: rows.filter((r) => r.skill.chunk === c.id) }))
          : [...new Set(rows.map((r) => r.skill.ch))].sort((x, y) => x - y).map((ch) => ({ key: 'ch' + ch, title: `Chapter ${ch}`, part: '', summary: '', rows: rows.filter((r) => r.skill.ch === ch) }))
        ).filter((g) => g.rows.length);
        const pct = (x) => Math.round(x * 100);
        const gapCount = analysis.missingIds.length;
        const summary = `
          <div class="space-y-1">
            <h3 class="font-display text-sm font-semibold text-slate-900">${rows.length} exam skills in ${groups.length} topics</h3>
            <p class="text-xs text-slate-500">Each skill is weighted by its exam marks. A skill counts as ready when your latest answers on its questions scored 70% or more.</p>
          </div>`;
        const contentCheck = `
          <section class="bg-white border border-slate-200 rounded-xl p-5 space-y-3">
            <div>
              <h2 class="font-display text-base font-semibold text-slate-900">Content check</h2>
              <p class="text-xs text-slate-500">Whether every exam skill has questions in the bank. For maintaining the question bank, not for studying.</p>
            </div>
            <div class="grid grid-cols-3 gap-2">
              <div class="bg-slate-50 border border-slate-200 rounded-lg p-3"><div class="text-[11px] text-slate-500">Questions present</div><div class="font-mono text-xl font-bold text-slate-900 mt-0.5">${pct(coverage)}%</div><div class="text-[11px] font-mono text-slate-500">${gapCount} missing</div></div>
              <div class="bg-slate-50 border border-slate-200 rounded-lg p-3"><div class="text-[11px] text-slate-500">Skills with no questions</div><div class="font-mono text-xl font-bold text-slate-900 mt-0.5">${analysis.orphanSkills.length + analysis.emptySkills.length}</div></div>
              <div class="bg-slate-50 border border-slate-200 rounded-lg p-3"><div class="text-[11px] text-slate-500">Partly covered</div><div class="font-mono text-xl font-bold text-slate-900 mt-0.5">${analysis.partialSkills.length}</div></div>
            </div>
            ${gapCount ? `<details class="text-xs"><summary class="cursor-pointer font-medium text-amber-800 py-1">Mapped questions missing from the bank</summary><div class="font-mono text-slate-600 mt-2 leading-relaxed">${analysis.missingIds.map(esc).join(', ')}</div></details>` : '<p class="text-xs text-emerald-800">Every mapped question is in the bank.</p>'}
          </section>`;
        const sum = (g, f) => g.rows.reduce((acc, r) => acc + f(r), 0);
        const groupHtml = (g) => {
          const total = sum(g, (r) => r.total), ready = sum(g, (r) => r.proficient);
          const marks = sum(g, (r) => r.skill.marks);
          return `
            <details class="bg-white border border-slate-200 rounded-lg">
              <summary class="cursor-pointer px-3 py-2.5 text-sm">
                <span class="font-semibold text-slate-800">${esc(g.title)}</span>
                <span class="text-xs text-slate-500 font-mono"> · ${g.rows.length} skills · ${marks} marks · <span class="text-emerald-700">${ready}/${total} ready</span>${g.rows.some((r) => ms.states[r.skill.id]?.status === 'retired') ? ` · ${g.rows.filter((r) => ms.states[r.skill.id]?.status === 'retired').length} mastered` : ''}</span>
                ${g.summary ? `<span class="block text-[11px] text-slate-500 font-normal mt-0.5">${esc(g.summary)}</span>` : ''}
              </summary>
              <div class="px-3 py-2 border-t border-slate-100">
                <button type="button" data-drill-chunk="${esc(g.key)}" class="px-3 py-1.5 text-xs font-medium bg-slate-900 text-white rounded-md hover:bg-slate-800">Drill this topic</button>
              </div>
              <div class="divide-y divide-slate-100">
                ${g.rows.slice().sort((x, y) => y.skill.weight - x.skill.weight).map((r) => `
                  <div class="px-3 py-2 flex flex-col sm:flex-row sm:items-center justify-between gap-1 text-xs">
                    <div class="min-w-0"><span class="text-slate-900 font-medium">${esc(r.skill.name)}</span> <span class="text-slate-400 font-mono">(${r.skill.marks} marks)</span></div>
                    <div class="font-mono shrink-0 text-slate-600">
                      ${r.total === 0 ? '<span class="text-amber-700">no questions mapped</span>'
                        : r.available === 0 ? '<span class="text-amber-700">no questions in bank yet</span>'
                        : `<span class="text-emerald-700 font-semibold">${r.proficient}/${r.total} ready</span> · ${r.attempted} attempted${r.available < r.total ? ` · <span class="text-amber-700">${r.total - r.available} not in bank</span>` : ''}`}
                      ${(() => { const h = masteryHtml(r.skill.id); return h ? `<div class="mt-1 sm:text-right">${h}</div>` : ''; })()}
                    </div>
                  </div>`).join('')}
              </div>
            </details>`;
        };
        const parts = [...new Set(groups.map((g) => g.part))];
        const list = `
          <div class="space-y-2">
            ${parts.map((part) => `
              ${part ? `<h4 class="text-[11px] font-semibold uppercase tracking-wide text-slate-500 pt-1">${esc(part)}</h4>` : ''}
              ${groups.filter((g) => g.part === part).map(groupHtml).join('')}`).join('')}
          </div>`;
        return { summary, list, contentCheck, readiness };
      }

      function renderReadinessView(root) {
        const nowMs = Date.now();
        const modStats = appState.modules.filter((m) => m.moduleCode === appState.activeModule).map((m) => ({
          mod: m,
          readiness: Scheduler.computeModuleReadiness(m, appState.nodes, appState.reviewMap, nowMs, appState.attemptLogs),
        }));
        const tab = appState.ui.readinessTab;
        const skillParts = skillMapParts();

        const tile = (label, value, sub, tone = 'text-slate-900') => `
          <div class="bg-slate-50 border border-slate-200 rounded-lg p-3">
            <div class="text-[11px] text-slate-500">${label}</div>
            <div class="font-mono text-xl font-bold ${tone} mt-0.5">${value}</div>
            <div class="text-[11px] font-mono text-slate-500">${sub}</div>
          </div>`;

        const overviewHtml = (() => {
          const map = appState.skillMap;
          const logsN = appState.masteryLogs.length;
          const card = (inner) => `<section class="bg-white border border-slate-200 rounded-xl p-4 space-y-3">${inner}</section>`;
          let start;
          if (!logsN) {
            start = card(`<h2 class="font-display text-base font-semibold text-slate-900">Where to start</h2>
              <p class="text-sm text-slate-600">Answer a few questions and this page will point you at your weakest topic.</p>
              <button type="button" data-go-study class="px-4 py-2 text-sm font-medium bg-slate-900 text-white rounded-lg hover:bg-slate-800">Start studying</button>`);
          } else {
            const ranked = map ? Weakness.topicStats(appState.masteryLogs, map).filter((t) => t.ranked) : [];
            const weakest = ranked[0];
            const titles = Object.fromEntries([...appState.nodes, ...appState.composerNodes].map((n) => [n.id, n.metadata?.title]));
            const toFixN = map ? Weakness.unresolvedMisses(appState.masteryLogs, (id) => titles[id], map, 99).length : 0;
            start = card(`<h2 class="font-display text-base font-semibold text-slate-900">Where to start</h2>
              ${weakest ? `<div class="flex items-start justify-between gap-3">
                  <div class="min-w-0"><div class="text-xs text-slate-500">Your weakest topic</div><div class="text-sm font-semibold text-slate-900">${esc(weakest.name)}</div><div class="text-[11px] text-slate-500">${weakest.missed} of your last ${weakest.window} answers missed</div></div>
                  <button type="button" data-weak-drill="${esc(weakest.id)}" class="shrink-0 px-3 py-1.5 text-xs font-medium bg-slate-900 text-white rounded-md hover:bg-slate-800">Drill</button>
                </div>` : '<p class="text-sm text-slate-600">Keep going: topics are ranked once you have answered two questions in them.</p>'}
              ${toFixN ? `<div class="flex items-center justify-between gap-3 pt-3 border-t border-slate-100"><span class="text-sm text-slate-800">${toFixN} question${toFixN === 1 ? '' : 's'} still to fix</span><button type="button" data-seg-jump="weak" class="shrink-0 px-3 py-1.5 text-xs font-medium border border-slate-300 bg-white rounded-md text-slate-800 hover:bg-slate-50">See weak spots</button></div>` : ''}`);
          }
          const modCards = modStats.map(({ mod, readiness }) => `
            <section class="bg-white border border-slate-200 rounded-xl p-4 space-y-3">
              <div class="flex items-start justify-between gap-3">
                <div class="min-w-0">
                  ${appState.modules.length > 1 ? `<div class="text-xs font-mono font-semibold text-blue-700">${esc(mod.moduleCode)}</div>` : ''}
                  <h2 class="font-display text-base font-semibold text-slate-900">${esc(mod.title)}</h2>
                </div>
                <div class="text-right shrink-0">
                  ${readiness.daysToExam !== null ? `
                    <div class="font-mono text-lg font-bold text-slate-900">${Math.round(readiness.daysToExam)}d</div>
                    <div class="text-[11px] text-slate-500">to finals</div>
                  ` : `
                    <button type="button" data-goto-settings class="text-xs font-medium text-blue-700 hover:underline">Set exam date</button>
                    <div class="text-[11px] text-slate-500">so the app can prioritise</div>
                  `}
                </div>
              </div>
              <div class="grid grid-cols-2 gap-2">
                ${skillParts.readiness !== null ? tile('Exam readiness', `${Math.round(skillParts.readiness * 100)}%`, 'weighted by marks', 'text-emerald-700') : ''}
                ${tile('Questions tried', `${Math.round(readiness.attemptedPct)}%`, `${readiness.attemptedCount} of ${readiness.totalNodes}`)}
                ${tile('Answered well', `${Math.round(readiness.proficientPct)}%`, `${readiness.proficientCount} of ${readiness.totalNodes}`, 'text-emerald-700')}
                ${tile('Not tried yet', `${readiness.neverAttemptedCount}`, 'questions')}
              </div>
              <details class="text-xs text-slate-600">
                <summary class="cursor-pointer min-h-[28px] flex items-center font-medium text-slate-700">About these numbers</summary>
                <p class="mt-1 leading-relaxed">“Answered well” means your most recent attempt on a question scored 70% or more. “Exam readiness” counts each skill in proportion to its marks. A forgetting-curve model estimates you would recall about ${Math.round(readiness.projectedRetention * 100)}% of what you have seen today (the target is ${Math.round((mod.targetRetention || 0.9) * 100)}%); treat that as a rough guide.</p>
              </details>
            </section>`).join('');
          return start + modCards + `<section class="bg-white border border-slate-200 rounded-xl p-4">${skillParts.summary}</section>`;
        })();

        const chaptersHtml = modStats.map(({ mod, readiness }) => `
          <section class="bg-white border border-slate-200 rounded-xl p-4">
            <div class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">How much of each chapter you have tried and answered well</div>
            <div class="divide-y divide-slate-100">
              ${readiness.weeks.map((w) => `
                <div class="py-2.5 text-xs">
                  <div class="min-w-0">
                    <span class="font-mono font-semibold text-slate-700">Ch ${w.weekNum}</span>
                    <span class="text-slate-900 font-medium ml-1.5">${esc(w.title)}</span>
                    ${w.examWeight !== 1 ? `<span class="text-slate-400 ml-1">(exam weight ×${w.examWeight})</span>` : ''}
                  </div>
                  ${w.count ? `
                    <div class="mt-1 flex flex-wrap items-center gap-x-3 gap-y-0.5 font-mono">
                      <span class="text-slate-900 font-semibold">${Math.round(w.attemptedPct)}% tried</span>
                      <span class="text-emerald-700 font-semibold">${Math.round(w.proficientPct)}% answered well</span>
                      <span class="text-slate-600">${w.neverAttemptedCount} not tried</span>
                    </div>
                  ` : `<div class="mt-1 text-slate-400">No questions yet</div>`}
                </div>`).join('')}
            </div>
          </section>
        `).join('');

        const weakHtml = (() => {
          const map = appState.skillMap;
          const card = (inner) => `<section class="bg-white border border-slate-200 rounded-xl p-4 space-y-3">${inner}</section>`;
          if (!appState.masteryLogs.length) {
            return card(`<h2 class="font-display text-base font-semibold text-slate-900">Nothing to diagnose yet</h2>
              <p class="text-sm text-slate-600">Answer a few questions and this page will show which topics are losing you marks, the questions still to fix, and the slips that keep coming back.</p>
              <button type="button" data-go-study class="px-4 py-2 text-sm font-medium bg-slate-900 text-white rounded-lg hover:bg-slate-800">Start studying</button>`);
          }
          if (!map) return card('<p class="text-sm text-slate-600">The skill map did not load, so topics cannot be ranked. Reload the page to try again.</p>');
          const topics = Weakness.topicStats(appState.masteryLogs, map);
          const ranked = topics.filter((t) => t.ranked);
          const shownTopics = appState.ui.weakAll ? ranked : ranked.slice(0, 5);
          const chunkName = (id) => map.chunks?.find((c) => c.id === id)?.name || '';
          const titles = Object.fromEntries([...appState.nodes, ...appState.composerNodes].map((n) => [n.id, n.metadata?.title]));
          const misses = Weakness.unresolvedMisses(appState.masteryLogs, (id) => titles[id], map, 8);
          const slips = Weakness.slipCounts(appState.attemptLogs, map);
          const now = Date.now();
          const barTone = (mean) => (mean < 0.5 ? 'bg-rose-500' : mean < 0.7 ? 'bg-amber-500' : 'bg-emerald-500');
          const drillBtn = (chunk, label = 'Drill') => `<button type="button" data-weak-drill="${esc(chunk)}" class="shrink-0 px-3 py-1.5 text-xs font-medium bg-white border border-rose-300 text-rose-800 rounded-md hover:bg-rose-50">${label}</button>`;

          const topicsHtml = shownTopics.length ? shownTopics.map((t) => {
            const pctMean = Math.round(t.mean * 100);
            return `
              <div class="border border-slate-200 rounded-lg p-3 space-y-2" data-weak-topic="${esc(t.id)}" data-rank="${t.rankScore.toFixed(3)}">
                <div class="flex items-start justify-between gap-2">
                  <div class="min-w-0">
                    <div class="text-sm font-semibold text-slate-900">${esc(t.name)}</div>
                    <div class="text-[11px] text-slate-500">${esc(t.part)} · ${t.missed} of your last ${t.window} answers missed</div>
                  </div>
                  ${drillBtn(t.id)}
                </div>
                <div class="flex items-center gap-2">
                  <div class="flex-1 h-2 rounded-full bg-slate-100 overflow-hidden" role="img" aria-label="Average score ${pctMean}%"><div class="h-full ${barTone(t.mean)}" style="width:${Math.max(3, pctMean)}%"></div></div>
                  <span class="text-[11px] font-mono text-slate-600 w-9 text-right">${pctMean}%</span>
                </div>
                ${t.weakSkills.length ? `<div class="text-[11px] text-slate-600">Most misses: ${t.weakSkills.map((k) => `${esc(k.name)} ×${k.misses}`).join(' · ')}</div>` : ''}
              </div>`;
          }).join('') : '<p class="text-sm text-slate-500">Topics are ranked once you have answered at least two questions in them.</p>';
          const moreBtn = ranked.length > 5 ? `<button type="button" id="btnWeakShowAll" class="text-xs font-medium text-blue-700 hover:underline">${appState.ui.weakAll ? 'Show the weakest 5' : `Show all ${ranked.length} topics`}</button>` : '';

          const missesHtml = misses.length ? `<button type="button" id="btnLastPass" class="mb-2 px-3 py-1.5 text-xs font-medium bg-slate-900 text-white rounded-md hover:bg-slate-800">Last pass: redo all ${Weakness.unresolvedMisses(appState.masteryLogs, () => '', map, 99).length}</button><ul class="divide-y divide-slate-100">${misses.map((m) => `
              <li class="flex items-center gap-3 py-2" data-weak-miss="${esc(m.nodeId)}">
                <div class="min-w-0 flex-1">
                  <div class="text-sm font-medium text-slate-900 truncate">${esc(m.title)}</div>
                  <div class="text-[11px] text-slate-500">${esc(chunkName(m.chunk))}${m.chunk ? ' · ' : ''}${Weakness.timeAgo(m.timestamp, now)} · ${Math.round(m.grade * 100)}%</div>
                </div>
                <button type="button" data-weak-redo="${esc(m.nodeId)}" class="shrink-0 px-3 py-1.5 text-xs font-medium bg-slate-900 text-white rounded-md hover:bg-slate-800">Redo</button>
              </li>`).join('')}</ul>` : '<p class="text-sm text-emerald-800">Nothing outstanding: every question you missed, you have since got right.</p>';

          const slipsHtml = slips.length ? `<ul class="divide-y divide-slate-100">${slips.map((x) => `
              <li class="flex items-center gap-3 py-2" data-weak-slip="${esc(x.key)}">
                <div class="min-w-0 flex-1">
                  <div class="text-sm font-medium text-slate-900">${esc(x.kind === 'skill' ? 'Missed step: ' + x.label : x.label)} <span class="font-mono text-rose-700">×${x.count}</span></div>
                  ${x.topChunk ? `<div class="text-[11px] text-slate-500">mostly in ${esc(chunkName(x.topChunk))}</div>` : ''}
                </div>
                ${x.kind === 'skill' ? `<button type="button" data-remediate-tag="${esc(x.key.slice(6))}" class="shrink-0 px-3 py-1.5 text-xs font-medium bg-white border border-rose-300 text-rose-800 rounded-md hover:bg-rose-50">Drill</button>` : (x.topChunk ? drillBtn(x.topChunk, 'Drill topic') : '')}

        $('#btnSaveModule', root)?.addEventListener('click', async () => {
          const dtRaw = $('#cfgExamDatetime', root)?.value?.trim() || '';
          const parsedTs = dtRaw ? new Date(dtRaw).getTime() : null;
          const examTimestamp = (parsedTs !== null && Number.isFinite(parsedTs)) ? parsedTs : null;
          const updatedWeeks = (mod.weeks || []).map((w) => {
            const titleInp = $(`[data-ch-title="${w.weekNum}"]`, root);
            const weightInp = $(`[data-ch-weight="${w.weekNum}"]`, root);
            const title = titleInp ? titleInp.value.trim() || w.title : w.title;

            try {
              const candidate = JSON.parse(rawLfJson);
              if (!candidate || !Array.isArray(candidate.metals) || !Array.isArray(candidate.ligands)) {
                showToast('LF JSON must contain "metals" and "ligands" arrays.', true);
                return;
              }
              parsedLfData = LF.resolveData(candidate);
            } catch (err) {
              showToast('Invalid LF Data JSON: ' + err.message, true);
              return;
            }
          }
          const pMcq = Math.max(0, Number($('#cfgPropMcq', root)?.value ?? 0.25));
          const pShort = Math.max(0, Number($('#cfgPropShort', root)?.value ?? 0.50));
          const pConst = Math.max(0, Number($('#cfgPropConstruct', root)?.value ?? 0.25));
          const pTot = (pMcq + pShort + pConst) || 1;
          const pTermMode = $('#cfgPTermMode', root)?.value === 'absolute' ? 'absolute' : 'relative';
          const includeD0D10InDiamagnetic = Boolean($('#cfgIncludeD0D10Diamagnetic', root)?.checked);
          const textbookExceptions = Boolean($('#cfgTextbookExceptions', root)?.checked);
          const nextSettings = {
            key: 'global',
            contentVersion: s.contentVersion ?? CONTENT_VERSION,
            lfSeeded: true,
            fsrs: {
              ...s.fsrs,
              requestRetention: Math.max(0.75, Math.min(0.96, Number($('#cfgRetention', root).value) || 0.90)),
              maxIntervalDays: Math.max(7, Math.min(365, Number($('#cfgMaxDays', root).value) || 90)),
            },
            includeGoldenBankInQueue: $('#cfgIncludeGolden', root).checked,
            pTermMode,
            includeD0D10InDiamagnetic,
            textbookExceptions,
            lfData: parsedLfData,
            mockPaper: {
              ...(s.mockPaper || Scheduler.DEFAULT_SETTINGS.mockPaper),
              proportions: {
                mcq_1mark: Number((pMcq / pTot).toFixed(4)),
                short_2to3: Number((pShort / pTot).toFixed(4)),
                construct_4to6: Number((pConst / pTot).toFixed(4)),
              },
            },
            llm: {
              enabled: $('#cfgLlmEnabled', root).checked,
              endpoint: $('#cfgLlmEndpoint', root).value.trim(),
              model: $('#cfgLlmModel', root).value.trim(),
              apiKey: $('#cfgLlmKey', root).value,
            },
          };
          const lfNodes = LF.generateQuestionBank(nextSettings);
          const db = await DB.init();
          const allExistingIds = (await db.questionNodes.toArray())
            .filter((n) => n.id.startsWith('lf-'))
            .map((n) => n.id);
          await db.transaction('rw', db.questionNodes, db.settings, async () => {
            if (allExistingIds.length) await db.questionNodes.bulkDelete(allExistingIds);
            await db.questionNodes.bulkPut(lfNodes);
            await db.settings.put(nextSettings);
          });
          await refreshStore();
          showToast(`Settings saved and ${lfNodes.length} LF factory questions updated in IndexedDB.`);
        });

        $('#btnExportBundle', root)?.addEventListener('click', async () => {
          const bundle = await DB.exportBundle();
          const blob = new Blob([JSON.stringify(bundle, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `mastery-bundle-${new Date().toISOString().slice(0, 10)}.json`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          showToast(`Exported ${bundle.questionNodes.length} questions and ${bundle.attemptLogs.length} attempts.`);
        });

        $('#bundleFileInput', root)?.addEventListener('change', async (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          try {
            const text = await file.text();
            const parsed = JSON.parse(text);
            const mode = $('#importModeSel', root).value;
            const stats = await DB.importBundle(parsed, mode);
            await refreshStore();
            showToast(`Imported (${mode}): ${stats.questionNodes} questions, ${stats.reviewStates} review records, ${stats.attemptLogs} attempts.`);
            render();
          } catch (err) {
            showToast('Import failed: ' + err.message, true);
          } finally {
            e.target.value = '';
          }
        });
      }

      /* ---- QuestionNodeV3 JSON Inspector / Authoring Modal ---- */
      function openNodeInspector(existingNode) {
        const modal = $('#nodeModal');
        const body = $('#nodeModalBody');
        if (!modal || !body) return;

        const template = existingNode || {
          schemaVersion: '3.0',
          id: `custom-${Date.now().toString(36)}`,
          moduleCode: appState.activeModule,
          tier: 'atomic',
          metadata: {
            title: 'New Custom Question Node',
            week: 1,
            primaryTheme: 'Custom Drill',
            conceptTags: ['custom-tag'],
            difficultyEstimate: 5.0,
            estimatedMinutes: 2,
          },
          variants: [
            {
              variantId: 'v1',
              perspectiveLabel: 'Standard Calculation',
              marks: 2,
              stem: 'Enter a single numeric calculation question here using $E = mc^2$.',
              inputSlot: { type: 'typed_short', formatHint: 'Enter integer', placeholder: 'e.g. 4' },
              evaluator: { type: 'numeric_match', targetExpr: '4', tolerance: 0.01 },
              explanation: 'Explanation here.',
            },
          ],
        };

        body.innerHTML = `
          <p class="text-xs text-slate-600">Edit or author a flat 1-Question-1-Answer <code class="font-mono bg-slate-100 px-1 rounded">QuestionNodeV3</code> JSON record. Schema validation runs before saving to IndexedDB.</p>
          <textarea data-bounded-scroll id="nodeJsonEditor" rows="18" class="w-full font-mono text-xs p-3 bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-700">${esc(JSON.stringify(template, null, 2))}</textarea>
          <div id="nodeValidationMsg" class="text-xs"></div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" id="btnValidateNodeJson" class="px-3.5 py-1.5 text-xs font-medium border border-slate-300 rounded-lg hover:bg-slate-50 text-slate-700">Validate Schema</button>
            <button type="button" id="btnSaveNodeJson" class="px-4 py-1.5 text-xs font-medium bg-slate-900 text-white rounded-lg hover:bg-slate-800">Save to IndexedDB</button>
          </div>
        `;

        const parseAndValidate = () => {
          const msgEl = $('#nodeValidationMsg', body);
          try {
            const parsed = JSON.parse($('#nodeJsonEditor', body).value);
            const res = DB.validateQuestionNodeV3(parsed);
            if (res.valid) {
              msgEl.className = 'text-xs text-emerald-700 font-medium';
              msgEl.textContent = '✓ Valid QuestionNodeV3 schema.';
              return parsed;
            }
            msgEl.className = 'text-xs text-rose-700 font-medium';
            msgEl.textContent = 'Schema errors: ' + res.errors.join('; ');
            return null;
          } catch (err) {
            msgEl.className = 'text-xs text-rose-700 font-medium';
            msgEl.textContent = 'Invalid JSON: ' + err.message;
            return null;
          }
        };

        $('#btnValidateNodeJson', body)?.addEventListener('click', parseAndValidate);
        $('#btnSaveNodeJson', body)?.addEventListener('click', async () => {
          const parsed = parseAndValidate();
          if (!parsed) return;
          const db = await DB.init();
          await db.questionNodes.put(parsed);
          await refreshStore();
          modal.classList.add('hidden');
          showToast(`Saved node "${parsed.id}" to IndexedDB.`);
          render();
        });

        modal.classList.remove('hidden');
      }

      function updateNavChrome() {
        $$('.nav-link').forEach((btn) => {
          const active = btn.dataset.nav === appState.route;
          const base = btn.dataset.variant === 'tab'
            ? `flex flex-col items-center justify-center gap-0.5 py-1.5 min-h-[52px] text-[11px] font-medium ${active ? 'text-blue-700 font-semibold' : 'text-slate-500'}`
            : `flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium ${active ? 'bg-slate-100 text-slate-900' : 'text-slate-600 hover:bg-slate-50'}`;
          btn.className = `nav-link ${base}`;
          if (active) btn.setAttribute('aria-current', 'page'); else btn.removeAttribute('aria-current');
        });
      }

      function render() {
        updateNavChrome();
        const root = $('#appRoot');
        if (!root) return;
        if (appState.cleanupWidget) { appState.cleanupWidget(); appState.cleanupWidget = null; }
        if (appState.route === 'study') renderStudyView(root);
        else if (appState.route === 'mock') renderMockView(root);
        else if (appState.route === 'readiness') renderReadinessView(root);
        else if (appState.route === 'bank') renderBankView(root);
        else if (appState.route === 'settings') renderSettingsView(root);
      }

      async function bootstrap() {
        try {
          const db = await DB.init();
          const existingSettings = await db.settings.get('global');
          if (!existingSettings || existingSettings.contentVersion !== CONTENT_VERSION) {
            const prevVersion = Number(existingSettings?.contentVersion) || 0;
            const migrated = migrateGoldenBankToNodes();
            const seedModuleCodes = new Set(SEED_MODULES.map((m) => m.moduleCode));
            const existingMods = await db.modules.toArray();
            const existingModMap = Object.fromEntries(existingMods.map((m) => [m.moduleCode, m]));
            const obsoleteModCodes = existingMods.map((m) => m.moduleCode).filter((c) => !seedModuleCodes.has(c));

            const mergedModules = SEED_MODULES.map((seedMod) => {
              const prev = existingModMap[seedMod.moduleCode];
              if (!prev) return seedMod;
              const prevWeeksByNum = new Map((prev.weeks || []).map((w) => [w.weekNum, w]));
              const weeks = (seedMod.weeks || []).map((sw) => {
                const pw = prevWeeksByNum.get(sw.weekNum);
                if (!pw) return sw;
                return {
                  ...sw,
                  ...pw,
                  weekNum: sw.weekNum,
                  title: pw.title !== undefined && pw.title !== '' ? pw.title : sw.title,
                  examWeight: pw.examWeight !== undefined && Number.isFinite(Number(pw.examWeight)) ? Number(pw.examWeight) : sw.examWeight,
                };
              });
              return {
                ...seedMod,
                ...prev,
                moduleCode: seedMod.moduleCode,
                title: prev.title !== undefined && prev.title !== '' ? prev.title : seedMod.title,
                examTimestamp: prev.examTimestamp !== undefined ? prev.examTimestamp : seedMod.examTimestamp,
                targetRetention: prev.targetRetention !== undefined ? prev.targetRetention : seedMod.targetRetention,
                weeks,
              };
            });

            const nextSettings = {
              ...Scheduler.DEFAULT_SETTINGS,
              ...(existingSettings || {}),
              key: 'global',
              contentVersion: CONTENT_VERSION,
              lfSeeded: true,
              pTermMode: existingSettings?.pTermMode === 'absolute' ? 'absolute' : 'relative',
              includeD0D10InDiamagnetic: Boolean(existingSettings?.includeD0D10InDiamagnetic),
              textbookExceptions: Boolean(existingSettings?.textbookExceptions),
              lfData: LF.resolveData(existingSettings?.lfData || LF.DEFAULT_DATA),
              includeGoldenBankInQueue: prevVersion < 2
                ? true
                : (existingSettings?.includeGoldenBankInQueue ?? Scheduler.DEFAULT_SETTINGS.includeGoldenBankInQueue),
            };
            delete nextSettings.sessionMix;
            delete nextSettings.examTimestamp;
            const lfNodes = LF.generateQuestionBank(nextSettings);

            await db.transaction('rw', db.modules, db.questionNodes, db.settings, async () => {
              if (obsoleteModCodes.length) await db.modules.bulkDelete(obsoleteModCodes);
              await db.modules.bulkPut(mergedModules);
              await db.questionNodes.bulkPut([...SEED_NODES, ...migrated, ...lfNodes]);
              if (REMOVED_NODE_IDS.length) await db.questionNodes.bulkDelete(REMOVED_NODE_IDS);
              await db.settings.put(nextSettings);
            });
          } else if (!existingSettings.lfSeeded) {
            const nextSettings = {
              ...Scheduler.DEFAULT_SETTINGS,
              ...existingSettings,
              lfSeeded: true,
              pTermMode: existingSettings.pTermMode === 'absolute' ? 'absolute' : 'relative',
              includeD0D10InDiamagnetic: Boolean(existingSettings.includeD0D10InDiamagnetic),
              textbookExceptions: Boolean(existingSettings.textbookExceptions),
              lfData: LF.resolveData(existingSettings.lfData || LF.DEFAULT_DATA),
            };
            const lfNodes = LF.generateQuestionBank(nextSettings);
            await db.transaction('rw', db.questionNodes, db.settings, async () => {
              await db.questionNodes.bulkPut(lfNodes);
              await db.settings.put(nextSettings);
            });
          }
          // A module added in a later release must show up for installs that are already on this content version.
          {
            const haveMods = new Set((await db.modules.toArray()).map((m) => m.moduleCode));
            const missingMods = SEED_MODULES.filter((m) => !haveMods.has(m.moduleCode));
            if (missingMods.length) await db.modules.bulkPut(missingMods);
          }
          // A chapter added in a later release must show up for installs that are already on this content version.
          {
            const patches = addMissingWeeks(await db.modules.toArray(), SEED_MODULES);
            if (patches.length) await db.modules.bulkPut(patches);
          }
          // Bundled content: neither call throws; the app keeps working on whatever is already stored.
          appState.content.bank = await Content.syncAllBanks(db);
          appState.content.swept = await Content.sweepOrphanedProgress(db);
          if (appState.content.swept.reviewStates || appState.content.swept.attemptLogs) console.info('[Content] removed orphaned progress', appState.content.swept);
          const loaded = await Content.loadAllSkillMaps();
          appState.skillMaps = loaded.maps;
          appState.content.skillMap = { map: loaded.maps[appState.activeModule] || null, error: loaded.error };
          await refreshStore();
          appState.content.skillMap.map = appState.skillMap;
          if (appState.activeModule !== 'CM2021') appState.mock.selectedChapters = (activeMod().weeks || []).map((w) => w.weekNum);
          renderModuleSwitch();
          $('#moduleSwitch')?.addEventListener('change', (e) => { setActiveModule(e.target.value).catch((err) => showToast('Could not switch module: ' + err.message, true)); });
          const bankStatus = appState.content.bank;
          if (bankStatus.state === 'unavailable') showToast('Bundled question bank not loaded: ' + bankStatus.error, true);
          else if (bankStatus.rejected.length) showToast(`Bundled bank: ${bankStatus.rejected.length} node(s) rejected (see console).`, true);
          if (bankStatus.rejected.length) console.warn('[Content] rejected bundled nodes', bankStatus.rejected);
          if (appState.content.skillMap.error) console.warn('[Content] skill map not loaded:', appState.content.skillMap.error);

          // Bind global chrome
          $$('.nav-link').forEach((btn) => {
            btn.addEventListener('click', () => {
              appState.route = btn.dataset.nav;
              if (appState.route === 'study' && !appState.current) loadNextQuestion();
              else render();
            });
          });
          $('#brandHome')?.addEventListener('click', (e) => {
            e.preventDefault();
            appState.route = 'study';
            if (!appState.current) loadNextQuestion();
            else render();
          });
          $('#topQuickAction')?.addEventListener('click', () => {
            appState.route = 'study';
            appState.filters = { moduleCode: 'ALL', tier: 'ALL', skillTag: null, forceNodeId: null };
            loadNextQuestion();
          });
          $('#closeExplorerModal')?.addEventListener('click', closeExplorerModal);
          $('#explorerModal')?.addEventListener('click', (e) => { if (e.target.id === 'explorerModal') closeExplorerModal(); });
          $('#closeNodeModal')?.addEventListener('click', () => $('#nodeModal')?.classList.add('hidden'));
          $('#nodeModal')?.addEventListener('click', (e) => { if (e.target.id === 'nodeModal') $('#nodeModal')?.classList.add('hidden'); });

          loadNextQuestion();
        } catch (err) {
          const root = $('#appRoot');
          if (root) {
            root.innerHTML = `<div class="bg-rose-50 border border-rose-200 rounded-xl p-6 text-sm text-rose-900">Initialization Error: ${esc(err.message)}</div>`;
          }
        }
      }

      return {
        bootstrap,
        appState,
        loadNextQuestion,
        openExplorerModal,
        openNodeInspector,
        startMockPaper,
        beginMockSubmitFlow,
        finalizeMockPaper,
        isDrawThenCompareVariant,
        renderVisualAssetHtml,
        render,
      };
    })();

    window.__MASTERY_ENGINE__ = {
      Expr,
      DB,
      Content,
      Scheduler,
      Mastery,
      Review,
      Weakness,
      IsomerEngine,
      LF,
      Evaluators,
      Widgets,
      UI,
      migrateGoldenBankToNodes,
      CONTENT_VERSION,
      REMOVED_NODE_IDS,
      SEED_MODULES,
      SEED_NODES,
      addMissingWeeks,
    };

    if (typeof document !== 'undefined') {
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => UI.bootstrap());
      } else {
        UI.bootstrap();
      }
    }
  </script>
</body>
</html>
